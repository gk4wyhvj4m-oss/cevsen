, {"n": 87, "title": "Seksen Yedinci Bâb", "e": [{"ar": "يَا حَبِيبَ الْبَكَّٓائِينَ", "ok": "Yâ habîbe’l-bekkâîn", "tr": "Ey mehâfet ve mehâbetinden dolayı gözyaşı döken kullarını çok seven ve onlarca çok sevilen!"}, {"ar": "يَا سَنَدَ الْمُتَوَكِّلِينَ", "ok": "Yâ senede’l-mütevekkilîn", "tr": "Ey her şeyi sonsuz kudretine havale eden mütevekkil kullarının biricik dayanağı olan!"}, {"ar": "يَا هَادِيَ الْمُضِلِّينَ", "ok": "Yâ hâdiye’l-mudıllîn", "tr": "Ey dalâlet içerisinde ve idlâl yolunda olan kullarını dilerse hidayete erdiren!"}, {"ar": "يَا وَلِيَّ الْمُؤْمِنِينَ", "ok": "Yâ veliyye’l-mü’minîn", "tr": "Ey gönülden inanan kullarının yüce dostu olan!"}, {"ar": "يَٓا اَنِيسَ الذَّاكِرِينَ", "ok": "Yâ enîse’z-zâkirîn", "tr": "Ey Kendisini bütün esmâ-i hüs­nâsıyla, bütün sıfât-ı kudsiyesiyle yâd eden zâkirlerin enîsi olan ve onların ruhlarına üns esintileri salan!"}, {"ar": "يَٓا اَقْدَرَ الْقَادِرِينَ", "ok": "Yâ akdere’l-kâdirîn", "tr": "Ey sonsuz güç ve kudreti, hiçbir güç ve kudretle mukayese edilemeyen!"}, {"ar": "يَٓا اَبْصَرَ النَّاظِرِينَ", "ok": "Yâ ebsare’n-nâzırîn", "tr": "Ey görmesi bütün görmelerin üstünde olan ve her şeyi Yüce Zâtına mahsus bir basarla gören!"}, {"ar": "يَٓا اَعْلَمَ الْعَالِمِينَ", "ok": "Yâ a’leme’l-âlimîn", "tr": "Ey olmuş-olacak, cüz’î-küllî her şeyi sadece Kendisi bilen!"}, {"ar": "يَا مَفْزَعَ الْمَلْهُوفِينَ", "ok": "Yâ mefze’a’l-melhûfîn", "tr": "Ey mahzun ve mükedder kullarının yegâne melce ve sığınağı olan!"}, {"ar": "يَٓا اَنْصَرَ النَّاصِرِينَ", "ok": "Yâ ensare’n-nâsırîn", "tr": "Ey nusret ve yardımı başka hiçbir yardıma ihtiyaç bırakmayacak kadar büyük olan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 88, "title": "Seksen Sekizinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Şu güzellerden güzel isimlerin hatırı için Senden diliyor ve dileniyorum:"}, {"ar": "يَا مُكْرِمُ", "ok": "Yâ Mükrim", "tr": "Ey sonsuz hazinelerindeki nimetleri bol bol ikram eden Mükrim!"}, {"ar": "يَا مُعَظِّمُ", "ok": "Yâ Mu’azzım", "tr": "Ey ululuk ve azametini isim, sıfat ve fiilleriyle gösteren Muazzım!"}, {"ar": "يَا مُنَعِّمُ", "ok": "Yâ Müna’im", "tr": "Ey her bir varlığa ihtiyacı olan nimeti, ihtiyacı olan vakitte yetiştiren Müna’im!"}, {"ar": "يَا مُعْطِي", "ok": "Yâ Mu’tî", "tr": "Ey hikmeti muktezasınca, dilediğine dilediğini veren Mu’tî!"}, {"ar": "يَا مُغْنِي", "ok": "Yâ Muğnî", "tr": "Ey zenginlik bahşeden ve gönülleri zengin kılan Muğnî!"}, {"ar": "يَا مُحْيِي", "ok": "Yâ Muhyî", "tr": "Ey maddî, mânevî hayat lütfeden; can verip varlık sahasına çıkaran ve öldükten sonra tekrar dirilten Muhyî!"}, {"ar": "يَا مُبْدِىُٔ", "ok": "Yâ Mübdi’", "tr": "Ey her şeyi ilk yaratan Mübdi’!"}, {"ar": "يَا مُرْضِي", "ok": "Yâ Mürdî", "tr": "Ey kullarını razı ve hoşnut eden Murdî!"}, {"ar": "يَا مُنْجِي", "ok": "Yâ Müncî", "tr": "Ey kullarını her türlü belâ ve musibetlerden kurtarıp sahil-i selâmete çıkaran Müncî!"}, {"ar": "يَا مُحْسِنُ", "ok": "Yâ Muhsin", "tr": "Ey her icraatını en güzel, en mükemmel şekilde gerçekleştiren ve kullarına sayısız ihsanlarda bulunan Muhsin!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 89, "title": "Seksen Dokuzuncu Bâb", "e": [{"ar": "يَا كَافِيَ كُلِّ شَيْءٍ", "ok": "Yâ kâfiye külli şey’", "tr": "Ey her şeye yeten!"}, {"ar": "يَا قَٓائِمًا عَلٰى كُلِّ شَيْءٍ", "ok": "Yâ kâimen alâ külli şey’", "tr": "Ey her şeyin üzerinde kâim olan!"}, {"ar": "يَا مَنْ لَا يُشْبِهُهُ شَيْءٌ", "ok": "Yâ men lâ yüşbihühü şey’", "tr": "Ey hiçbir şey Kendisine benzemeyen!"}, {"ar": "يَا مَنْ لَا يَزِيدُ فِي مُلْكِهِ شَيْءٌ", "ok": "Yâ men lâ yezîdu fî mülkihi şey’", "tr": "Ey hiçbir şey mülkünü artırmayan!"}, {"ar": "يَا مَنْ لَا يَنْقُصُ مِنْ خَزَٓائِنِهِ شَيْءٌ", "ok": "Yâ men lâ yenkusu min hazâinihi şey’", "tr": "Ey hiçbir şey hazinelerinden bir şey eksiltmeyen!"}, {"ar": "يَا مَنْ لَا يَخْفٰى عَلَيْهِ شَيْءٌ", "ok": "Yâ men lâ yahfâ aleyhi şey’", "tr": "Ey hiçbir şey Kendisine gizli kalmayan!"}, {"ar": "يَا مَنْ لَيْسَ كَمِثْلِهِ شَيْءٌ", "ok": "Yâ men leyse kemislihi şey’", "tr": "Ey hiçbir şey Yüce Zâtının misli ve benzeri olmayan!"}, {"ar": "يَا مَنْ بِيَدِهِ مَقَالِيدُ كُلِّ شَيْءٍ", "ok": "Yâ men biyedihi makâlîdu külli şey’", "tr": "Ey her şeyin anahtarları yed-i kudretinde bulunan!"}, {"ar": "يَا مَنْ وَسِعَتْ رَحْمَتُهُ كُلَّ شَيْءٍ", "ok": "Yâ men vesi’at rahmetühü külle şey’", "tr": "Ey rahmeti bütün her şeyi kuşatan!"}, {"ar": "يَا مَنْ يَبْقٰى وَيَفْنٰى كُلُّ شَيْءٍ", "ok": "Yâ men yebkâ ve yefnâ küllü şey’", "tr": "Ey her şey fena bulup gittikten sonra Kendisi Bâkî kalan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 90, "title": "Doksanıncı Bâb", "e": [{"ar": "يَا مَنْ لَا يَعْلَمُ الْغَيْبَ اِلَّا هُوَ", "ok": "Yâ men lâ ya’lemu’l-ğaybe illâ hüv", "tr": "Ey gaybı yalnız Yüce Zâtı bilen!"}, {"ar": "يَا مَنْ لَا يَصْرِفُ السُّٓوءَ اِلَّا هُوَ", "ok": "Yâ men lâ yasrifu’s-sûe illâ hüv", "tr": "Ey bütün kötülükleri sadece Kendisi uzaklaştırabilen!"}, {"ar": "يَا مَنْ لَا يُدَبِّرُ الْاَمْرَ اِلَّا هُوَ", "ok": "Yâ men lâ yüdebbiru’l-emre illâ hüv", "tr": "Ey her işi sevk u idareye sadece Kendisinin gücü yeten!"}, {"ar": "يَا مَنْ لَا يَغْفِرُ الذُّنُوبَ اِلَّا هُوَ", "ok": "Yâ men lâ yağfiru’z-zünûbe illâ hüv", "tr": "Ey günahları yalnız Kendisi bağışlayabilen!"}, {"ar": "يَا مَنْ لَا يُقَلِّبُ الْقُلُوبَ اِلَّا هُوَ", "ok": "Yâ men lâ yukallibu’l-kulûbe illâ hüv", "tr": "Ey kalbleri yalnız Kendisi evirip çeviren!"}, {"ar": "يَا مَنْ لَا يَخْلُقُ الْخَلْقَ اِلَّا هُوَ", "ok": "Yâ men lâ yahluku’l-halka illâ hüv", "tr": "Ey yaratma fiili sadece Kendisine mahsus olan!"}, {"ar": "يَا مَنْ لَا يُتِمُّ النِّعْمَةَ اِلَّا هُوَ", "ok": "Yâ men lâ yütimmu’n-ni’mete illâ hüv", "tr": "Ey nimetleri yalnız Kendisi ihsan eden ve tamama erdiren!"}, {"ar": "يَا مَنْ لَا يُنَزِّلُ الْغَيْثَ اِلَّا هُوَ", "ok": "Yâ men lâ yünezzilu’l-ğayse illâ hüv", "tr": "Ey semadan yağmuru sadece Kendisi indiren!"}, {"ar": "يَا مَنْ لَا يُحْيِي الْمَوْتٰى اِلَّا هُوَ", "ok": "Yâ men lâ yuhyi’l-mevtâ illâ hüv", "tr": "Ey ölüleri diriltmeye bir tek Kendisi muktedir olan!"}, {"ar": "يَا مَنْ لَا يُغْنِي عَلَى التَّحْقِيقِ اِلَّا هُوَ", "ok": "Yâ men lâ yuğnî ale’t-tahkîkı illâ hüv", "tr": "Ey hakikatte insanları sadece Yüce Zâtı iğna edip zenginleştiren!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 91, "title": "Doksan Birinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu güzellerden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا كَاشِفُ", "ok": "Yâ Kâşif", "tr": "Ey kullarının üzerindeki belâ ve musibetleri kaldıran Kâşif!"}, {"ar": "يَا فَارِجُ", "ok": "Yâ Fâric", "tr": "Ey mükedder ve mahzun kullarına fereç ve mahreçler lutfeden Fâric!"}, {"ar": "يَا فَاتِحُ", "ok": "Yâ Fâtih", "tr": "Ey mahlûkatına rızık ve rahmet kapılarını açan Fâtih!"}, {"ar": "يَا نَاصِرُ", "ok": "Yâ Nâsır", "tr": "Ey dilediklerini yardım ve nusretiyle destekleyen Nâsır!"}, {"ar": "يَا ضَامِنُ", "ok": "Yâ Dâmin", "tr": "Ey kullarının ihtiyaçlarını gidermeye ve onlara gelebilecek zararları uzaklaştırmaya kefil olan Dâmin!"}, {"ar": "يَٓا اٰمِرُ", "ok": "Yâ Âmir", "tr": "Ey “Ol!” emriyle kâinatta mutlak tasarruf sahibi olan ve kullarına, inanıp salih ameller işlemelerini emreden Âmir!"}, {"ar": "يَا نَاهِي", "ok": "Yâ Nâhî", "tr": "Ey kullarını inkâr ve isyandan nehyeden Nâhî!"}, {"ar": "يَا رَجَا", "ok": "Yâ Recâ", "tr": "Ey rahmet ve affı umulan ve teveccühlerine muntazır olunan Recâ!"}, {"ar": "يَا مُرْتَجَا", "ok": "Yâ Mürtecâ", "tr": "Ey kerem, lütuf ve ihsan sadece Kendinden beklenen Mürtecâ!"}, {"ar": "يَا عَظِيمَ الرَّجَا", "ok": "Yâ azîme’r-recâ", "tr": "Ey recâ duygusunu kullarının gönlüne armağan eden ve onların hüsn-ü zanla, rahmetinin engin tecellilerini bekledikleri Azîmü’r-Recâ!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 92, "title": "Doksan İkinci Bâb", "e": [{"ar": "يَا مُعِينَ الضُّعَفَٓاءِ", "ok": "Yâ mu’îne’d-du’afâ", "tr": "Ey zayıfların yardımcısı!"}, {"ar": "يَا كَنْزَ الْفُقَرَٓاءِ", "ok": "Yâ kenze’l-fukarâ", "tr": "Ey ihsanları, fakirlerin hazinesi!"}, {"ar": "يَا صَاحِبَ الْغُرَبَٓاءِ", "ok": "Yâ sâhibe’l-ğurebâ", "tr": "Ey gariplerin sahibi!"}, {"ar": "يَا نَاصِرَ الْاَوْلِيَٓاءِ", "ok": "Yâ nâsıre’l-evliyâ", "tr": "Ey dostları olan mü’minlerin yardımcısı!"}, {"ar": "يَا قَاهِرَ الْاَعْدَٓاءِ", "ok": "Yâ kâhire’l-a’dâ", "tr": "Ey düşmanlığı meslek hâline getirenleri kahreden!"}, {"ar": "يَا رَافِعَ السَّمَٓاءِ", "ok": "Yâ râfi’a’s-semâ", "tr": "Ey semayı yükselten!"}, {"ar": "يَا كَاشِفَ الْبَلَٓاءِ", "ok": "Yâ kâşife’l-belâ", "tr": "Ey belâları uzaklaştıran!"}, {"ar": "يَٓا اَنِيسَ الْاَوْلِيَٓاءِ", "ok": "Yâ enîse’l-evliyâ", "tr": "Ey veli kullarına enîs ü celîs olan!"}, {"ar": "يَا حَبِيبَ الْاَتْقِيَٓاءِ", "ok": "Yâ habîbe’l-etkıyâ", "tr": "Ey işlerini takva yörüngeli götüren müttaki kullarını seven ve onlarca çok sevilen!"}, {"ar": "يَٓا اِلٰهَ الْاَغْنِيَٓاءِ", "ok": "Yâ ilâhe’l-ağniyâ", "tr": "Ey bütün zenginliklerin yegâne kaynağı ve gönül zenginliğine ulaşmış bahtiyarların biricik İlâhı!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 93, "title": "Doksan Üçüncü Bâb", "e": [{"ar": "يَٓا اَوَّلَ كُلِّ شَيْءٍ وَاٰخِرَهُ", "ok": "Yâ evvele külli şey’in ve âhıreh", "tr": "Ey her şeyden evvel ve her şeyden âhir!"}, {"ar": "يَٓا اِلٰهَ كُلِّ شَيْءٍ وَصَانِعَهُ", "ok": "Yâ ilâhe külli şey’in ve sâni’ah", "tr": "Ey her şeyin ilâhı ve cemâl sahibi sanatkârı!"}, {"ar": "يَا رَازِقَ كُلِّ شَيْءٍ وَخَالِقَهُ", "ok": "Yâ râzika külli şey’in ve hâlikah", "tr": "Ey her şeyi yaratan ve rızık veren!"}, {"ar": "يَا فَاطِرَ كُلِّ شَيْءٍ وَمَلِيكَهُ", "ok": "Yâ fâtıre külli şey’in ve melîkeh", "tr": "Ey her bir şeyi yoktan ve emsalsiz şekilde varlık sahasına çıkaran ve onun sahibi olan!"}, {"ar": "يَا قَابِضَ كُلِّ شَيْءٍ وَبَاسِطَهُ", "ok": "Yâ kâbida külli şey’in ve bâsitah", "tr": "Ey bütün kâinatta can alan, ruhları sıkan, erzakı kısan ve genişletilecekleri genişleten, ruhlara inşirah veren, her şeyi bereketlendiren!"}, {"ar": "يَا مُبْدِىَٔ كُلِّ شَيْءٍ وَمُعِيدَهُ", "ok": "Yâ mübdi’e külli şey’in ve mu’îdeh", "tr": "Ey her şeyi ilk yaratan ve hayattan sonra ölümü, ölümden sonra da hayatı geri veren!"}, {"ar": "يَا مُسَبِّبَ كُلِّ شَيْءٍ وَمُقَدِّرَهُ", "ok": "Yâ müsebbibe külli şey’in ve mukaddireh", "tr": "Ey her şeyi sebepleriyle beraber yaratan ve sonsuz hikmetine göre her birine uygun ölçüler takdir eden!"}, {"ar": "يَا مُرَبِّيَ كُلِّ شَيْءٍ وَمُدَبِّرَهُ", "ok": "Yâ mürabbiye külli şey’in ve müdebbireh", "tr": "Ey her şeyi terbiye edip yetiştiren ve her şeyin tedbir ve idaresini yed-i kudretinde tutan!"}, {"ar": "يَا مُكَوِّرَ كُلِّ شَيْءٍ وَمُحَوِّلَهُ", "ok": "Yâ mükevvire külli şey’in ve muhavvileh", "tr": "Ey dilediğini dilediği gibi evirip çeviren ve hâlden hâle sokarak değişik tecellilerini sergileyen!"}, {"ar": "يَا مُحْيِيَ كُلِّ شَيْءٍ وَمُمِيتَهُ", "ok": "Yâ muhyiye külli şey’in ve mümîteh", "tr": "Ey her şeye hayat veren ve dilediği zaman verdiği hayatı geri alan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 94, "title": "Doksan Dördüncü Bâb", "e": [{"ar": "يَا خَيْرَ ذَاكِرٍ وَمَذْكُورٍ", "ok": "Yâ hayre zâkirin ve mezkûr", "tr": "Ey yalnız Yüce Zâtı, kullarını teşrif, tekrim, lütuf, ihsan, üns ve rahmet esintileriyle anan ve kulları tarafından sadece Kendisi zikir, fikir ve ibadetle anılan!"}, {"ar": "يَا خَيْرَ شَاكِرٍ وَمَشْكُورٍ", "ok": "Yâ hayre şâkirin ve meşkûr", "tr": "Ey kulları, lisan, kalb ve azalarıyla yalnız Kendisine karşı şükürle gerilen, bütün nimetlerin kaynağı sadece Kendisi olan ve şükredenlere nimetlerini artırarak mukabelede bulunan!"}, {"ar": "يَا خَيْرَ حَامِدٍ وَمَحْمُودٍ", "ok": "Yâ hayre hâmidin ve mahmûd", "tr": "Ey hamdedenlerin mükâfatlarını en güzel şekilde veren ve şan u şerefiyle herkesin hamd ü senasının biricik mercii olan, ezelden ebede bütün hamdler Kendisine raci bulunan!"}, {"ar": "يَا خَيْرَ شَاهِدٍ وَمَشْهُودٍ", "ok": "Yâ hayre şâhidin ve meşhûd", "tr": "Ey sadece Yüce Zâtı her şeyi ra’ye’l-ayn bilip gören ve varlığının delilleri her yanda en açık şekilde müşahede edilen!"}, {"ar": "يَا خَيْرَ دَاعٍ وَمَدْعُوٍّ", "ok": "Yâ hayre dâ’in ve med’uvv", "tr": "Ey kullarını dünya ve âhiretin güzelliklerine davet eden ve kullarının yüce dergâhına yönelttiği çağrı ve yakarışlara en güzel şekilde mukabelede bulunan!"}, {"ar": "يَا خَيْرَ مُجِيبٍ وَمُجَابٍ", "ok": "Yâ hayre mücîbin ve mücâb", "tr": "Ey mahlûkatının lisan-ı hâl ve kâl ile yaptıkları dualara yalnız Kendisi icabet eden ve her buyruğuna icabet edilmeye yalnız Yüce Zâtı layık olan!"}, {"ar": "يَا خَيْرَ مُونِسٍ وَاَنِيسٍ", "ok": "Yâ hayre mûnisin ve enîs", "tr": "Ey hayatlarını üns billah ufkunda sürdürenlere kat’iyen yalnızlık yaşatmayan ve maiyyetine erenleri ünsünün başdöndürücü güzellikleriyle sarıp sarmalayan!"}, {"ar": "يَا خَيْرَ صَاحِبٍ وَجَلِيسٍ", "ok": "Yâ hayre sâhibin ve celîs", "tr": "Ey sohbet ve dostluğu, huzur ve maiyyeti, samimi gönüllere aşkın vâridat ve huzur bahşeden!"}, {"ar": "يَا خَيْرَ مَقْصُودٍ وَمَطْلُوبٍ", "ok": "Yâ hayre maksûdin ve matlûb", "tr": "Ey sadece Kendisine teveccüh ve Kendisini talep bizzat bir anlam ifade eden biricik Maksûd ve hakiki Matlûb!"}, {"ar": "يَا خَيْرَ حَبِيبٍ وَمَحْبُوبٍ", "ok": "Yâ hayre habîbin ve mahbûb", "tr": "Ey sevgisi her şeyin başı, bütün sevgilerin en saf, en duru kaynağı ve Yüce Zâtı bizzat sevilmeye layık olan yegâne Mahbûb!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 95, "title": "Doksan Beşinci Bâb", "e": [{"ar": "يَا مَنْ هُوَ لِمَنْ دَعَاهُ مُجِيبٌ", "ok": "Yâ men hüve limen de’âhu mücîb", "tr": "Ey Kendisine dua ile iç döken kullarına icabet eden Mücîb!"}, {"ar": "يَا مَنْ هُوَ لِمَنْ اَطَاعَهُ حَبِيبٌ", "ok": "Yâ men hüve limen atâ’ahu habîb", "tr": "Ey ömrünü kulluk çizgisinde sürdürenleri Zâtına mahsus muhabbetle seven Habîb!"}, {"ar": "يَا مَنْ هُوَ لِمَنْ اَحَبَّهُ قَرِيبٌ", "ok": "Yâ men hüve limen ehabbehu karîb", "tr": "Ey evvelen ve bizzat Kendisini sevenlere kurbiyetini hissettiren Garîb!"}, {"ar": "يَا مَنْ هُوَ بِمَنْ اَرَادَهُ عَلِيمٌ", "ok": "Yâ men hüve bimen erâdehu alîm", "tr": "Ey Hakk'ın muradını esas kabul edip, onu takip eden ve yalnız onu arayan kullarını çok iyi bilen ve onlara farklı muamele eden Alîm!"}, {"ar": "يَا مَنْ هُوَ لِمَنْ رَجَاهُ كَرِيمٌ", "ok": "Yâ men hüve limen recâhu kerîm", "tr": "Ey kalbleriyle, Yüce Zâtının cömertliği etrafında pervaz edip O’na sığınma yollarını araştıran ve O’nun ihsanlarını uman kullarına hep keremiyle karşılık veren Kerîm!"}, {"ar": "يَا مَنْ هُوَ بِمَنْ عَصَاهُ حَلِيمٌ", "ok": "Yâ men hüve bimen asâhu halîm", "tr": "Ey sürçüp isyan işleyen ve isyanında ısrar etmeyen kullarını hemen cezalandırmayıp onlara düşünme mühleti veren Halîm!"}, {"ar": "يَا مَنْ هُوَ فِي حِلْمِهِ حَكِيمٌ", "ok": "Yâ men hüve fî hilmihi hakîm", "tr": "Ey hilm ile muamelesinde sonsuz hikmeti bulunan Hakîm!"}, {"ar": "يَا مَنْ هُوَ فِي حُكْمِهِ عَظِيمٌ", "ok": "Yâ men hüve fî hukmihi azîm", "tr": "Ey hüküm ve hâkimiyetinde büyüklük ve ululuğu müşahede edilen Azîm!"}, {"ar": "يَا مَنْ هُوَ فِي عَظَمَتِهِ رَحِيمٌ", "ok": "Yâ men hüve fî azametihi rahîm", "tr": "Ey azametiyle beraber kullarına çok merhametle muamelede bulunan Rahîm!"}, {"ar": "يَا مَنْ هُوَ فِيٓ اِحْسَانِهِ قَدِيمٌ", "ok": "Yâ men hüve fî ihsânihi kadîm", "tr": "Ey iyilik ve ihsanları ezelî olan Kadîm!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 96, "title": "Doksan Altıncı Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Yüce huzurunda, Sana şu güzellerden güzel isim­lerini zikrederek yalvarıyorum:"}, {"ar": "يَا مُسَبِّبُ", "ok": "Yâ Müsebbib", "tr": "Ey bütün sebepleri ve neticelerini yaratan Müsebbib!"}, {"ar": "يَا مُقَرِّبُ", "ok": "Yâ Mukarrib", "tr": "Ey davranışlarını taat eksenli götüren mü’minleri yakınlığıyla sevindiren Mukarrib!"}, {"ar": "يَا مُعَقِّبُ", "ok": "Yâ Mu’akkıb", "tr": "Ey açık-kapalı her şeyi görüp kontrol eden, hepsini kayda geçiren Muakkib!"}, {"ar": "يَا مُقَلِّبُ", "ok": "Yâ Mukallib", "tr": "Ey esmâ-i hüsnâsının cilvelerini göstermek üzere değişik şeyleri hâlden hâle sokan Mukallib!"}, {"ar": "يَا مُقَدِّرُ", "ok": "Yâ Mukaddir", "tr": "Ey yarattığı her şeye, hikmeti muktezasınca bir ölçü ve bir program takdir eden Mukaddir!"}, {"ar": "يَا مُرَتِّبُ", "ok": "Yâ Mürettib", "tr": "Ey bütün mevcudatı bir nizam ve intizam içerisinde tertibe koyan Mürettib!"}, {"ar": "يَا مُرَغِّبُ", "ok": "Yâ Mürağğıb", "tr": "Ey kullarını dünya ve âhiretin güzelliklerine teşvik ve terğîb eden Murağğib!"}, {"ar": "يَا مُذَكِّرُ", "ok": "Yâ Müzekkir", "tr": "Ey insanlara hak ve bâtılı gösterip onları eğri yolun encamından sakındıran Müzekkir!"}, {"ar": "يَا مُكَوِّنُ", "ok": "Yâ Mükevvin", "tr": "Ey bütün mükevvenatı yaratıp yed-i kud­retinde tutan ve idare eden Mükevvin!"}, {"ar": "يَا مُتَكَبِّرُ", "ok": "Yâ Mütekebbir", "tr": "Ey ululuk ve azamet, yücelerden yüce Zâtının lâzımı olan Mütekebbir!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 97, "title": "Doksan Yedinci Bâb", "e": [{"ar": "يَا مَنْ لَا يُشْغِلُهُ سَمْعٌ عَنْ سَمْعٍ", "ok": "Yâ men lâ yüşğılühü sem’un an sem’", "tr": "Ey gizli ya da açık, hiçbir ses diğerine engel olmadan her sesi duyan ve itibara alan!"}, {"ar": "يَا مَنْ لَا يَمْنَعُهُ فِعْلٌ عَنْ فِعْلٍ", "ok": "Yâ men lâ yemne’uhu fi’lun an fi’l", "tr": "Ey hiçbir iş başka bir işe mâni olmadan, hikmeti muktezasınca, dilediği işi dilediği zaman, dilediği gibi yapan!"}, {"ar": "يَا مَنْ لَا يُلْهِيهِ قَوْلٌ عَنْ قَوْلٍ", "ok": "Yâ men lâ yülhîhi kavlun an kavl", "tr": "Ey biri diğerlerine mâni olmadan, her bir mahlûkuna, ona uygun tarzda hitap eden!"}, {"ar": "يَا مَنْ لَا يُغَلِّطُهُ سُؤَالٌ عَنْ سُؤَالٍ", "ok": "Yâ men lâ yuğallituhu sü’âlun an sü’âl", "tr": "Ey her kulunun istek ve ihtiyaçlarını ayrı ayrı gözeten ve biri diğerine engel olmadan hepsine donanım, konum ve liyakatlerine göre cevap veren!"}, {"ar": "يَا مَنْ لَا يُبْرِمُهُ اِلْحَاحُ الْمُلِحِّينَ", "ok": "Yâ men lâ yübrimühü ilhâhu’l-mülihhîn", "tr": "Ey ısrarla el açıp dilenen kullarının ısrarı, yüce nezdinde asla bıkkınlığa sebebiyet vermeyen!"}, {"ar": "يَا مَنْ شَرَحَ بِاْلاِسْلَامِ صُدُورَ الْمُؤْمِنِينَ", "ok": "Yâ men şeraha bi’l-islâmi sudûre’l-mü’minîn", "tr": "Ey iman eden kullarının sadr u sinelerini İslâm’ın güzelliklerine açan!"}, {"ar": "يَا مَنْ اَطَابَ بِذِكْرِهِ قُلُوبَ الْمُخْبِتِينَ", "ok": "Yâ men atâbe bizikrihi kulûbe’l-muhbitîn", "tr": "Ey tevazu ve huşû ile Kendisine teveccüh eden kullarının kalblerini, zikriyle hoş ve hoşnut eyleyen!"}, {"ar": "يَا مَنْ لَا يَغِيبُ عَنْ قُلُوبِ الْمُشْتَاقِينَ", "ok": "Yâ men lâ yağîbu an kulûbi’l-müştâkîn", "tr": "Ey kalbleri, Kendisine karşı her zaman iştiyak ile coşan ve yanıp tutuşan kullarının kalblerini tarifler üstü teveccühleriyle dolduran!"}, {"ar": "يَا مَنْ هُوَ غَايَةُ مُرَادِ الْمُرِيدِينَ", "ok": "Yâ men hüve ğâyetu mürâdi’l-mürîdîn", "tr": "Ey iş ve davranışlarında sadece Kendisini dileyip iradesini Mutlak İrade’yle irtibatlandırabilenlerin murad ufku olan!"}, {"ar": "يَا مَنْ لَا يَخْفٰى عَلَيْهِ شَيْءٌ فِي الْعَالَمِينَ", "ok": "Yâ men lâ yahfâ aleyhi şey’un fi’l-âlemîn", "tr": "Ey bütün âlemlerde Kendisine hiçbir şey gizli kalmayan, her şeyi gören, duyan ve bilen!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 98, "title": "Doksan Sekizinci Bâb", "e": [{"ar": "يَا مَنْ هُوَ عِلْمُهُ سَابِقٌ", "ok": "Yâ men hüve ilmühü sâbik", "tr": "Ey ezelî ilmi Kendinden başka her şeye sebkat eden!"}, {"ar": "يَا مَنْ هُوَ وَعْدُهُ صَادِقٌ", "ok": "Yâ men hüve va’dühü sâdik", "tr": "Ey söz ve vaatleri dosdoğru olan!"}, {"ar": "يَا مَنْ هُوَ لُطْفُهُ ظَاهِرٌ", "ok": "Yâ men hüve lutfühü zâhir", "tr": "Ey lütuf ve ihsanları âşikâr olup apaçık görünen!"}, {"ar": "يَا مَنْ هُوَ اَمْرُهُ غَالِبٌ", "ok": "Yâ men hüve emruhu ğâlib", "tr": "Ey emir ve hükmü galip olan!"}, {"ar": "يَا مَنْ هُوَ كِتَابُهُ مُحْكَمٌ", "ok": "Yâ men hüve kitâbühü muhkem", "tr": "Ey kitabı sağlam ve şüphelerden uzak bulunan!"}, {"ar": "يَا مَنْ هُوَ قَضَٓاؤُهُ كَٓائِنٌ", "ok": "Yâ men hüve kadâühü kâin", "tr": "Ey hükmü mutlaka yerini bulup gerçekleşen!"}, {"ar": "يَا مَنْ هُوَ قُرْاٰنُهُ مَجِيدٌ", "ok": "Yâ men hüve kur’ânühü mecîd", "tr": "Ey Kur’ân’ı pek yüce ve şerefli olan!"}, {"ar": "يَا مَنْ هُوَ مُلْكُهُ قَدِيمٌ", "ok": "Yâ men hüve mülkühü kadîm", "tr": "Ey mülk ve hâkimiyeti ezelî ve kadîm olan!"}, {"ar": "يَا مَنْ هُوَ فَضْلُهُ مُقِيمٌ", "ok": "Yâ men hüve fadlühü mukîm", "tr": "Ey fazl u ihsanları inkıtaya uğramadan devam eden!"}, {"ar": "يَا مَنْ هُوَ عَرْشُهُ عَظِيمٌ", "ok": "Yâ men hüve arşühü azîm", "tr": "Ey Arş’ı pek yüce olan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 99, "title": "Doksan Dokuzuncu Bâb", "e": [{"ar": "يَا رَبَّ الْاَرْبَابِ", "ok": "Yâ rabbe’l-erbâb", "tr": "Ey bütün mahlûkatın yegâne Rabbi!"}, {"ar": "يَا مُفَتِّحَ الْاَبْوَابِ", "ok": "Yâ müfettiha’l-ebvâb", "tr": "Ey rahmet ve bereket, fereç ve mahreç kapıları açan!"}, {"ar": "يَا مُسَبِّبَ الْاَسْبَابِ", "ok": "Yâ müsebbibe’l-esbâb", "tr": "Ey bütün sebepleri yaratan!"}, {"ar": "يَا مُعْطِىَ الثَّوَابِ", "ok": "Yâ mu’tıye’s-sevâb", "tr": "Ey kullarının salih amellerine sevapla karşılık veren!"}, {"ar": "يَا مُلْهِمَ الصَّوَابِ", "ok": "Yâ mülhime’s-savâb", "tr": "Ey iyi, doğru ve güzeli ilham eden!"}, {"ar": "يَا مُنْشِىَٔ السَّحَابِ", "ok": "Yâ münşi’e’s-sehâb", "tr": "Ey gökyüzünde rahmet yüklü bulutlar meydana getiren!"}, {"ar": "يَا شَدِيدَ الْعِقَابِ", "ok": "Yâ şedîde’l-ikâb", "tr": "Ey cezalandırması pek şiddetli ve çetin olan!"}, {"ar": "يَا سَرِيعَ الْحِسَابِ", "ok": "Yâ serî’a’l-hisâb", "tr": "Ey hesapları pek çabuk ve süratli gören!"}, {"ar": "يَا مَنْ لَهُ اْلاِيَابُ", "ok": "Yâ men lehu’l-iyâb", "tr": "Ey her şeyin dönüşü neticede yalnız Kendisine olan!"}, {"ar": "يَا غَفُورُ يَا تَوَّابُ", "ok": "Yâ Ğafûr, yâ Tevvâb", "tr": "Ey dilediği günahları bağışlayan ve tevbeleri kabul buyuran!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 100, "title": "Yüzüncü Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Şu birbirinden güzel, güzellerden güzel isimlerin hürmetine Senden diliyor ve dileniyorum:"}, {"ar": "يَا رَبَّنَا", "ok": "Yâ Rabbenâ", "tr": "Ey bizi sayısız nimetleriyle terbiye edip yetiştiren ve varlık gayemize yönlendiren Rabbimiz!"}, {"ar": "يَا اِلٰهَنَا", "ok": "Yâ İlâhenâ", "tr": "Ey ibadetlerimizi sadece Kendisine yönelttiğimiz, ulûhiyet tahtının biricik sultanı İlâhımız!"}, {"ar": "يَا سَيِّدَنَا", "ok": "Yâ Seyyidenâ", "tr": "Ey Seyyidimiz, Efendimiz!"}, {"ar": "يَا مَوْلٰينَا", "ok": "Yâ Mevlânâ", "tr": "Ey yüce dost ve Mevlâmız!"}, {"ar": "يَا نَاصِرَنَا", "ok": "Yâ Nâsırenâ", "tr": "Ey yegâne yardımcımız!"}, {"ar": "يَا حَافِظَنَا", "ok": "Yâ Hâfizanâ", "tr": "Ey koruyup kollayanımız!"}, {"ar": "يَا قَادِرَنَا", "ok": "Yâ Kâdirenâ", "tr": "Ey sonsuz güç ve kudreti her şeyimize kâfi gelen Rabbimiz!"}, {"ar": "يَا رَازِقَنَا", "ok": "Yâ Râzikanâ", "tr": "Ey maddî-mânevî nihayetsiz rızıklarıyla bizi besleyen Râzıkımız!"}, {"ar": "يَا دَلِيلَنَا", "ok": "Yâ Delîlenâ", "tr": "Ey bize en doğru yolu gösteren delilimiz, rehberimiz!"}, {"ar": "يَا مُغِيثَنَا", "ok": "Yâ Muğîsenâ", "tr": "Ey her ihtiyacımızı gideren rahmet kaynağımız!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 101, "title": "Cevşen Duası", "e": [{"ar": "اَللّٰهُمَّ رَبَّنَا ٭ خَلِّصْنَا ٭ وَاَجِرْنَا ٭ وَنَجِّنَا مِنَ النَّارِ ٭", "ok": "Allâhümme rabbenâ, hallısnâ, ve ecirnâ, ve neccinâ mine’n-nâr", "tr": "Ey Allah’ım, ey Rabbimiz! Bizi Cehennem ateşinden halâs eyle, muhafaza et, necat ver!"}, {"ar": "وَعَافِنَا وَاعْفُ عَنَّا وَاَدْخِلْنَا الْجَنَّةَ دَارَ قُدْسِكَ مَعَ الْاَبْرَارِ ٭ بِعَفْوِكَ يَا مُجِيرُ ٭ بِفَضْلِكَ يَا غَفَّارُ", "ok": "Ve âfinâ va’fu annâ ve edhılne’l-cennete dâre kudsike me’a’l-ebrâr, bi’afvik, yâ Mücîr, bifadlik, yâ Ğaffâr", "tr": "Allah’ım, bize âfiyet ver, bizi affet, bizi iyilerle birlikte pâk ve temiz diyarın olan Cennete koy. Bunu sadece affınla yap, ey kullarını azaptan koruyan Mücîr! Fazıl ve const KEY = 'cevsen-kebir.bab';
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14"/><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"/><circle cx="12" cy="12" r="2.2"/></svg>';

const page = document.getElementById('page');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const pos = document.getElementById('pos');
const bar = document.getElementById('bar');

const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toAr = n => String(n).replace(/\d/g, d => AR_DIGITS[d]);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

let idx = 0;
try {
  const saved = parseInt(localStorage.getItem(KEY), 10);
  if (saved >= 0 && saved < DATA.length) idx = saved;
} catch (e) {}

function render() {
  const b = DATA[idx];
  const last = idx === DATA.length - 1;
  const ent = x => '<section class="e">' +
      '<p class="ar" lang="ar">' + esc(x.ar) + '</p>' +
      '<p class="ok">' + esc(x.ok) + '</p>' +
      '<p class="tr">' + esc(x.tr) + '</p></section>';
  page.innerHTML =
    '<header class="head">' +
      '<span class="num">' + (last ? STAR : toAr(b.n)) + '</span>' +
      '<div class="title">' + esc(b.title) + '</div>' +
    '</header>' +
    b.e.map(ent).join('') +
    (b.c ? '<div class="orn">' + STAR + '</div>' +
      ent(b.c).replace('class="e"', 'class="e close"') : '');
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = last;
  pos.textContent = last ? 'Duâ' : (b.n + ' / 100');
  bar.style.width = ((idx + 1) / DATA.length * 100) + '%';
  try { localStorage.setItem(KEY, String(idx)); } catch (e) {}
}

let busy = false;
function go(dir) { goTo(idx + dir); }
function goTo(to) {
  const dir = to > idx ? 1 : -1;
  if (busy || to === idx || to < 0 || to >= DATA.length) { snapBack(); return; }
  busy = true;
  page.classList.add('anim');
  page.style.transform = 'translateX(' + (dir > 0 ? -28 : 28) + '%)';
  page.style.opacity = '0';
  setTimeout(() => {
    idx = to;
    render();
    window.scrollTo(0, 0);
    page.classList.remove('anim');
    page.style.transform = 'translateX(' + (dir > 0 ? 28 : -28) + '%)';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      page.classList.add('anim');
      page.style.transform = 'translateX(0)';
      page.style.opacity = '1';
      setTimeout(() => { page.classList.remove('anim'); busy = false; }, 240);
    }));
  }, 200);
}
function snapBack() {
  page.classList.add('anim');
  page.style.transform = 'translateX(0)';
  page.style.opacity = '1';
  setTimeout(() => page.classList.remove('anim'), 240);
}

let gridHtml = '';
for (let i = 0; i < 100; i++) {
  gridHtml += '<button data-i="' + i + '">' + (i + 1) + '</button>';
  if (i % 10 === 9 && i < 99) gridHtml += '<span class="sep"></span>';
}
grid.innerHTML = gridHtml;
function openJump() {
  grid.querySelectorAll('button').forEach(b => b.classList.toggle('cur', +b.dataset.i === idx));
  duaBtn.classList.toggle('cur', idx === DATA.length - 1);
  document.body.classList.add('jump-open');
}
function closeJump() { document.body.classList.remove('jump-open'); sheet.style.transform = ''; }
pos.addEventListener('click', openJump);
veil.addEventListener('click', closeJump);
grid.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  closeJump(); setTimeout(() => goTo(+b.dataset.i), 120);
});
duaBtn.addEventListener('click', () => { closeJump(); setTimeout(() => goTo(DATA.length - 1), 120); });
let jy = null;
sheet.addEventListener('touchstart', e => { jy = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener('touchmove', e => {
  if (jy === null) return;
  const d = e.touches[0].clientY - jy;
  if (d > 0) { sheet.style.transition = 'none'; sheet.style.transform = 'translateY(' + d + 'px)'; }
}, { passive: true });
sheet.addEventListener('touchend', e => {
  const d = (e.changedTouches[0].clientY - jy) || 0; jy = null;
  sheet.style.transition = '';
  if (d > 70) closeJump(); else sheet.style.transform = '';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeJump(); });

prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

/* Wischen: links = weiter, rechts = zurück */
let sx = 0, sy = 0, dx = 0, mode = null, tracking = false;
page.addEventListener('touchstart', e => {
  if (busy || e.touches.length > 1) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  dx = 0; mode = null; tracking = true;
}, { passive: true });
page.addEventListener('touchmove', e => {
  if (!tracking) return;
  const x = e.touches[0].clientX - sx, y = e.touches[0].clientY - sy;
  if (!mode) {
    if (Math.abs(x) < 8 && Math.abs(y) < 8) return;
    mode = Math.abs(x) > Math.abs(y) * 1.15 ? 'h' : 'v';
  }
  if (mode !== 'h') return;
  if (e.cancelable) e.preventDefault();
  const edge = (x > 0 && idx === 0) || (x < 0 && idx === DATA.length - 1);
  dx = edge ? x * .25 : x;
  page.style.transform = 'translateX(' + dx + 'px)';
  page.style.opacity = String(1 - Math.min(Math.abs(dx) / window.innerWidth, 1) * .6);
}, { passive: false });
page.addEventListener('touchend', () => {
  if (!tracking) return;
  tracking = false;
  if (mode !== 'h') return;
  const th = Math.min(90, window.innerWidth * .22);
  if (dx < -th) go(1);
  else if (dx > th) go(-1);
  else snapBack();
});
page.addEventListener('touchcancel', () => { tracking = false; snapBack(); });

render();
</script>
</body>
</html>
