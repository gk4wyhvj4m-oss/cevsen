tr": "Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum Allah’ım!:"}, {"ar": "يَا قَرِيبُ", "ok": "Yâ Karîb", "tr": "Ey her şeye şah damarından daha yakın olan Karîb!"}, {"ar": "يَا رَقِيبُ", "ok": "Yâ Rakîb", "tr": "Ey zâhir-bâtın her şeyi görüp kontrol eden Rakîb!"}, {"ar": "يَا حَبِيبُ", "ok": "Yâ Habîb", "tr": "Ey muhabbet erlerinin, Yüce Zâtını yine Zâtı için sevip inkıyat ettikleri Habîb!"}, {"ar": "يَا مُجِيبُ", "ok": "Yâ Mücîb", "tr": "Ey dualara icabet eden ve isteklere mukabelede bulunan Mücîb!"}, {"ar": "يَا حَسِيبُ", "ok": "Yâ Hasîb", "tr": "Ey her şeye yeten ve herkesin hesabını görecek olan Hasîb!"}, {"ar": "يَا طَبِيبُ", "ok": "Yâ Tabîb", "tr": "Ey görünen ve görünmeyen hastalıklara şifa ihsan eden Tabîb!"}, {"ar": "يَا بَصِيرُ", "ok": "Yâ Basîr", "tr": "Ey her şeyi Zâtına mahsus basarla gören Basîr!"}, {"ar": "يَا خَبِيرُ", "ok": "Yâ Habîr", "tr": "Ey herkesten ve her şeyden haberdar Habîr!"}, {"ar": "يَا مُنِيرُ", "ok": "Yâ Münîr", "tr": "Ey nuruyla kâinatın çehresini nurlandırdığı gibi Kendisine teveccüh eden samimi gönülleri de nurlandıran Münîr!"}, {"ar": "يَا مُبِينُ", "ok": "Yâ Mübîn", "tr": "Ey tekvînî ve teşriî beyanlarıyla varlık ve birliğini apaçık gösteren Hakk-ı Mübîn!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 46, "title": "Kırk Altıncı Bâb", "e": [{"ar": "يَا غَالِبًا غَيْرَ مَغْلُوبٍ", "ok": "Yâ ğâliben ğayre mağlûb", "tr": "Ey her zaman dilediğini gerçekleştiren yegâne Gâlip!"}, {"ar": "يَا صَانِعًا غَيْرَ مَصْنُوعٍ", "ok": "Yâ sâni’an ğayre masnû’", "tr": "Ey kâinatın bağrına serpiştirilmiş birbirinden güzel masnûatın sanatperver sanatkârı, biricik Sâni’!"}, {"ar": "يَا خَالِقًا غَيْرَ مَخْلُوقٍ", "ok": "Yâ hâlikan ğayre mahlûk", "tr": "Ey Kendisinden başka bir yaratıcı olmayan yegâne Hâlık!"}, {"ar": "يَا مَالِكًا غَيْرَ مَمْلُوكٍ", "ok": "Yâ mâliken ğayre memlûk", "tr": "Ey bütün mülk Kendisine ait olan Mâlik!"}, {"ar": "يَا قَاهِرًا غَيْرَ مَقْهُورٍ", "ok": "Yâ kâhiren ğayre makhûr", "tr": "Ey her şeyi Kendi iradesine râm eden Kâhir!"}, {"ar": "يَا رَافِعًا غَيْرَ مَرْفُوعٍ", "ok": "Yâ râfi’an ğayre merfû’", "tr": "Ey makam ve mevkileri yükseltmek yalnız Zâtının şanı olan Yüceler Yücesi Râfi’!"}, {"ar": "يَا حَافِظًا غَيْرَ مَحْفُوظٍ", "ok": "Yâ hâfizan ğayre mahfûz", "tr": "Ey koruyup kollayan, Kendisi ise hiçbir zaman hiçbir şeye muhtaç olmadığı gibi korunmaya da muhtaç olmayan Hâfiz!"}, {"ar": "يَا نَاصِرًا غَيْرَ مَنْصُورٍ", "ok": "Yâ nâsıren ğayre mensûr", "tr": "Ey bütün yardım ve zaferlerin yegâne kaynağı Nâsır!"}, {"ar": "يَا شَاهِدًا غَيْرَ غَٓائِبٍ", "ok": "Yâ şâhiden ğayre ğâib", "tr": "Ey her yerde, her an hazır ve nazır olan Şâhid!"}, {"ar": "يَا قَرِيبًا غَيْرَ بَعِيدٍ", "ok": "Yâ karîben ğayre be’îd", "tr": "Ey her şeye her zaman en yakın olan Karîb!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 47, "title": "Kırk Yedinci Bâb", "e": [{"ar": "يَا نُورَ النُّورِ", "ok": "Yâ nûre’n-nûr", "tr": "Ey iman ve hidayet gibi her türlü hayır ve güzelliğin biricik ışık kaynağı, bütün nurların yegâne menbaı ve birbirinden güzel isimlerinden biri de Nur olan!"}, {"ar": "يَا مُنَوِّرَ النُّورِ", "ok": "Yâ münevvire’n-nûr", "tr": "Ey bütün nurları ve nuranileri nurlandıran!"}, {"ar": "يَا مُصَوِّرَ النُّورِ", "ok": "Yâ musavvire’n-nûr", "tr": "Ey nurlara ve nurlu varlıklara değişik sûretler bahşeden!"}, {"ar": "يَا خَالِقَ النُّورِ", "ok": "Yâ hâlika’n-nûr", "tr": "Ey bütün nurları yaratan!"}, {"ar": "يَا مُدَبِّرَ النُّورِ", "ok": "Yâ müdebbire’n-nûr", "tr": "Ey yarattığı nurlara belli ölçüler takdir eden!"}, {"ar": "يَا مُقَدِّرَ النُّورِ", "ok": "Yâ mukaddire’n-nûr", "tr": "Ey bütün kâinatı tedbir ve idare ettiği gibi nurları da dilediği gibi sevk ve idare eden!"}, {"ar": "يَا نُورًا قَبْلَ كُلِّ نُورٍ", "ok": "Yâ nûren kable külli nûr", "tr": "Ey ezelî varlığı her nurdan evvel ve semavat u arzın nuru olan!"}, {"ar": "يَا نُورًا بَعْدَ كُلِّ نُورٍ", "ok": "Yâ nûren ba’de külli nûr", "tr": "Ey başka bütün nurlar fena bulduktan sonra Kendi nuru ebedlere kadar sürecek olan!"}, {"ar": "يَا نُورًا فَوْقَ كُلِّ نُورٍ", "ok": "Yâ nûren fevka külli nûr", "tr": "Ey bütün nurların üstünde ve onların hepsinin yegâne kaynağı olan!"}, {"ar": "يَا نُورًا لَيْسَ مِثْلَهُ نُورٌ", "ok": "Yâ nûren leyse mislehu nûr", "tr": "Ey hiçbir nur Kendisinin misli ve benzeri olmayan yüce, münezzeh Nur!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 48, "title": "Kırk Sekizinci Bâb", "e": [{"ar": "يَا مَنْ عَطَٓاؤُهُ شَرِيفٌ", "ok": "Yâ men atâühü şerîf", "tr": "Ey atâ ve ihsanlarında şan u şerefini izhar eden ve onlarla kullarını şereflendiren!"}, {"ar": "يَا مَنْ فِعْلُهُ لَطِيفٌ", "ok": "Yâ men fi’lühü latîf", "tr": "Ey fiillerinde lütfunun tecellileri açıkça görünen!"}, {"ar": "يَا مَنْ لُطْفُهُ مُقِيمٌ", "ok": "Yâ men lutfühü mukîm", "tr": "Ey akıp gelen ve ötede de devam eden lütufları Kayyûmiyetinin eserlerinden olan!"}, {"ar": "يَا مَنْ اِحْسَانُهُ قَدِيمٌ", "ok": "Yâ men ihsânühü kadîm", "tr": "Ey kullarına ihsan ve iyilikleri daha onları yaratmadan başlayan!"}, {"ar": "يَا مَنْ قَوْلُهُ حَقٌّ", "ok": "Yâ men kavlühü hakk", "tr": "Ey her beyanı gerçeğin ta kendisi olan!"}, {"ar": "يَا مَنْ وَعْدُهُ صِدْقٌ", "ok": "Yâ men va’dühü sıdk", "tr": "Ey vaatlerinde her zaman sadık bulunan ve onları mutlaka yerine getiren!"}, {"ar": "يَا مَنْ عَفْوُهُ فَضْلٌ", "ok": "Yâ men afvühü fadl", "tr": "Ey kulları hak etmediği hâlde onları fazlıyla affeden!"}, {"ar": "يَا مَنْ عَذَابُهُ عَدْلٌ", "ok": "Yâ men azâbühü adl", "tr": "Ey azabı adaletinin tecellisi olan!"}, {"ar": "يَا مَنْ ذِكْرُهُ حُلْوٌ", "ok": "Yâ men zikruhu hulv", "tr": "Ey zikrinin tadına doyulmayan!"}, {"ar": "يَا مَنْ اُنْسُهُ لَذِيذٌ", "ok": "Yâ men ünsühü lezîz", "tr": "Ey kullarına enîs ü celîs olduğu zaman o ünsün lezzeti başka hiçbir şeyde bulunmayan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 49, "title": "Kırk Dokuzuncu Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا مُنَوِّلُ", "ok": "Yâ Münevvil", "tr": "Ey yarattıklarını ayrı ayrı nevale ve ihsanlara nail kılan Münevvil!"}, {"ar": "يَا مُفَصِّلُ", "ok": "Yâ Müfassıl", "tr": "Ey sayısız delil ve işaretler sergileyerek hak ile bâtılın arasını tastamam ayıran Mufassıl!"}, {"ar": "يَا مُبَدِّلُ", "ok": "Yâ Mübeddil", "tr": "Ey seyyiatı hasenata tebdil eden ve varlık âleminde yaptığı değişikliklerle sayısız esmâsının cilvelerini gösteren Mübeddil!"}, {"ar": "يَا مُسَهِّلُ", "ok": "Yâ Müsehhil", "tr": "Ey tecelli eyleyince her işi âsân eden, zorlukları kolaylığa çeviren Müsehhil!"}, {"ar": "يَا مُذَلِّلُ", "ok": "Yâ Müzellil", "tr": "Ey sonsuz kudretiyle her varlığı hükmüne râm eden ve müstahak olanları zillete maruz bırakan Müzellil!"}, {"ar": "يَا مُنَزِّلُ", "ok": "Yâ Münezzil", "tr": "Ey yüce katından melekler, kitaplar indiren; itaat edenlere rahmet, isyankârlara da belâ ve musibet yağdıran Münezzil!"}, {"ar": "يَا مُحَوِّلُ", "ok": "Yâ Muhavvil", "tr": "Ey mevcudatı ve kullarının kalblerini hâlden hâle sokarak esmâ-i hüsnâsının nakışlarını sergileyen Muhavvil!"}, {"ar": "يَا مُجَمِّلُ", "ok": "Yâ Mücemmil", "tr": "Ey cemâliyle, göz ve gönüllere kâinatın çehresinde sayısız güzellikler sunan Mücemmil!"}, {"ar": "يَا مُكَمِّلُ", "ok": "Yâ Mükemmil", "tr": "Ey her varlığı istidadının kemâl noktasına, dilediğinde de varlığın kendisini aşan istidatlara ulaştıran Mükemmil!"}, {"ar": "يَا مُفَضِّلُ", "ok": "Yâ Müfaddıl", "tr": "Ey kullarına ihsanlar bahşeden ve istediğini fazl u ihsanlarıyla başkalarından üstün kılan Mufaddil!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 50, "title": "Ellinci Bâb", "e": [{"ar": "يَا مَنْ يَرٰى وَلَا يُرٰى", "ok": "Yâ men yerâ ve lâ yürâ", "tr": "Ey herkesi ve her şeyi her an gören fakat Yüce Zâtı gözle görülmeyen!"}, {"ar": "يَا مَنْ يَخْلُقُ وَلَا يُخْلَقُ", "ok": "Yâ men yahluku ve lâ yuhlak", "tr": "Ey zâhir-bâtın her şeyi temelden yaratan ve varlığı Kendinden olan!"}, {"ar": "يَا مَنْ يَهْدِي وَلَا يُهْدٰى", "ok": "Yâ men yehdî ve lâ yühdâ", "tr": "Ey hidayete erdiren, gönülleri hidayete açan ve her hidayetin kaynağı olan!"}, {"ar": "يَا مَنْ يُحْيِي وَلَا يُحْيٰى", "ok": "Yâ men yuhyî ve lâ yuhyâ", "tr": "Ey maddî-mânevî hayat veren ve hayatı Kendinden, ebedî hayy olan!"}, {"ar": "يَا مَنْ يُطْعِمُ وَلَا يُطْعَمُ", "ok": "Yâ men yut’imu ve lâ yut’am", "tr": "Ey varlıkları doyurup besleyen fakat Kendisi hiçbir şeye muhtaç olmadığı gibi rızka da muhtaç olmayan!"}, {"ar": "يَا مَنْ يُجِيرُ وَلَا يُجَارُ", "ok": "Yâ men yücîru ve lâ yücâr", "tr": "Ey kullarını koruyup kollayan ama Kendisinin korunup kollanmaya asla ihtiyacı olmayan!"}, {"ar": "يَا مَنْ يَقْضِي وَلَا يُقْضٰى عَلَيْهِ", "ok": "Yâ men yakdî ve lâ yukdâ aleyh", "tr": "Ey dilediğini dilediği şekilde gerçekleştiren ve hükmünün önüne asla geçilemeyen!"}, {"ar": "يَا مَنْ يَحْكُمُ وَلَا يُحْكَمُ عَلَيْهِ", "ok": "Yâ men yahkümü ve lâ yuhkemu aleyh", "tr": "Ey nasıl dilerse öyle hükmeden ve hükmü karşısında durulamayan!"}, {"ar": "يَا مَنْ لَمْ يَلِدْ وَلَمْ يُولَدْ", "ok": "Yâ men lem yelid ve lem yûled", "tr": "Ey doğurma ve doğurulmuş olma gibi yaratılmışlara mahsus ârızi hâllerden münezzeh, müberra ve muallâ bulunan!"}, {"ar": "وَلَمْ يَكُنْ لَهُ كُفُوًا اَحَدٌ", "ok": "Ve lem yekün lehu küfüven ehad", "tr": "Ey hiçbir şey Yüce Zâtına denk ve benzer olmayan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 51, "title": "Elli Birinci Bâb", "e": [{"ar": "يَا نِعْمَ الْحَبِيبُ", "ok": "Yâ ni’me’l-habîb", "tr": "Ey sevgisi bütün olumsuzlukların yegâne devası olan Habîb!"}, {"ar": "يَا نِعْمَ الطَّبِيبُ", "ok": "Yâ ni’me’t-tabîb", "tr": "Ey dertlere en güzel devayı, hastalıklara en güzel şifayı sunan Tabîb!"}, {"ar": "يَا نِعْمَ الْحَسِيبُ", "ok": "Yâ ni’me’l-hasîb", "tr": "Ey her şeye yeten ve herkesin hesabını en güzel ve en uygun şekilde görecek olan Hasîb!"}, {"ar": "يَا نِعْمَ الْقَرِيبُ", "ok": "Yâ ni’me’l-karîb", "tr": "Ey kalbler ve gönüller sadece yakınlığıyla huzur ve sürur bulan Karîb!"}, {"ar": "يَا نِعْمَ الرَّقِيبُ", "ok": "Yâ ni’me’r-rakîb", "tr": "Ey yarattıklarını en güzel şekilde gören ve gözeten Rakîb!"}, {"ar": "يَا نِعْمَ الْمُجِيبُ", "ok": "Yâ ni’me’l-mücîb", "tr": "Ey lisan-ı hâl ve kâl ile yapılan yalvarış ve yakarışlara en güzel şekilde icabet eden Mücîb!"}, {"ar": "يَا نِعْمَ الْاَنِيسُ", "ok": "Yâ ni’me’l-enîs", "tr": "Ey maiyyet ufkuna erenleri ünsünün tarif edilmez güzellikleriyle sarıp sarmalayan Enîs!"}, {"ar": "يَا نِعْمَ الْوَكِيلُ", "ok": "Yâ ni’me’l-vekîl", "tr": "Ey güvenilip dayanılan ve Kendisine itimat edilen en güzel Vekîl!"}, {"ar": "يَا نِعْمَ الْمَوْلٰى", "ok": "Yâ ni’me’l-mevlâ", "tr": "Ey dostluğu hem çok yüce hem de çok güzel olan Mevlâ!"}, {"ar": "يَا نِعْمَ النَّصِيرُ", "ok": "Yâ ni’me’n-nasîr", "tr": "Ey yardımı gelip ulaştığında daha hiçbir yardıma ihtiyaç bırakmayan Nasîr!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 52, "title": "Elli İkinci Bâb", "e": [{"ar": "يَا سُرُورَ الْعَارِفِينَ", "ok": "Yâ sürûre’l-ârifîn", "tr": "Ey Hak katının gözü sürmeli enîs ü celîsleri olan âriflerin süruru!"}, {"ar": "يَٓا اَنِيسَ الْمُرِيدِينَ", "ok": "Yâ enîse’l-mürîdîn", "tr": "Ey Hakk’ın muradını her zaman kendi isteklerinin önünde tutan irade kahramanlarının enîsi!"}, {"ar": "يَا مُغِيثَ الْمُشْتَاقِينَ", "ok": "Yâ muğîse’l-müştâkîn", "tr": "Ey Kendisine aşk u iştiyakla tutuşup yananları ekstra yardımlarıyla lütuflandıran!"}, {"ar": "يَا حَبِيبَ التَّوَّابِينَ", "ok": "Yâ habîbe’t-tevvâbîn", "tr": "Ey hatalarını itiraf edip pişmanlıkla kıvranan ve bütün benliği ile Hak kapısına yönelen tevbe kahramanlarını çok seven!"}, {"ar": "يَا رَازِقَ الْمُقِلِّينَ", "ok": "Yâ râzika’l-mukıllîn", "tr": "Ey ihtiyaç içinde bulunanları sürpriz lütuflarıyla rızıklandıran!"}, {"ar": "يَا رَجَٓاءَ الْمُذْنِبِينَ", "ok": "Yâ recâe’l-müznibîn", "tr": "Ey hata edip günah işleyenlerin, rahmet ve affına itimat ettikleri biricik ümit ve recâ kaynağı!"}, {"ar": "يَا كَاشِفَ الْمَكْرُوبِينَ", "ok": "Yâ kâşife’l-mekrûbîn", "tr": "Ey keder ve tasa içinde kıvrananların gönüllerine ferah ve sürur salan!"}, {"ar": "يَا مُنَفِّسًا عَنِ الْمَغْمُومِينَ", "ok": "Yâ müneffisen ani’l-mağmûmîn", "tr": "Ey gamlı kullarına nefes aldıran, onların gamlarını gideren!"}, {"ar": "يَا مُفَرِّجًا عَنِ الْمَحْزُونِينَ", "ok": "Yâ müferricen ani’l-mahzûnîn", "tr": "Ey gönderdiği fereç ve mahreçlerle mahzun kullarının hüznünü izale eden!"}, {"ar": "يَٓا اِلٰهَ الْاَوَّلِينَ وَاْلاٰخِرِينَ", "ok": "Yâ ilâhe’l-evvelîne ve’l-âhırîn", "tr": "Ey geçmiş ve gelecek bütün mahlûkatın yegâne İlâhı!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 53, "title": "Elli Üçüncü Bâb", "e": [{"ar": "يَا رَبَّ الْجَنَّةِ وَالنَّارِ", "ok": "Yâ rabbe’l-cenneti ve’n-nâr", "tr": "Ey Cennet ve Cehennem’in Rabbi!"}, {"ar": "يَا رَبَّ النَّبِيِّينَ وَالْاَخْيَارِ", "ok": "Yâ rabbe’n-nebiyyîne ve’l-ahyâr", "tr": "Ey bütün peygamberlerin (alâ nebiyyina ve aleyhimüsselâm) ve diğer salih kulların Rabbi!"}, {"ar": "يَا رَبَّ الصِّدِّيقِينَ وَالْاَبْرَارِ", "ok": "Yâ rabbe’s-sıddîkîne ve’l-ebrâr", "tr": "Ey sadakat ve doğruluk timsali sıddıkların ve iyilik ve hayra kilitlenmiş birr ü takva erlerinin Rabbi!"}, {"ar": "يَا رَبَّ الصِّغَارِ وَالْكِبَارِ", "ok": "Yâ rabbe’s-sığâri ve’l-kibâr", "tr": "Ey büyük küçük her kimse ve her nesnenin Rabbi!"}, {"ar": "يَا رَبَّ الْحُبُوبِ وَالْاَثْمَارِ", "ok": "Yâ rabbe’l-hubûbi ve’l-esmâr", "tr": "Ey her biri birer kudret mucizesi olan çekirdek, tohum ve meyvelerin Rabbi!"}, {"ar": "يَا رَبَّ الْاَنْهَارِ وَالْاَشْجَارِ", "ok": "Yâ rabbe’l-enhâri ve’l-eşcâr", "tr": "Ey sayısız hususiyetleriyle kullarının emrine sunduğu nehir ve ağaçların Rabbi!"}, {"ar": "يَا رَبَّ الصَّحَارٰى وَالْقِفَارِ", "ok": "Yâ rabbe’s-sahârâ ve’l-kıfâr", "tr": "Ey kudret ve azameti daha açık görünen, sadece bazı bitkilerin yetiştiği uçsuz bucaksız sahraların ve hiçbir şeyin yetişmediği çorak arazilerin Rabbi!"}, {"ar": "يَا رَبَّ الْعَبِيدِ وَالْاَحْرَارِ", "ok": "Yâ rabbe’l-abîdi ve’l-ahrâr", "tr": "Ey hakları başkalarının elinde olan esirlerin ve Hakk’ın kendisine bağışladığı hakları elinde bulunduran hür kimselerin Rabbi!"}, {"ar": "يَا رَبَّ اْلاِعْلَانِ وَاْلاِسْرَارِ", "ok": "Yâ rabbe’l-i’lâni ve’l-isrâr", "tr": "Ey dilediğini açığa çıkaran, dilediğini gizleyen, açık ve gizli her şeyin Rabbi!"}, {"ar": "يَا رَبَّ اللَّيْلِ وَالنَّهَارِ", "ok": "Yâ rabbe’l-leyli ve’n-nehâr", "tr": "Ey çok şeylerin üzerini bir perde gibi örten gecenin ve ışığıyla eşyanın üzerindeki perdeyi kaldıran gündüzün Rabbi!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 54, "title": "Elli Dördüncü Bâb", "e": [{"ar": "يَا مَنْ لَحِقَ فِي كُلِّ شَيْءٍ عِلْمُهُ", "ok": "Yâ men lehika fî külli şey’in ilmüh", "tr": "Ey ilmi, olmuş-olacak, cüz’î-küllî her şeyi kuşatan!"}, {"ar": "يَا مَنْ نَفَذَ بِكُلِّ شَيْءٍ بَصَرُهُ", "ok": "Yâ men nefeze bikülli şey’in basaruh", "tr": "Ey Zâtına mahsus basarla her şeyi gören, görmesi her şeye nüfuz eden!"}, {"ar": "يَا مَنْ بَلَغَتْ اِلٰى كُلِّ شَيْءٍ قُدْرَتُهُ", "ok": "Yâ men belağat ilâ külli şey’in kudretüh", "tr": "Ey sonsuz kudreti her şeye ulaşan!"}, {"ar": "يَا مَنْ لَا يُحْصِي الْعِبَادُ نَعْمَٓائَهُ", "ok": "Yâ men lâ yuhsi’l-ibâdu na’mâeh", "tr": "Ey kulları nimetlerini saymaktan âciz olan!"}, {"ar": "يَا مَنْ لَا تَبْلُغُ الْخَلَٓائِقُ شُكْرَهُ", "ok": "Yâ men lâ tebluğu’l-halâiku şükreh", "tr": "Ey ihsan ettiği engin lütuflar karşısında hakkıyla şükür mümkün olmayan!"}, {"ar": "يَا مَنْ لَا تُدْرِكُ الْاَفْهَامُ جَلَالَهُ", "ok": "Yâ men lâ tüdriku’l-efhâmu celâleh", "tr": "Ey akıl ve dimağlar, celâl ve ululuğunu idrake güç yetiremeyen!"}, {"ar": "يَا مَنْ لَا تَنَالُ الْاَوْهَامُ كُنْهَهُ", "ok": "Yâ men lâ tenâlu’l-evhâmu künheh", "tr": "Ey künh-ü hakikatini kavrama hususunda akıl ve hayaller büsbütün kâsır ve yetersiz bulunan!"}, {"ar": "يَا مَنِ الْعَظَمَةُ وَالْكِبْرِيَٓاءُ رِدَٓاؤُهُ", "ok": "Yâ meni’l-azametu ve’l-kibriyâu ridâüh", "tr": "Ey azamet ve kibriyâ Yüce Zâtının ayrılmaz bir vasfı olan!"}, {"ar": "يَا مَنِ الْهَيْبَةُ وَالسُّلْطَانُ بَهَٓاؤُهُ", "ok": "Yâ meni’l-heybetu ve’s-sültânu behâüh", "tr": "Ey heybet ve saltanat, güzellik ve parlaklığının hususiyetlerinden olan!"}, {"ar": "يَا مَنْ تَعَزَّزَ بِالْعِزِّ بَقَٓاؤُهُ", "ok": "Yâ men te’azzeze bi’l-izzi bakâüh", "tr": "Ey izzeti ebede kadar devam edecek olan ve acz gibi noksanlıklardan her zaman münezzeh ve müberra bulunan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 55, "title": "Elli Beşinci Bâb", "e": [{"ar": "يَا مَنْ لَهُ الْمَثَلُ الْاَعْلٰى", "ok": "Yâ men lehu’l-meselu’l-a’lâ", "tr": "Ey her hususta mesel olacak en yüce vasıflar sadece Ken­disine ait olan!"}, {"ar": "يَا مَنْ لَهُ الصِّفَاتُ الْعُلٰى", "ok": "Yâ men lehu’s-sıfâtu’l-ulâ", "tr": "Ey en yüce sıfatlarla muttasıf bulunan!"}, {"ar": "يَا مَنْ لَهُ اْلاٰخِرَةُ وَاْلاُولٰى", "ok": "Yâ men lehu’l-âhıretu ve’l-ûlâ", "tr": "Ey âhiretin ve dünyanın yegâne malik ve hükümdarı!"}, {"ar": "يَا مَنْ لَهُ الْجَنَّةُ الْمَاْوٰى", "ok": "Yâ men lehu’l-cennetu’l-me’vâ", "tr": "Ey salih kullarını içine alacağı Me’vâ Cenneti Kendi mülkü olan!"}, {"ar": "يَا مَنْ لَهُ النَّارُ وَاللَّظٰى", "ok": "Yâ men lehu’n-nâru ve’l-lazâ", "tr": "Ey Cehennem ve içinde alev alev yanan ateş emrinde bulunan!"}, {"ar": "يَا مَنْ لَهُ اْلاٰيَاتُ الْكُبْرٰى", "ok": "Yâ men lehu’l-âyâtu’l-kübrâ", "tr": "Ey varlık ve birliğine işaret ve delâlet eden sayısız büyük delillerin sahibi!"}, {"ar": "يَا مَنْ لَهُ الْاَسْمَٓاءُ الْحُسْنٰى", "ok": "Yâ men lehu’l-esmâu’l-husnâ", "tr": "Ey hepsi birbirinden güzel olan esmâ-i hüsnâ’nın sahibi!"}, {"ar": "يَا مَنْ لَهُ الْحُكْمُ وَالْقَضَٓاءُ", "ok": "Yâ men lehu’l-hukmu ve’l-kadâ", "tr": "Ey hüküm ve onun icrası tamamen Kendi tasarrufunda bulunan!"}, {"ar": "يَا مَنْ لَهُ السَّمٰوَاتُ الْعُلٰى", "ok": "Yâ men lehu’s-semâvâtu’l-ulâ", "tr": "Ey içindekilerle birlikte yüce göklerin tek sahibi!"}, {"ar": "يَا مَنْ لَهُ الْعَرْشُ وَالثَّرٰى", "ok": "Yâ men lehu’l-arşu ve’s-serâ", "tr": "Ey Arş-ı Âzam’ın ve yeryüzünün yegâne Mâliki!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 56, "title": "Elli Altıncı Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerin hürmetine diliyor ve dileniyorum:"}, {"ar": "يَا عَفُوُّ", "ok": "Yâ Afüvv", "tr": "Ey günahları silip süpüren, seyyiatı hasenata çeviren Afüvv!"}, {"ar": "يَا غَفُورُ", "ok": "Yâ Ğafûr", "tr": "Ey dilediği günahları bağışlayan Ğafûr!"}, {"ar": "يَا وَدُودُ", "ok": "Yâ Vedûd", "tr": "Ey bazı kullarını muhabbete mazhar kılıp seven ve onlar tarafından sevilen Vedûd!"}, {"ar": "يَا شَكُورُ", "ok": "Yâ Şekûr", "tr": "Ey şükredeni mukabelesiz bırakmayan ve iyiliklere mutlaka karşılık veren, ihsan sahibi Şekûr!"}, {"ar": "يَا صَبُورُ", "ok": "Yâ Sabûr", "tr": "Ey yakışıksız şeylere hüsn-ü muamelede bulunan Sabûr!"}, {"ar": "يَا رَؤُوفُ", "ok": "Yâ Re’ûf", "tr": "Ey fenalıklara karşı kullarına müşfik olan Raûf!"}, {"ar": "يَا عَطُوفُ", "ok": "Yâ Atûf", "tr": "Ey merhamet ve şefkati çok olan Atûf!"}, {"ar": "يَا قُدُّوسُ", "ok": "Yâ Kuddûs", "tr": "Ey Zâtında mukaddes ve münezzeh, fiillerinde mutahhir ve munazzif Kuddûs!"}, {"ar": "يَا حَيُّ", "ok": "Yâ Hayy", "tr": "Ey hayatı Kendinden, ebedî hayy olan Hayy!"}, {"ar": "يَا قَيُّومُ", "ok": "Yâ Kayyûm", "tr": "Ey Kendi Kendine kâim olan Kayyûm!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 57, "title": "Elli Yedinci Bâb", "e": [{"ar": "يَا مَنْ هُوَ فِي السَّمَٓاءِ عَظَمَتُهُ", "ok": "Yâ men hüve fi’s-semâi azametüh", "tr": "Ey azameti göklerde bir başka tecelli eden!"}, {"ar": "يَا مَنْ هُوَ فِي الْاَرْضِ اٰيَاتُهُ", "ok": "Yâ men hüve fi’l-erdı âyâtüh", "tr": "Ey yeryüzüne varlık, birlik, kudret ve rahmetinin nice işaretlerini serpiştiren!"}, {"ar": "يَا مَنْ هُوَ فِي كُلِّ شَيْءٍ دَلَٓائِلُهُ", "ok": "Yâ men hüve fî külli şey’in delâilüh", "tr": "Ey her bir şeyde Kendisini gösteren deliller bulunan!"}, {"ar": "يَا مَنْ هُوَ فِي الْبِحَارِ عَجَٓائِبُهُ", "ok": "Yâ men hüve fi’l-bihâri acâibüh", "tr": "Ey denizlerde, göllerde hayret ve heyecan uyandıran sayısız harikulâdelikler yaratan!"}, {"ar": "يَا مَنْ يَبْدَؤُ الْخَلْقَ ثُمَّ يُعِيدُهُ", "ok": "Yâ men yebde’u’l-halka sümme yu’îdüh", "tr": "Ey her şeyi ilk yaratan ve hayattan sonra ölümü, ölümden sonra da hayatı geri veren!"}, {"ar": "يَا مَنْ هُوَ فِي الْجِبَالِ خَزَٓائِنُهُ", "ok": "Yâ men hüve fi’l-cibâli hazâinüh", "tr": "Ey dağlarda kullarının istifadesine açık hazineler depolayan!"}, {"ar": "يَا مَنْ اَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ", "ok": "Yâ men ahsene külle şey’in halakah", "tr": "Ey yarattığı her şeyi en güzel surette yapan!"}, {"ar": "يَا مَنْ اِلَيْهِ يُرْجَعُ الْاَمْرُ كُلُّهُ", "ok": "Yâ men ileyhi yürce’u’l-emru küllüh", "tr": "Ey bütün işler neticede Kendisine varan ve neye hükmederse o olan!"}, {"ar": "يَا مَنْ ظَهَرَ فِي كُلِّ شَيْءٍ لُطْفُهُ", "ok": "Yâ men zahere fî külli şey’in lutfüh", "tr": "Ey her şeyde lütfunun eserleri açıkça görünen!"}, {"ar": "يَا مَنْ يُعَرِّفُ الْخَلَٓائِقَ قُدْرَتَهُ", "ok": "Yâ men yu’arrifu’l-halâika kudreteh", "tr": "Ey yarattıklarından her birine anlayacağı şekilde kudretini gösteren!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 58, "title": "Elli Sekizinci Bâb", "e": [{"ar": "يَا حَبِيبَ مَنْ لَا حَبِيبَ لَهُ", "ok": "Yâ habîbe men lâ habîbe leh", "tr": "Ey seveni ve sevileni olmayanların hakiki seven ve sevileni!"}, {"ar": "يَا طَبِيبَ مَنْ لَا طَبِيبَ لَهُ", "ok": "Yâ tabîbe men lâ tabîbe leh", "tr": "Ey maddî-mânevî dertlerine şifa arayanların yegâne tabibi!"}, {"ar": "يَا مُجِيبَ مَنْ لَا مُجِيبَ لَهُ", "ok": "Yâ mücîbe men lâ mücîbe leh", "tr": "Ey çağrı ve yakarışlarına bir cevap bulamayanların cevap vereni, dualarına icabet edeni!"}, {"ar": "يَا شَفِيقَ مَنْ لَا شَفِيقَ لَهُ", "ok": "Yâ şefîka men lâ şefîka leh", "tr": "Ey şefkate muhtaç gönüllerin şefkat kaynağı!"}, {"ar": "يَا رَفِيقَ مَنْ لَا رَفِيقَ لَهُ", "ok": "Yâ refîka men lâ refîka leh", "tr": "Ey kimsesizlerin kimsesi!"}, {"ar": "يَا شَفِيعَ مَنْ لَا شَفِيعَ لَهُ", "ok": "Yâ şefî’a men lâ şefî’a leh", "tr": "Ey şefaat edeni bulunmayanların biricik şefaatçisi!"}, {"ar": "يَا مُغِيثَ مَنْ لَا مُغِيثَ لَهُ", "ok": "Yâ muğîse men lâ muğîse leh", "tr": "Ey âcizlerin güç kaynağı, yardım edeni!"}, {"ar": "يَا دَلِيلَ مَنْ لَا دَلِيلَ لَهُ", "ok": "Yâ delîle men lâ delîle leh", "tr": "Ey yolda kalmışların yol göstereni!"}, {"ar": "يَا قَٓائِدَ مَنْ لَا قَٓائِدَ لَهُ", "ok": "Yâ kâide men lâ kâide leh", "tr": "Ey rehbersizlik ağında yaşayanların en doğru noktaya ulaştıran mürşidi!"}, {"ar": "يَا رَاحِمَ مَنْ لَا رَاحِمَ لَهُ", "ok": "Yâ râhime men lâ râhime leh", "tr": "Ey merhamete susamış kullarının rahmet ve merhamet menbaı!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 59, "title": "Elli Dokuzuncu Bâb", "e": [{"ar": "يَا كَافِيَ مَنِ اسْتَكْفَاهُ", "ok": "Yâ kâfiye meni’stekfâh", "tr": "Ey gören, bilen ve yardım eden olarak Yüce Zâtını yeterli görenlerin her işine kâfi gelen!"}, {"ar": "يَا هَادِيَ مَنِ اسْتَهْدَاهُ", "ok": "Yâ hâdiye meni’stehdâh", "tr": "Ey hidayetini dilenenleri yolların en güzeline sevk eden!"}, {"ar": "يَا كَالِيَ مَنِ اسْتَكْلَاهُ", "ok": "Yâ kâliye meni’steklâh", "tr": "Ey hıfz u sıyanetine dehalet edenleri her zaman koruyup gözeten!"}, {"ar": "يَا دَاعِيَ مَنِ اسْتَدْعَاهُ", "ok": "Yâ dâ’iye meni’sted’âh", "tr": "Ey yakarışlarla Kendisine yönelip iç dökenlerin dualarına icabet eden!"}, {"ar": "يَا شَافِيَ مَنِ اسْتَشْفَاهُ", "ok": "Yâ şâfiye meni’steşfâh", "tr": "Ey görünür görünmez hastalıklarına şifa arayanlara şifa bahşeden!"}, {"ar": "يَا قَاضِيَ مَنِ اسْتَقْضَاهُ", "ok": "Yâ kâdıye meni’stakdâh", "tr": "Ey Kendisine el açanların ihtiyaçlarını en güzel şekilde is’âf edip yetiştiren!"}, {"ar": "يَا مُغْنِيَ مَنِ اسْتَغْنَاهُ", "ok": "Yâ muğniye meni’stağnâh", "tr": "Ey istiğna ile hareket ederek başkalarına yüz suyu dökmeyen ve Rabbilerinin gınasına itimat eden kullarını iğna eden!"}, {"ar": "يَا مُوفِيَ مَنِ اسْتَوْفَاهُ", "ok": "Yâ mûfiye meni’stevfâh", "tr": "Ey ihsan ettiği nimetleri tamamlamasını niyaz edenlerin üzerindeki nimetlerini tamama erdiren!"}, {"ar": "يَا مُقَوِّيَ مَنِ اسْتَقْوَاهُ", "ok": "Yâ mukavviye meni’stakvâh", "tr": "Ey aczini itiraf ederek Kendisinin sonsuz havl ve kuvvetine dayanan kullarını bütün güzel işlerinde destekleyen!"}, {"ar": "يَا وَلِيَّ مَنِ اسْتَوْلَاهُ", "ok": "Yâ veliyye meni’stevlâh", "tr": "Ey Kendisini Yüce Dost olarak bilip muallâ dostluğunu talep edenleri yalnız bırakmayan, onları görüp gözeten!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 60, "title": "Altmışıncı Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَٓا اَوَّلُ", "ok": "Yâ Evvel", "tr": "Ey varlığının başlangıcı olmayan ezelî, Evvel!"}, {"ar": "يَٓا اٰخِرُ", "ok": "Yâ Âhır", "tr": "Ey varlığının sonu olmayan ebedî, Âhir!"}, {"ar": "يَا ظَاهِرُ", "ok": "Yâ Zâhir", "tr": "Ey âyât ve âsârıyla apaçık Zâhir!"}, {"ar": "يَا بَاطِنُ", "ok": "Yâ Bâtın", "tr": "Ey Zâtı, hakikatiyle ihata edilmeyen Bâtın!"}, {"ar": "يَا خَالِقُ", "ok": "Yâ Hâlik", "tr": "Ey zâhir-bâtın her şeyi temelden yaratan Hâlık!"}, {"ar": "يَا رَازِقُ", "ok": "Yâ Râzik", "tr": "Ey her ihtiyaç sahibini ihtiyacına göre rızıklandıran Râzık!"}, {"ar": "يَا صَادِقُ", "ok": "Yâ Sâdik", "tr": "Ey her sözü doğru ve hak olan, her vaadini mutlaka yerine getiren Sâdık!"}, {"ar": "يَا سَابِقُ", "ok": "Yâ Sâbik", "tr": "Ey varlığının başlangıcı olmayan, her şeyden önce var olan Sâbık!"}, {"ar": "يَا سَٓائِقُ", "ok": "Yâ Sâik", "tr": "Ey varlıkları kendi istidat ve kabiliyetlerinin nihai inkişaf noktası sayılan arş-ı kemâlatlarına sevk eden Sâik!"}, {"ar": "يَا فَالِقُ", "ok": "Yâ Fâlik", "tr": "Ey karanlıktan aydınlığı çıkaran ve çekirdek ve tohumları yarıp onları geliştiren Fâlık!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 61, "title": "Altmış Birinci Bâb", "e": [{"ar": "يَا مَنْ يُقَلِّبُ اللَّيْلَ وَالنَّهَارَ", "ok": "Yâ men yukallibu’l-leyle ve’n-nehâr", "tr": "Ey gece ile gündüzü birbirine çeviren, geceyi gündüze, gündüzü geceye dönüştüren, sürelerini uzatıp kısaltan!"}, {"ar": "يَا مَنْ خَلَقَ الظُّلُمَاتِ وَالنُّورَ", "ok": "Yâ men halaka’z-zulümâti ve’n-nûr", "tr": "Ey karanlıkları ve nuru yaratan!"}, {"ar": "يَا مَنْ جَعَلَ الظِّلَّ وَالْحَرُورَ", "ok": "Yâ men ce’ale’z-zılle ve’l-harûr", "tr": "Ey gölgeyi ve serinliğini, ateş ve harareti var eden!"}, {"ar": "يَا مَنْ سَخَّرَ الشَّمْسَ وَالْقَمَرَ", "ok": "Yâ men sahhare’ş-şemse ve’l-kamer", "tr": "Ey her varlıkta olduğu gibi Güneş ve Ay’da da dilediği gibi tasarrufta bulunan!"}, {"ar": "يَا مَنْ خَلَقَ الْمَوْتَ وَالْحَيٰوةَ", "ok": "Yâ men halaka’l-mevte ve’l-hayâh", "tr": "Ey ölümü ve hayatı yaratan!"}, {"ar": "يَا مَنْ لَهُ الْخَلْقُ وَالْاَمْرُ", "ok": "Yâ men lehu’l-halku ve’l-emr", "tr": "Ey yaratmak da emretmek de Kendisine mahsus olan!"}, {"ar": "يَا مَنْ لَمْ يَتَّخِذْ صَاحِبَةً وَلَا وَلَدًا", "ok": "Yâ men lem yettahız sâhibeten ve lâ veledâ", "tr": "Ey vasıfları yüce olan, mahlûkata benzemekten, eş ve evlat edinmek gibi hususlardan münezzeh, müberra ve muallâ bulunan!"}, {"ar": "يَا مَنْ لَمْ يَكُنْ لَهُ شَرِيكٌ فِي الْمُلْكِ", "ok": "Yâ men lem yekün lehu şerîkun fi’l-mülk", "tr": "Ey mülkünde hiçbir ortağı bulunmayan!"}, {"ar": "يَا مَنْ لَمْ يَكُنْ لَهُ وَلِيٌّ مِنَ الذُّلِّ", "ok": "Yâ men lem yekün lehu veliyyun mine’z-züll", "tr": "Ey hiçbir zaman acze düşüp de bir yardım ve yardımcıya muhtaç olmayan!"}, {"ar": "يَا مَنْ لَهُ الْحَوْلُ وَالْقُوَّةُ", "ok": "Yâ men lehu’l-havlu ve’l-kuvveh", "tr": "Ey bütün zararları def’ ve bütün faydaları celbedebilecek güç ve kudret sadece Yüce Zâtında bulunan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 62, "title": "Altmış İkinci Bâb", "e": [{"ar": "يَا مَنْ يَعْلَمُ مُرَادَ الْمُرِيدِينَ", "ok": "Yâ men ya’lemu mürâde’l-mürîdîn", "tr": "Ey her bir varlığın açık gizli bütün isteklerini bilen!"}, {"ar": "يَا مَنْ يَمْلِكُ حَوَٓائِجَ السَّٓائِلِينَ", "ok": "Yâ men yemliku havâice’s-sâilîn", "tr": "Ey ihtiyacını arz edenlerin muhtaç bulunduğu her şeye malik bulunan!"}, {"ar": "يَا مَنْ يَسْمَعُ اَنِينَ الْوَالِهِينَ", "ok": "Yâ men yesme’u enîne’l-vâlihîn", "tr": "Ey endişe ve hüzünden kendilerini kaybetmiş olanların âh u eninlerini işiten!"}, {"ar": "يَا مَنْ يَرٰى بُكَٓاءَ الْخَٓائِفِينَ", "ok": "Yâ men yerâ bükâe’l-hâifîn", "tr": "Ey ruhlarını korku hissinin çepeçevre sardığı anlarda gözyaşıyla boşalan kullarının ağlamalarını gören!"}, {"ar": "يَا مَنْ يَعْلَمُ ضَمِيرَ الصَّامِتِينَ", "ok": "Yâ men ya’lemu damîre’s-sâmitîn", "tr": "Ey kendini derûnî sükût murakabesine salan kullarının gönlünde kopan çığlıklardan haberdar olan!"}, {"ar": "يَا مَنْ يَرٰى نَدَمَ النَّادِمِينَ", "ok": "Yâ men yerâ nedeme’n-nâdimîn", "tr": "Ey yaptıklarından dolayı pişmanlıkla kıvranan kullarının içten gelen nedametlerini gören!"}, {"ar": "يَا مَنْ يَقْبَلُ عُذْرَ التَّٓائِبِينَ", "ok": "Yâ men yakbelu uzre’t-tâibîn", "tr": "Ey tevbe ile yüce dergâhına teveccüh edenlerin özür ve mazeretlerini kabul eden!"}, {"ar": "يَا مَنْ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ", "ok": "Yâ men lâ yuslihu amele’l-müfsidîn", "tr": "Ey fesat için çalışan bozguncuların işlerine düzen ve kalıcılık vermeyen!"}, {"ar": "يَا مَنْ لَا يُضِيعُ اَجْرَ الْمُحْسِنِينَ", "ok": "Yâ men lâ yudî’u ecre’l-muhsinîn", "tr": "Ey amellerinde gözünü hep ihsan ufkuna diken bahtiyar kullarının ecir ve mükâfatlarını kat’iyen zayi etmeyen!"}, {"ar": "يَا مَنْ لَا يَبْعُدُ عَنْ قُلُوبِ الْعَارِفِينَ", "ok": "Yâ men lâ yeb’udu an kulûbi’l-ârifîn", "tr": "Ey Kendisini, hiç kimsenin bilmediği kadar iyi bilip tanıyan mârifet ehli âriflerin kalblerinden hiçbir zaman uzak olmayan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 63, "title": "Altmış Üçüncü Bâb", "e": [{"ar": "يَا دَٓائِمَ الْبَقَٓاءِ", "ok": "Yâ dâime’l-bakâ", "tr": "Ey kendisi için fena söz konusu olmayan, varlığı ezelî ve ebedî olan!"}, {"ar": "يَا غَافِرَ الْخَطَٓاءِ", "ok": "Yâ ğâfire’l-hatâ", "tr": "Ey hata ve günahları yarlığayan!"}, {"ar": "يَا سَامِعَ الدُّعَٓاءِ", "ok": "Yâ sâmi’a’d-du’â", "tr": "Ey duaları işiten ve onlara hikmeti muktezasınca cevap veren!"}, {"ar": "يَا وَاسِعَ الْعَطَٓاءِ", "ok": "Yâ vâsi’a’l-atâ", "tr": "Ey atâ ve ihsanları çok geniş olan!"}, {"ar": "يَا رَافِعَ السَّمَٓاءِ", "ok": "Yâ râfi’a’s-semâ", "tr": "Ey semayı yükselten!"}, {"ar": "يَا كَاشِفَ الْبَلَٓاءِ", "ok": "Yâ kâşife’l-belâ", "tr": "Ey belâ ve musibetleri def’ ü ref’ eden!"}, {"ar": "يَا عَظِيمَ الثَّنَٓاءِ", "ok": "Yâ azîme’s-senâ", "tr": "Ey güzelliği ve birbirinden güzel lütufları dolayısıyla en güzel medh ü senalar Kendisine raci olan!"}, {"ar": "يَا قَدِيمَ السَّنَٓاءِ", "ok": "Yâ kadîme’s-senâ", "tr": "Ey ululuk ve azameti ezelî ve kadîm olan!"}, {"ar": "يَا كَثِيرَ الْوَفَٓاءِ", "ok": "Yâ kesîre’l-vefâ", "tr": "Ey vaadinde her zaman vefalı olan ve sözünü mutlaka gerçekleştiren!"}, {"ar": "يَا شَرِيفَ الْجَزَٓاءِ", "ok": "Yâ şerîfe’l-cezâ", "tr": "Ey amelleri karşılığında kullarına verdiği mükâfat ve cezalar, şeref ve azametine layık olan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 64, "title": "Altmış Dördüncü Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu güzel isimlerin hatırı için diliyor ve dileniyorum:"}, {"ar": "يَا غَفَّارُ", "ok": "Yâ Ğaffâr", "tr": "Ey her türlü günah ve hataları yarlığayıp bağışlayan Ğaffâr!"}, {"ar": "يَا سَتَّارُ", "ok": "Yâ Settâr", "tr": "Ey ayıp ve kusurları örtüp gizleyen Settâr!"}, {"ar": "يَا قَهَّارُ", "ok": "Yâ Kahhâr", "tr": "Ey her şeyi Kendi iradesine râm eden Kahhâr!"}, {"ar": "يَا جَبَّارُ", "ok": "Yâ Cebbâr", "tr": "Ey elin ulaşmadığı, gücün yetmediği hâkim-i mutlak Cebbâr!"}, {"ar": "يَا صَبَّارُ", "ok": "Yâ Sabbâr", "tr": "Ey yakışıksız şeylere çok defa hüsn-ü muamelede bulunan Sabbâr!"}, {"ar": "يَا رَزَّاقُ", "ok": "Yâ Rezzâk", "tr": "Ey her ihtiyaç sahibini ihtiyacına göre rızıklandıran Rezzâk!"}, {"ar": "يَا فَتَّاحُ", "ok": "Yâ Fettâh", "tr": "Ey hayır kapılarını açan ve gaileleri savan Fettâh!"}, {"ar": "يَا عَلَّامُ", "ok": "Yâ Allâm", "tr": "Ey olmuş-olacak, cüz’î-küllî her şeyi bilen Allâm!"}, {"ar": "يَا وَهَّابُ", "ok": "Yâ Vehhâb", "tr": "Ey karşılıksız bol bol hibede bulunan Vehhâb!"}, {"ar": "يَا تَوَّابُ", "ok": "Yâ Tevvâb", "tr": "Ey tevbeye sevk eden ve tevbeleri kabul buyuran Tevvâb!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 65, "title": "Altmış Beşinci Bâb", "e": [{"ar": "يَا مَنْ خَلَقَنِي وَسَوَّانِي", "ok": "Yâ men halakanî ve sevvânî", "tr": "Ey beni bir insan olarak yaratan, isim ve sıfatlarının en parlak aynası, varlık ağacının en mükemmel meyvesi yapan!"}, {"ar": "يَا مَنْ رَزَقَنِي وَرَبَّانِي", "ok": "Yâ men rezakanî ve rabbânî", "tr": "Ey nihayetsiz ihsanlarıyla beni rızıklandıran ve terbiye edip yetiştiren!"}, {"ar": "يَا مَنْ اَطْعَمَنِي وَسَقَانِي", "ok": "Yâ men at’amenî ve sakânî", "tr": "Ey sayısız nimetleriyle beni doyuran ve susuzluğumu gideren!"}, {"ar": "يَا مَنْ قَرَّبَنِي وَاَدْنَانِي", "ok": "Yâ men karrebenî ve ednânî", "tr": "Ey gönlüme yakınlığını duyuran ve beni kurb-u huzuruna kabul buyuran!"}, {"ar": "يَا مَنْ عَصَمَنِي وَكَفَانِي", "ok": "Yâ men asamenî ve kefânî", "tr": "Ey helâke götürecek şeylerden beni koruyup kollayan ve hıfz u inayetiyle her ihtiyacıma kâfi gelen!"}, {"ar": "يَا مَنْ حَفِظَنِي وَكَلَانِي", "ok": "Yâ men hafizanî ve kelânî", "tr": "Ey beni muhafaza eden ve ilâhî inayet, riayet ve kilâetiyle görüp gözeten!"}, {"ar": "يَا مَنْ وَفَّقَنِي وَهَدَانِي", "ok": "Yâ men veffakanî ve hedânî", "tr": "Ey hayırlı, güzel işlerimde beni muvaffak kılan ve en doğru yola sevk eden!"}, {"ar": "يَا مَنْ اَعَزَّنِي وَاَغْنَانِي", "ok": "Yâ men e’azzenî ve ağnânî", "tr": "Ey ben âciz iken, merhametiyle nazar edip beni Kendi kuvvetiyle aziz ve güçlü; fakir iken Kendi malıyla gani ve zengin eyleyen!"}, {"ar": "يَا مَنْ اَمَاتَنِي وَاَحْيَانِي", "ok": "Yâ men emâtenî ve ahyânî", "tr": "Ey verdiği hayatı alıp öldüren ve yok iken dirilttiği gibi ölümden sonra tekrar dirilten, ikisi de yed-i kudretinde bulunan!"}, {"ar": "يَا مَنْ اٰنَسَنِي وَاٰوَانِي", "ok": "Yâ men ânesenî ve âvânî", "tr": "Ey beni üns ve ünsiyetinin doyulmaz saadetine erdiren ve hıfz u himaye seralarına alan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 66, "title": "Altmış Altıncı Bâb", "e": [{"ar": "يَا مَنْ يُحِقُّ الْحَقَّ بِكَلِمَاتِهِ", "ok": "Yâ men yuhıkku’l-hakka bikelimâtih", "tr": "Ey tekvînî ve teşriî kelimeleriyle hak ve hakikati apaçık ortaya koyan!"}, {"ar": "يَا مَنْ لَا مُعَقِّبَ لِحُكْمِهِ", "ok": "Yâ men lâ mu’akkıbe lihukmih", "tr": "Ey vaz’ ettiği hükmü denetleyecek ve değiştirecek hiçbir kimse ve hiçbir merci bulunmayan!"}, {"ar": "يَا مَنْ لَا رَٓادَّ لِقَضَٓائِهِ", "ok": "Yâ men lâ râdde likadâih", "tr": "Ey olmasına ferman buyurduğu bir hususu geri çevirecek hiçbir kuvvet bulunmayan!"}, {"ar": "يَا مَنْ يَحُولُ بَيْنَ الْمَرْءِ وَقَلْبِهِ", "ok": "Yâ men yehûlu beyne’l-mer’i ve kalbih", "tr": "Ey kişi ile kalbi arasına giren, ona kalbinden, kalbine ondan daha yakın olan, dilerse insanın kendi kalbiyle bile arasını açan!"}, {"ar": "يَا مَنْ يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ", "ok": "Yâ men yakbelu’t-tevbete an ibâdih", "tr": "Ey nâdim olup dönen kullarının içten tevbelerini kabul buyuran!"}, {"ar": "يَا مَنْ لَا تَنْفَعُ الشَّفَاعَةُ اِلَّا بِاِذْنِهِ", "ok": "Yâ men lâ tenfe’u’ş-şefâ’atu illâ bi-iznih", "tr": "Ey izni olmadan yüce nezdinde hiçbir şefaat fayda vermeyen!"}, {"ar": "يَا مَنِ السَّمٰوَاتُ مَطْوِيَّاتٌ بِيَمِينِهِ", "ok": "Yâ meni’s-semâvâtu matviyyâtun biyemînih", "tr": "Ey semavat ve içindekiler bükülmüş olarak yed-i kudretinde bulunan!"}, {"ar": "يَا مَنْ هُوَ اَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ", "ok": "Yâ men hüve a’lemu bimen dalle an sebîlih", "tr": "Ey Kendisinin dosdoğru yolundan sapanları en iyi bilen!"}, {"ar": "يَا مَنْ يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَٓئِكَةُ مِنْ خِيفَتِهِ", "ok": "Yâ men yüsebbihu’r-ra’du bihamdihi ve’l-melâiketu min hîfetih", "tr": "Ey gök gürlemesi hamd ile, melekler de saygılarından ötürü Yüce Zâtını takdis ve tenzih eden!"}, {"ar": "يَا مَنْ يُرْسِلُ الرِّيَاحَ بُشْرًا بَيْنَ يَدَيْ رَحْمَتِهِ", "ok": "Yâ men yürsilu’r-riyâha büşren beyne yedey rahmetih", "tr": "Ey rüzgârları, rahmeti olan yağmurun önünden müjdeci olarak gönderen!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 67, "title": "Altmış Yedinci Bâb", "e": [{"ar": "يَا مَنْ جَعَلَ الْاَرْضَ مِهَادًا", "ok": "Yâ men ce’ale’l-erda mihâdâ", "tr": "Ey yeryüzünü mahlûkatının en güzel şekilde yaşayabilmesi için elverişli bir beşik yapan!"}, {"ar": "يَا مَنْ جَعَلَ الْجِبَالَ اَوْتَادًا", "ok": "Yâ men ce’ale’l-cibâle evtâdâ", "tr": "Ey dağları arzı tutan direkler hâlinde yaratan!"}, {"ar": "يَا مَنْ جَعَلَ الشَّمْسَ سِرَاجًا", "ok": "Yâ men ce’ale’ş-şemse sirâcâ", "tr": "Ey Güneş’i gökyüzünde bir lamba yapan!"}, {"ar": "يَا مَنْ جَعَلَ الْقَمَرَ نُورًا", "ok": "Yâ men ce’ale’l-kamere nûrâ", "tr": "Ey Ay’ı semada bir nur olarak yaratan!"}, {"ar": "يَا مَنْ جَعَلَ اللَّيْلَ لِبَاسًا", "ok": "Yâ men ce’ale’l-leyle libâsâ", "tr": "Ey geceyi bir örtü kılan!"}, {"ar": "يَا مَنْ جَعَلَ النَّهَارَ مَعَاشًا", "ok": "Yâ men ce’ale’n-nehâre me’âşâ", "tr": "Ey gündüzü geçimimiz için çalışma zamanı yapan!"}, {"ar": "يَا مَنْ جَعَلَ النَّوْمَ سُبَاتًا", "ok": "Yâ men ce’ale’n-nevme sübâtâ", "tr": "Ey uykuyu bizim için bir dinlenme vasıtası yapan!"}, {"ar": "يَا مَنْ جَعَلَ السَّمَٓاءَ بِنَٓاءً", "ok": "Yâ men ce’ale’s-semâe binâ’â", "tr": "Ey semayı bir kubbe yapan!"}, {"ar": "يَا مَنْ جَعَلَ الْاَشْيَٓاءَ اَزْوَاجًا", "ok": "Yâ men ce’ale’l-eşyâe ezvâcâ", "tr": "Ey insanları ve nesneleri çift yaratan!"}, {"ar": "يَا مَنْ جَعَلَ النَّارَ مِرْصَادًا", "ok": "Yâ men ce’ale’n-nâre mirsâdâ", "tr": "Ey Cehennem’i, inkâr ve isyan edenleri cezalandırmak için gözetleyip duran bir hapishane vaziyetinde yaratan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 68, "title": "Altmış Sekizinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu güzellerden güzel isimlerin hürmetine diliyor ve dileniyorum:"}, {"ar": "يَا شَفِيعُ", "ok": "Yâ Şefî’", "tr": "Ey istediklerine rahmetiyle bizzat şefaat eden ve istediği makbul kullarına şefaat etme izni veren Şefi’!"}, {"ar": "يَا سَمِيعُ", "ok": "Yâ Semî’", "tr": "Ey gizli-açık her şeyi duyan ve itibara alan Semi’!"}, {"ar": "يَا رَفِيعُ", "ok": "Yâ Refî’", "tr": "Ey zararları ref’ eden ve dilediği kullarının mertebesini yükselten Yüceler Yücesi Refi’!"}, {"ar": "يَا مَنِيعُ", "ok": "Yâ Menî’", "tr": "Ey kullarının yegâne sığınağı ve onlara gelecek zararları men eden Meni’!"}, {"ar": "يَا بَدِيعُ", "ok": "Yâ Bedî’", "tr": "Ey varlık âleminde eşi-benzeri olmayan şeyler yaratan Bedi’!"}, {"ar": "يَا سَرِيعُ", "ok": "Yâ Serî’", "tr": "Ey dilediklerini çok süratli geliştiren ve hesapları çok çabuk gören Seri’!"}, {"ar": "يَا بَشِيرُ", "ok": "Yâ Beşîr", "tr": "Ey salih kullarını ebedî saadet ve Kendi hoşnutluğu ile müjdeleyen Beşîr!"}, {"ar": "يَا نَذِيرُ", "ok": "Yâ Nezîr", "tr": "Ey kullarını inkâr ve isyandan sakındırmak için şiddetli azabıyla korkutan Nezîr!"}, {"ar": "يَا قَدِيرُ", "ok": "Yâ Kadîr", "tr": "Ey her şeye gücü yeten Kadîr!"}, {"ar": "يَا مُقْتَدِرُ", "ok": "Yâ Muktedir", "tr": "Ey mutlak iktidar sahibi Muktedir!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 69, "title": "Altmış Dokuzuncu Bâb", "e": [{"ar": "يَا حَيُّ قَبْلَ كُلِّ حَيٍّ", "ok": "Yâ hayyu kable külli hayy", "tr": "Ey bütün canlılardan önce var olan ve hayatı Kendinden, ezelî hayy olan Hayy!"}, {"ar": "يَا حَيُّ بَعْدَ كُلِّ حَيٍّ", "ok": "Yâ hayyu ba’de külli hayy", "tr": "Ey bütün canlılar öldükten sonra Kendisi baki kalan, ebedî hayy olan Hayy!"}, {"ar": "يَا حَيُّ الَّذِي لَا يُشْبِهُهُ شَيْءٌ", "ok": "Yâ hayyu’llezî lâ yüşbihühü şey’", "tr": "Ey bütün sıfatlarında olduğu gibi hayy sıfatında da hiçbir şey Kendisine benzemeyen Hayy!"}, {"ar": "يَا حَيُّ الَّذِي لَيْسَ كَمِثْلِهِ حَيٌّ", "ok": "Yâ hayyu’llezî leyse kemislihi hayy", "tr": "Ey hiçbir canlı Kendisinin misli ve benzeri olmayan Hayy!"}, {"ar": "يَا حَيُّ الَّذِي لَا يُشَارِكُهُ حَيٌّ", "ok": "Yâ hayyu’llezî lâ yüşârikühü hayy", "tr": "Ey hayat sahibi hiçbir varlık, Kendisine hiçbir vasıf ve fiilinde şerîk ve ortak olmayan Hayy!"}, {"ar": "يَا حَيُّ الَّذِي لَا يَحْتَاجُ اِلٰى حَيٍّ", "ok": "Yâ hayyu’llezî lâ yahtâcu ilâ hayy", "tr": "Ey hiçbir canlıya muhtaç olmayan Hayy!"}, {"ar": "يَا حَيُّ الَّذِي يُمِيتُ كُلَّ حَيٍّ", "ok": "Yâ hayyu’llezî yümîtu külle hayy", "tr": "Ey zamanı gelince bütün canlılardan verdiği canı geri alan Hayy!"}, {"ar": "يَا حَيُّ الَّذِي يَرْزُقُ كُلَّ حَيٍّ", "ok": "Yâ hayyu’llezî yerzuku külle hayy", "tr": "Ey bütün hayat sahiplerinin rızkını en mükemmel şekilde veren Hayy!"}, {"ar": "يَا حَيُّ الَّذِي يُحْيِى الْمَوْتٰى", "ok": "Yâ hayyu’llezî yuhyi’l-mevtâ", "tr": "Ey varlıklara yoktan vücut urbası giydiren ve öldükten sonra tekrar dirilten Hayy!"}, {"ar": "يَا حَيُّ الَّذِي لَا يَمُوتُ", "ok": "Yâ hayyu’llezî lâ yemût", "tr": "Ey ölüm ve fena, Kendisi için asla söz konusu olmayan ezelî ve ebedî Hayy!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 70, "title": "Yetmişinci Bâb", "e": [{"ar": "يَا مَنْ لَهُ ذِكْرٌ لَا يُنْسٰى", "ok": "Yâ men lehu zikrun lâ yünsâ", "tr": "Ey kâinattaki her şey ses ve sükûtlarıyla, hareket ve duruşlarıyla, mânâ ve muhtevalarıyla hep Kendisini dillendiren!"}, {"ar": "يَا مَنْ لَهُ نُورٌ لَا يُطْفٰى", "ok": "Yâ men lehu nûrun lâ yutfâ", "tr": "Ey asla söndürülemeyen nur yalnız Kendisine ait olan!"}, {"ar": "يَا مَنْ لَهُ ثَنَٓاءٌ لَا يُحْصٰى", "ok": "Yâ men lehu senâun lâ yuhsâ", "tr": "Ey bütün mevcudat sayısız hamd ü senalarla bir tek Yüce Zâtını anan!"}, {"ar": "يَا مَنْ لَهُ نُعُوتٌ لَا تُغَيَّرُ", "ok": "Yâ men lehu nu’ûtun lâ tuğayyer", "tr": "Ey kat’iyen değişmeyen ve değişmeyecek ulvi sıfatlar sadece Kendisine ait bulunan!"}, {"ar": "يَا مَنْ لَهُ نِعَمٌ لَا تُعَدُّ", "ok": "Yâ men lehu ni’amun lâ tu’add", "tr": "Ey yarattıklarına sayılamayacak kadar çok nimetler bahşeden!"}, {"ar": "يَا مَنْ لَهُ مُلْكٌ لَا يَزُولُ", "ok": "Yâ men lehu mülkün lâ yezûl", "tr": "Ey zevali söz konusu olmayan bir mülkün, bir hâkimiyet ve saltanatın sahibi olan!"}, {"ar": "يَا مَنْ لَهُ جَلَالٌ لَا يُكَيَّفُ", "ok": "Yâ men lehu celâlun lâ yükeyyef", "tr": "Ey keyfiyeti meçhul, baş döndüren bir celâl ve azametin maliki olan!"}, {"ar": "يَا مَنْ لَهُ قَضَٓاءٌ لَا يُرَدُّ", "ok": "Yâ men lehu kadâun lâ yüredd", "tr": "Ey geri çevrilmesi imkânsız ferman ve icraatlar sadece Kendisine ait olan!"}, {"ar": "يَا مَنْ لَهُ صِفَاتٌ لَا تُبَدَّلُ", "ok": "Yâ men lehu sıfâtun lâ tübeddel", "tr": "Ey hiçbir şekilde değişmeyen yüce vasıflar yalnız Yüce Zâtına mahsus bulunan!"}, {"ar": "يَا مَنْ لَهُ كَمَالٌ لَا يُدْرَكُ", "ok": "Yâ men lehu kemâlun lâ yüdrek", "tr": "Ey idraki nâkâbil bir kemâl ve mükemmelliğin biricik sahibi olan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 71, "title": "Yetmiş Birinci Bâb", "e": [{"ar": "يَا رَبَّ الْعَالَمِينَ", "ok": "Yâ rabbe’l-âlemîn", "tr": "Ey bütün Âlemlerin Rabbi!"}, {"ar": "يَا مَالِكَ يَوْمِ الدِّينِ", "ok": "Yâ mâlike yevmi’d-dîn", "tr": "Ey Din Günü’nün yegâne Mâliki!"}, {"ar": "يَا مَنْ يُحِبُّ الصَّابِرِينَ", "ok": "Yâ men yuhibbu’s-sâbirîn", "tr": "Ey sabırlı kullarını çok seven!"}, {"ar": "يَا مَنْ يُحِبُّ التَّوَّابِينَ", "ok": "Yâ men yuhibbu’t-tevvâbîn", "tr": "Ey kullarından tevbekâr olanları çok seven!"}, {"ar": "يَا مَنْ يُحِبُّ الْمُتَطَهِّرِينَ", "ok": "Yâ men yuhibbu’l-mütatahhirîn", "tr": "Ey temizlik hususunda titiz davranan kullarını çok seven!"}, {"ar": "يَا مَنْ يُحِبُّ الْمُحْسِنِينَ", "ok": "Yâ men yuhibbu’l-muhsinîn", "tr": "Ey başkalarına iyilikte bulunan ve işlerini sağlam yapan kullarını çok seven!"}, {"ar": "يَا مَنْ هُوَ خَيْرُ النَّاصِرِينَ", "ok": "Yâ men hüve hayru’n-nâsırîn", "tr": "Ey yardımı, başka bütün yardımlardan daha hayırlı olan!"}, {"ar": "يَا مَنْ هُوَ خَيْرُ الْفَاصِلِينَ", "ok": "Yâ men hüve hayru’l-fâsılîn", "tr": "Ey doğru ile eğriyi, hak ile bâtılı birbirinden en güzel şekilde ayıran!"}, {"ar": "يَا مَنْ هُوَ خَيْرُ الشَّاكِرِينَ", "ok": "Yâ men hüve hayru’ş-şâkirîn", "tr": "Ey iyilikleri en güzel şekilde mükâfatlandıran!"}, {"ar": "يَا مَنْ هُوَ اَعْلَمُ بِالْمُفْسِدِينَ", "ok": "Yâ men hüve a’lemu bi’l-müfsidîn", "tr": "Ey fesat için çalışan bozguncuları en iyi bilen!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 72, "title": "Yetmiş İkinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا مُبْدِىُٔ", "ok": "Yâ Mübdi’", "tr": "Ey her şeyi ilk yaratan Mübdi’!"}, {"ar": "يَا مُعِيدُ", "ok": "Yâ Mu’îd", "tr": "Ey hayattan sonra ölümü, ölümden sonra da hayatı geri veren Muîd!"}, {"ar": "يَا حَفِيظُ", "ok": "Yâ Hafîz", "tr": "Ey arz u sema ve içindekileri koruyup muhafaza eden Hafîz!"}, {"ar": "يَا مُحِيطُ", "ok": "Yâ Muhît", "tr": "Ey her şeyi ilim ve kudretiyle ihata eden Muhît!"}, {"ar": "يَا حَمِيدُ", "ok": "Yâ Hamîd", "tr": "Ey herkesin hamd ü senasının biricik mercii Hamîd!"}, {"ar": "يَا مَجِيدُ", "ok": "Yâ Mecîd", "tr": "Ey zatî şan ve şeref sahibi Mecîd!"}, {"ar": "يَا مُقِيتُ", "ok": "Yâ Mukît", "tr": "Ey gıda veren, bakıp koruyan Mukît!"}, {"ar": "يَا مُغِيثُ", "ok": "Yâ Muğîs", "tr": "Ey ekstradan yardımlarda bulunan Muğîs!"}, {"ar": "يَا مُعِزُّ", "ok": "Yâ Mu’izz", "tr": "Ey dilediğini aziz kılan ve şereflendiren Muizz!"}, {"ar": "يَا مُذِلُّ", "ok": "Yâ Müzill", "tr": "Ey istediğini zelil ve rüsvay hâle getiren Müzill!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 73, "title": "Yetmiş Üçüncü Bâb", "e": [{"ar": "يَا مَنْ هُوَ اَحَدٌ بِلَا ضِدٍّ", "ok": "Yâ men hüve ehadun bilâ dıdd", "tr": "Ey zıddı olmayan tek, Ehad!"}, {"ar": "يَا مَنْ هُوَ فَرْدٌ بِلَا نِدٍّ", "ok": "Yâ men hüve ferdun bilâ nidd", "tr": "Ey misli ve niddi olmayan Ferd!"}, {"ar": "يَا مَنْ هُوَ صَمَدٌ بِلَا عَيْبٍ", "ok": "Yâ men hüve samedun bilâ ayb", "tr": "Ey bütün kusurlardan berî olan ve her şey Kendisine muhtaç bulunan Samed!"}, {"ar": "يَا مَنْ هُوَ وِتْرٌ بِلَا شَفْعٍ", "ok": "Yâ men hüve vitrun bilâ şef’", "tr": "Ey ikincisi, eşi, benzeri olmayan Vitr!"}, {"ar": "يَا مَنْ هُوَ رَبٌّ بِلَا وَزِيرٍ", "ok": "Yâ men hüve rabbun bilâ vezîr", "tr": "Ey hiçbir zaman bir vezîr, muîn ve yardımcıya ihtiyaç duymayan Rabb!"}, {"ar": "يَا مَنْ هُوَ غَنِيٌّ بِلَا فَقْرٍ", "ok": "Yâ men hüve ğaniyyun bilâ fakr", "tr": "Ey hiçbir kimseye ve hiçbir şeye muhtaç olmayan Ğaniyy!"}, {"ar": "يَا مَنْ هُوَ سُلْطَانٌ بِلَا عَزْلٍ", "ok": "Yâ men hüve sültânun bilâ azl", "tr": "Ey Kendisini azledecek bir merci ve makam kat’iyen bulunmayan sermedî Sultan!"}, {"ar": "يَا مَنْ هُوَ مَلِيكٌ بِلَا عَجْزٍ", "ok": "Yâ men hüve melîkun bilâ acz", "tr": "Ey hiçbir zaman acz yaşamayan, her şey ve herkes üzerinde her zaman mutlak tasarrufta bulunan Melîk!"}, {"ar": "يَا مَنْ هُوَ مَوْجُودٌ بِلَا مِثْلٍ", "ok": "Yâ men hüve mevcûdun bilâ misl", "tr": "Ey âlemde misli olmayan hakikî Mevcûd!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 74, "title": "Yetmiş Dördüncü Bâb", "e": [{"ar": "يَا مَنْ هُوَ ذِكْرُهُ شَرَفٌ لِلذَّاكِرِينَ", "ok": "Yâ men hüve zikruhu şerefun li’z-zâkirîn", "tr": "Ey zikri, Kendisini yüce ad ve ünvanlarıyla ananlar için en büyük şeref vesilesi olan!"}, {"ar": "يَا مَنْ هُوَ شُكْرُهُ فَوْزٌ لِلشَّاكِرِينَ", "ok": "Yâ men hüve şükruhu fevzun li’ş-şâkirîn", "tr": "Ey şükrü, nimetleri artıran, muvaffakiyet ve saadate vesile olan!"}, {"ar": "يَا مَنْ هُوَ حَمْدُهُ فَخْرٌ لِلْحَامِدِينَ", "ok": "Yâ men hüve hamdühü fahrun li’l-hâmidîn", "tr": "Ey hamd ü sena ile anılması, hamdedenler için iftihar vesilesi olan!"}, {"ar": "يَا مَنْ هُوَ طَاعَتُهُ نَجَاةٌ لِلْمُطِيعِينَ", "ok": "Yâ men hüve tâ’atühü necâtun li’l-mutî’în", "tr": "Ey Kendisine kulluk, itaatkâr kulları necata ulaştıran!"}, {"ar": "يَا مَنْ هُوَ بَابُهُ مَفْتوُحٌ لِلطَّالِبِينَ", "ok": "Yâ men hüve bâbühü meftûhun li’t-tâlibîn", "tr": "Ey kapısı, yalnız Kendisine el açanlar ve O’ndan yine O’nu isteyenler için her zaman açık bulunan!"}, {"ar": "يَا مَنْ هُوَ سَبِيلُهُ وَاضِحٌ لِلْمُؤْمِنِينَ", "ok": "Yâ men hüve sebîlühü vâdıhun li’l-mü’minîn", "tr": "Ey sırat-ı müstakimi, mü’minler için açık ve geniş bir şehrah olan!"}, {"ar": "يَا مَنْ هُوَ اٰيَاتُهُ بُرْهَانٌ لِلنَّاظِرِينَ", "ok": "Yâ men hüve âyâtühü bürhânun li’n-nâzırîn", "tr": "Ey kâinat ve Kur’ân’daki bütün âyetleri, ibret nazarıyla bakan hüşyar kullar için apaçık birer delil olan!"}, {"ar": "يَا مَنْ هُوَ كِتَابُهُ تَذْكِرَةٌ لِلْمُوقِنِينَ", "ok": "Yâ men hüve kitâbühü tezkiretun li’l-mûkınîn", "tr": "Ey yüce kitabı Kur’ân-ı Kerim, irfan ufkuna ulaşan yakîn sahipleri için bir irşad ve hidayet kaynağı olan!"}, {"ar": "يَا مَنْ هُوَ عَفْوُهُ مَلْجَأٌ لِلْمُذْنِبِينَ", "ok": "Yâ men hüve afvühü melce’un li’l-müznibîn", "tr": "Ey afv u mağfireti, sürçüp günah işleyenlerin tek sığınağı olan!"}, {"ar": "يَا مَنْ هُوَ رَحْمَتُهُ قَرِيبٌ لِلْمُحْسِنِينَ", "ok": "Yâ men hüve rahmetühü karîbun li’l-muhsinîn", "tr": "Ey rahmet ve şefkati, ihsan şuuruyla hareket eden kullarına pek yakın bulunan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 75, "title": "Yetmiş Beşinci Bâb", "e": [{"ar": "يَا مَنْ تَبَارَكَ اسْمُهُ", "ok": "Yâ men tebâreke’smüh", "tr": "Ey nam-ı celîli, her hayrın başı ve bütün bereketlerin kaynağı olan!"}, {"ar": "يَا مَنْ تَعَالٰى جَدُّهُ", "ok": "Yâ men te’âlâ ceddüh", "tr": "Ey şanı yükseklerden yüksek, kadri yücelerden yüce olan!"}, {"ar": "يَا مَنْ جَلَّ ثَنَٓاؤُهُ", "ok": "Yâ men celle senâüh", "tr": "Ey medh ü senası, kullarının hakkıyla yapamayacakları kadar büyük olan!"}, {"ar": "يَا مَنْ لَٓا اِلٰهَ غَيْرُهُ", "ok": "Yâ men lâ ilâhe ğayruh", "tr": "Ey Yüce Zâtından başka hiçbir ilâh olmayan!"}, {"ar": "يَا مَنْ تَقَدَّسَتْ اَسْمَٓاؤُهُ", "ok": "Yâ men takaddeset esmâüh", "tr": "Ey birbirinden güzel esmâ-i hüsnâsı, Müteâl Zâtı adına bir güzellik, bir kudsiyet, bir münezzehiyet ve bir tamamiyetin ifadesi olan!"}, {"ar": "يَا مَنْ يَدُومُ بَقَٓاؤُهُ", "ok": "Yâ men yedûmu bakâüh", "tr": "Ey Kendisi için fena söz konusu olmayan, bekâsı daimi olan!"}, {"ar": "يَا مَنِ الْعَظَمَةُ بَهَٓاؤُهُ", "ok": "Yâ meni’l-azametu behâüh", "tr": "Ey ululuk ve azameti, güzellik ve parlaklığının hususiyetlerinden olan!"}, {"ar": "يَا مَنِ الْكِبْرِيَٓاءُ رِدَٓاؤُهُ", "ok": "Yâ meni’l-kibriyâu ridâüh", "tr": "Ey büyüklük ve kibriyâ yalnız Zât-ı Ecell ü A’lâ’sına ait bulunan!"}, {"ar": "يَا مَنْ لَا يُحْصٰى اٰلَٓاؤُهُ", "ok": "Yâ men lâ yuhsâ âlâüh", "tr": "Ey ihsan ve armağanları hadd ü hesaba gelmeyen!"}, {"ar": "يَا مَنْ لَا يُعَدُّ نَعْمَٓاؤُهُ", "ok": "Yâ men lâ yu’addu na’mâüh", "tr": "Ey nimetleri sonsuz olup sayılamayan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 76, "title": "Yetmiş Altıncı Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Şu güzellerden güzel isimlerin hatırı için Senden diliyor ve dileniyorum:"}, {"ar": "يَا مُعِينُ", "ok": "Yâ Mu’în", "tr": "Ey bütün mevcudatın biricik yardımcısı olan ve dilediklerine sürpriz yardım ve ianelerde bulunan Muîn!"}, {"ar": "يَا مُبِينُ", "ok": "Yâ Mübîn", "tr": "Ey kâinatta ve indirdiği semavi kitaplarda varlık ve birliğinin delillerini apaçık beyan eden Mübîn!"}, {"ar": "يَٓا اَمِينُ", "ok": "Yâ Emîn", "tr": "Ey her vaadinde emin olan ve kullarının gönüllerine güven ve emniyet hisleri salan Emîn!"}, {"ar": "يَا مَكِينُ", "ok": "Yâ Mekîn", "tr": "Ey şanı yüce ve dilediğini gerçekleştirmeye muktedir olan Mekîn!"}, {"ar": "يَا مَتِينُ", "ok": "Yâ Metîn", "tr": "Ey kudret-i kâhire sahibi Metîn!"}, {"ar": "يَا شَدِيدُ", "ok": "Yâ Şedîd", "tr": "Ey inkâr eden münkirlere ve isyan eden asilere karşı azabı çok şiddetli olan Şedîd!"}, {"ar": "يَا شَهِيدُ", "ok": "Yâ Şehîd", "tr": "Ey her şeyi ra’ye’l-ayn bilen Şehîd!"}, {"ar": "يَا رَشِيدُ", "ok": "Yâ Reşîd", "tr": "Ey doğru noktaya ulaştıran Reşîd!"}, {"ar": "يَا حَمِيدُ", "ok": "Yâ Hamîd", "tr": "Ey herkesin hamd ü senasının biricik mercii Hamîd!"}, {"ar": "يَا مَجِيدُ", "ok": "Yâ Mecîd", "tr": "Ey zatî şan ve şeref sahibi Mecîd!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 77, "title": "Yetmiş Yedinci Bâb", "e": [{"ar": "يَا ذَا الْعَرْشِ الْمَجِيدِ", "ok": "Yâ ze’l-arşi’l-mecîd", "tr": "Ey kudret ve azametinin ilk tecelli ufku olan Arş-ı Mecîd’in sahibi!"}, {"ar": "يَا ذَا الْقَوْلِ السَّدِيدِ", "ok": "Yâ ze’l-kavli’s-sedîd", "tr": "Ey hak ve dosdoğru sözün sahibi!"}, {"ar": "يَا ذَا الْفَضْلِ الرَّشِيدِ", "ok": "Yâ ze’l-fadli’r-reşîd", "tr": "Ey en doğru noktaya ulaştıran fazl u ihsanın sahibi!"}, {"ar": "يَا ذَا الْبَطْشِ الشَّدِيدِ", "ok": "Yâ ze’l-batşi’ş-şedîd", "tr": "Ey derdest edip yakalaması pek çetin olan!"}, {"ar": "يَا ذَا الْوَعْدِ وَالْوَعِيدِ", "ok": "Yâ ze’l-va’di ve’l-ve’îd", "tr": "Ey inanıp salih amel işleyenlere ecr ü mükâfat vaat eden, inanmayan ve günah işleyenleri de azabıyla tehdit eden!"}, {"ar": "يَا قَرِيبًا غَيْرَ بَعِيدٍ", "ok": "Yâ karîben ğayre be’îd", "tr": "Ey her şeye her şeyden daha yakın olan, Kendisi için bir uzaklık söz konusu olmayan!"}, {"ar": "يَا مَنْ هُوَ الْوَلِىُّ الْحَمِيدُ", "ok": "Yâ men hüve’l-veliyyu’l-hamîd", "tr": "Ey yüce dost ve gerçek yardımcı ve herkesin hamd ve senasının biricik mercii yalnız Kendisi olan!"}, {"ar": "يَا مَنْ هُوَ عَلٰى كُلِّ شَيْءٍ شَهِيدٌ", "ok": "Yâ men hüve alâ külli şey’in şehîd", "tr": "Ey olup biten her şeye bizzat şahit olan!"}, {"ar": "يَا مَنْ هُوَ لَيْسَ بِظَلَّامٍ لِلْعَبِيدِ", "ok": "Yâ men hüve leyse bizallâmin li’l-abîd", "tr": "Ey kulları kendilerine zulmetse de O, kullarına kat’iyen zerre ağırlığınca haksızlık yapmayan!"}, {"ar": "يَا مَنْ هُوَ اَقْرَبُ اِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ", "ok": "Yâ men hüve akrebu ileyhi min habli’l-verîd", "tr": "Ey insana her lahza şah damarından daha yakın olan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 78, "title": "Yetmiş Sekizinci Bâb", "e": [{"ar": "يَا مَنْ لَا شَرِيكَ لَهُ وَلَا وَزِيرَ", "ok": "Yâ men lâ şerîke lehu ve lâ vezîr", "tr": "Ey kat’iyen bir şerîk ve vezîri olmayan!"}, {"ar": "يَا مَنْ لَا شَبِيهَ لَهُ وَلَا نَظِيرَ", "ok": "Yâ men lâ şebîhe lehu ve lâ nazîr", "tr": "Ey herhangi bir şebîh ve nazîri bulunmayan!"}, {"ar": "يَا خَالِقَ الشَّمْسِ وَالْقَمَرِ الْمُنِيرِ", "ok": "Yâ hâlika’ş-şemsi ve’l-kameri’l-münîr", "tr": "Ey ışık saçan Şems’i ve nur dağıtan Kamer’i yaratan!"}, {"ar": "يَا مُغْنِىَ الْبَٓائِسِ الْفَقِيرِ", "ok": "Yâ muğniye’l-bâisi’l-fakîr", "tr": "Ey muhtaç ve fakirleri iğna buyurup ihtiyaçlarını gideren!"}, {"ar": "يَا رَازِقَ الطِّفْلِ الصَّغِيرِ", "ok": "Yâ râzika’t-tıfli’s-sağîr", "tr": "Ey küçük yavruları en güzel şekilde rızıklandıran!"}, {"ar": "يَا رَاحِمَ الشَّيْخِ الْكَبِيرِ", "ok": "Yâ râhime’ş-şeyhı’l-kebîr", "tr": "Ey merhamete muhtaç ihtiyarlara rahmetiyle çok farklı tecelli eden!"}, {"ar": "يَا عِصْمَةَ الْخَٓائِفِ الْمُسْتَجِيرِ", "ok": "Yâ ısmete’l-hâifi’l-müstecîr", "tr": "Ey korkup dergâhına iltica eden çaresizleri koruyup gözeten!"}, {"ar": "يَا مَنْ هُوَ بِعِبَادِهِ بَصِيرٌ", "ok": "Yâ men hüve bi’ibâdihi basîr", "tr": "Ey bütün kullarını Müteâl Zâtına mahsus basarla her an gören!"}, {"ar": "يَا مَنْ هُوَ بِحَوَائِجِ الْعِبَادِ خَبِيرٌ", "ok": "Yâ men hüve bihavâici’l-ibâdi habîr", "tr": "Ey kullarının bütün ihtiyaçlarından her an haberdar olan!"}, {"ar": "يَا مَنْ هُوَ عَلٰى كُلِّ شَيْءٍ قَدِيرٌ", "ok": "Yâ men hüve alâ külli şey’in kadîr", "tr": "Ey dilediği şeyi dilediği gibi gerçekleştirmeye muktedir bulunan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 79, "title": "Yetmiş Dokuzuncu Bâb", "e": [{"ar": "يَا ذَا الْجُودِ وَالنِّعَمِ", "ok": "Yâ ze’l-cûdi ve’n-ni’am", "tr": "Ey sonsuz nimetlerini cömertçe sunan!"}, {"ar": "يَا ذَا الْفَضْلِ وَالْكَرَمِ", "ok": "Yâ ze’l-fadli ve’l-kerem", "tr": "Ey fazl u keremi nihayetsiz olan!"}, {"ar": "يَا ذَا الْبَاْسِ وَالنِّقَمِ", "ok": "Yâ ze’l-be’si ve’n-nikam", "tr": "Ey dalâlette ısrar edenlere ceza ve azabı çok çetin olan!"}, {"ar": "يَا خَالِقَ اللَّوْحِ وَالْقَلَمِ", "ok": "Yâ hâlika’l-levhi ve’l-kalem", "tr": "Ey üzerine maddî-mânevî, canlı-cansız her şeyi kayıt ve tespit ettiği mânevî bir levha olan Levh-i Mahfuz’un ve Kalem’in sahibi olan!"}, {"ar": "يَا بَارِىَٔ الذَّرِّ وَالنَّسَمِ", "ok": "Yâ bâri’e’z-zerri ve’n-nesem", "tr": "Ey zerre ve tohumlardan diğer canlılara ve nihayet insana kadar her şeyi kusursuz yaratan!"}, {"ar": "يَا مُلْهِمَ الْعَرَبِ وَالْعَجَمِ", "ok": "Yâ mülhime’l-arebi ve’l-acem", "tr": "Ey ayırmaksızın bütün insanlara hak ile bâtılı, doğru ile eğriyi ve bunlara terettüp eden neticeleri gösteren!"}, {"ar": "يَا كَاشِفَ الضُّرِّ وَالْاَلَمِ", "ok": "Yâ kâşife’d-durri ve’l-elem", "tr": "Ey zarar ve elemleri izale eden!"}, {"ar": "يَا عَالِمَ السِّرِّ وَالْهِمَمِ", "ok": "Yâ âlime’s-sirri ve’l-himem", "tr": "Ey kalblerde saklı mülâhaza ve niyetleri en iyi bilen!"}, {"ar": "يَا مَنْ لَهُ الْبَيْتُ وَالْحَرَمُ", "ok": "Yâ men lehu’l-beytu ve’l-harem", "tr": "Ey Kâbe-i Muazzama ve Harem-i Şerîf’in sahibi olan!"}, {"ar": "يَا مَنْ يَخْلُقُ الْاَشْيَٓاءَ مِنَ الْعَدَمِ", "ok": "Yâ men yahluku’l-eşyâe mine’l-adem", "tr": "Ey bütün eşyayı yoktan var eden!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 80, "title": "Sekseninci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu güzellerden güzel isimlerin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا عَادِلُ", "ok": "Yâ Âdil", "tr": "Ey her hükmünde adaletle muamele eden Mutlak Âdil!"}, {"ar": "يَا قَابِلُ", "ok": "Yâ Kâbil", "tr": "Ey kullarının dualarını, ihlâsla işledikleri salih amellerini ve pişman bir gönülle yaptıkları tevbeleri kabul buyuran Kâbil!"}, {"ar": "يَا فَاضِلُ", "ok": "Yâ Fâdıl", "tr": "Ey Zâtında her türlü kemâlatı cami ve kullarına fazl u ihsanları çok olan Fâzıl!"}, {"ar": "يَا فَاعِلُ", "ok": "Yâ Fâ’il", "tr": "Ey icraatıyla her an ayrı bir şe’nde bulunan, bütün fiillerin yegâne yaratıcısı Fâil!"}, {"ar": "يَا كَافِلُ", "ok": "Yâ Kâfil", "tr": "Ey yarattıklarının bütün ihtiyaçlarına kefil olan Kâfil!"}, {"ar": "يَا جَاعِلُ", "ok": "Yâ Câ’il", "tr": "Ey her şeyi yerli yerinde, başdöndüren bir sanatla yaratan Câil!"}, {"ar": "يَا كَامِلُ", "ok": "Yâ Kâmil", "tr": "Ey Zât, isim, sıfat ve fiillerinde kâmil ü mükemmel olan Kâmil!"}, {"ar": "يَا فَاطِرُ", "ok": "Yâ Fâtır", "tr": "Ey mevcudatı yoktan var eden Fâtır!"}, {"ar": "يَا طَالِبُ", "ok": "Yâ Tâlib", "tr": "Ey kullarından, kendi menfaatleri için salih ameller işlemelerini isteyen Tâlib!"}, {"ar": "يَا مَطْلُوبُ", "ok": "Yâ Matlûb", "tr": "Ey mârifet ehli kullarının Kendisinden yine sadece Kendisini istedikleri biricik Matlûb!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 81, "title": "Seksen Birinci Bâb", "e": [{"ar": "يَا مَنْ اَنْعَمَ بِحَوْلِهِ", "ok": "Yâ men en’ame bihavlih", "tr": "Ey lütf u ihsanlarıyla kullarını nimetlendiren!"}, {"ar": "يَا مَنْ اَكْرَمَ بِطَوْلِهِ", "ok": "Yâ men ekreme bitavlih", "tr": "Ey cömertçe ikramlarda bulunan!"}, {"ar": "يَا مَنْ عَادَ بِلُطْفِهِ", "ok": "Yâ men âde bilutfih", "tr": "Ey sınırsız lütuflarıyla her zaman keremini gösteren!"}, {"ar": "يَا مَنْ تَعَزَّزَ بِقُدْرَتِهِ", "ok": "Yâ men te’azzeze bikudretih", "tr": "Ey sonsuz kudretiyle sonsuz izzetin sahibi olan!"}, {"ar": "يَا مَنْ قَدَّرَ بِحِكْمَتِهِ", "ok": "Yâ men kaddere bihikmetih", "tr": "Ey her şeyi yerli yerinde, bir hikmet ile takdir buyuran!"}, {"ar": "يَا مَنْ حَكَمَ بِتَدْبِيرِهِ", "ok": "Yâ men hakeme bitedbîrih", "tr": "Ey bütün kâinatı hikmet ile tedbir ve terbiye eden ve hükümlerini hikmet ile icra buyuran!"}, {"ar": "يَا مَنْ دَبَّرَ بِعِلْمِهِ", "ok": "Yâ men debbere bi’ilmih", "tr": "Ey tedbir ve terbiyesi sonsuz bir ilme dayanan!"}, {"ar": "يَا مَنْ تَجَاوَزَ بِحِلْمِهِ", "ok": "Yâ men tecâveze bihilmih", "tr": "Ey kullarını cezalandırmayıp hilmiyle affeden!"}, {"ar": "يَا مَنْ دَنَا فِي عُلُوِّهِ", "ok": "Yâ men denâ fî ulüvvih", "tr": "Ey yüceliğiyle beraber her nesne ve her kimseye kendisinden daha yakın olan!"}, {"ar": "يَا مَنْ عَلاٰ فِي دُنُوِّهِ", "ok": "Yâ men alâ fî dünüvvih", "tr": "Ey yakınlığıyla beraber kadri yüce, şanı yüksek ve müteâl bulunan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 82, "title": "Seksen İkinci Bâb", "e": [{"ar": "يَا مَنْ يَخْلُقُ مَا يَشَٓاءُ", "ok": "Yâ men yahluku mâ yeşâ", "tr": "Ey dilediğini dilediği gibi yaratan!"}, {"ar": "يَا مَنْ يَفْعَلُ مَا يَشَٓاءُ", "ok": "Yâ men yef’alu mâ yeşâ", "tr": "Ey bir şeyi nasıl isterse, hikmetine uygun, öyle yapan!"}, {"ar": "يَا مَنْ يَهْدِى مَنْ يَشَٓاءُ", "ok": "Yâ men yehdî men yeşâ", "tr": "Ey dilediği kullarını dosdoğru yola ileten!"}, {"ar": "يَا مَنْ يُضِلُّ مَنْ يَشَٓاءُ", "ok": "Yâ men yudıllu men yeşâ", "tr": "Ey ısrar edenleri dalâletleriyle baş başa bırakan!"}, {"ar": "يَا مَنْ يَغْفِرُ لِمَنْ يَشَٓاءُ", "ok": "Yâ men yağfiru limen yeşâ", "tr": "Ey dilediği kullarını affedip yarlığayan!"}, {"ar": "يَا مَنْ يُعَذِّبُ مَنْ يَشَٓاءُ", "ok": "Yâ men yu’azzibu men yeşâ", "tr": "Ey müstahak olanlara azabıyla muamele eden!"}, {"ar": "يَا مَنْ يَتُوبُ عَلٰى مَنْ يَشَٓاءُ", "ok": "Yâ men yetûbu alâ men yeşâ", "tr": "Ey nedametle kapısına gelen kullarının tevbelerini kabul eden!"}, {"ar": "يَا مَنْ يُصَوِّرُ فِي الْاَرْحَامِ كَيْفَ يَشَٓاءُ", "ok": "Yâ men yusavviru fi’l-erhâmi keyfe yeşâ", "tr": "Ey anne rahmindeki yavrulara dilediği gibi suret veren!"}, {"ar": "يَا مَنْ يَزِيدُ فِي الْخَلْقِ مَا يَشَٓاءُ", "ok": "Yâ men yezîdu fi’l-halkı mâ yeşâ", "tr": "Ey dilediği mahlûkatını fazladan nimetlerle donatan!"}, {"ar": "يَا مَنْ يَخْتَصُّ بِرَحْمَتِهِ مَنْ يَشَٓاءُ", "ok": "Yâ men yahtassu birahmetihi men yeşâ", "tr": "Ey bazı kullarını seçip hususi rahmetine mazhar kılan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 83, "title": "Seksen Üçüncü Bâb", "e": [{"ar": "يَا مَنْ لَمْ يَتَّخِذْ صَاحِبَةً وَلَا وَلَدًا", "ok": "Yâ men lem yettahız sâhibeten ve lâ veledâ", "tr": "Ey vasıfları yüce olan; yarattıklarına benzemekten, eş ve evlat edinmek gibi hususlardan berî olan!"}, {"ar": "يَا مَنْ لَا يُشْرِكُ فِي حُكْمِهِٓ اَحَدًا", "ok": "Yâ men lâ yüşriku fî hukmihi ehadâ", "tr": "Ey hâkimiyetinde hiçbir şeyi Kendisine ortak kabul etmeyen!"}, {"ar": "يَا مَنْ جَعَلَ لِكُلِّ شَيْءٍ قَدْرًا", "ok": "Yâ men ce’ale likülli şey’in kadrâ", "tr": "Ey her şey için bir ölçü ve her iş için bir vade takdir eden!"}, {"ar": "يَا مَنْ لَمْ يَزَلْ رَحِيمًا", "ok": "Yâ men lem yezel rahîmâ", "tr": "Ey Kendisi gibi rahmeti de ezelî olan!"}, {"ar": "يَا جَاعِلَ الْمَلٰٓئِكَةِ رُسُلاً", "ok": "Yâ câ’ile’l-melâiketi rusülâ", "tr": "Ey melekleri elçi olarak tayin buyuran!"}, {"ar": "يَا مَنْ جَعَلَ فِي السَّمَٓاءِ بُرُوجًا", "ok": "Yâ men ce’ale fi’s-semâi bürûcâ", "tr": "Ey semada burçlar ve yıldız kümeleri yaratan!"}, {"ar": "يَا مَنْ جَعَلَ الْاَرْضَ قَرَارًا", "ok": "Yâ men ce’ale’l-erda karârâ", "tr": "Ey arzı yerleşime elverişli kılan!"}, {"ar": "يَا مَنْ جَعَلَ مِنَ الْمَٓاءِ بَشَرًا", "ok": "Yâ men ce’ale mine’l-mâi beşerâ", "tr": "Ey insanı bir damla sudan var eden!"}, {"ar": "يَا مَنْ اَحْصٰى كُلَّ شَيْءٍ عَدَدًا", "ok": "Yâ men ahsâ külle şey’in adedâ", "tr": "Ey her şeyi tek tek kaydedip muhafaza eden!"}, {"ar": "يَا مَنْ اَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا", "ok": "Yâ men ehâta bikülli şey’in ilmâ", "tr": "Ey her şeyi ilim, kudret ve ilâhî ahkâmı ile ihata eden!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 84, "title": "Seksen Dördüncü Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا فَرْدُ", "ok": "Yâ Ferd", "tr": "Ey Zâtında ve sıfatlarında şerîkten, eşi ve benzeri olmaktan münezzeh olan yegâne Zât, Ferd!"}, {"ar": "يَا وِتْرُ", "ok": "Yâ Vitr", "tr": "Ey bir ve tek olan, misli ve niddi bulunmayan Vitr!"}, {"ar": "يَٓا اَحَدُ", "ok": "Yâ Ehad", "tr": "Ey ikincisi olmayan tek, Ehad!"}, {"ar": "يَا صَمَدُ", "ok": "Yâ Samed", "tr": "Ey herkesin muhtaç olduğu müstağni, Samed!"}, {"ar": "يَٓا اَمْجَدُ", "ok": "Yâ Emced", "tr": "Ey mutlak fazl ve şeref sahibi Emced!"}, {"ar": "يَٓا اَعَزُّ", "ok": "Yâ E’azz", "tr": "Ey eşi, benzeri olmayan yegâne galip ve Eazz!"}, {"ar": "يَٓا اَجَلُّ", "ok": "Yâ Ecell", "tr": "Ey nefislerde ürperti ve haşyet hâsıl eden Ecell!"}, {"ar": "يَٓا اَحَقُّ", "ok": "Yâ Ehakk", "tr": "Ey varlığı kendinden ve değişmeyen bir Zât olan Ehakk!"}, {"ar": "يَٓا اَبَرُّ", "ok": "Yâ Eberr", "tr": "Ey durumuna göre herkese iyilikte bulunan Eberr!"}, {"ar": "يَٓا اَبَدُ", "ok": "Yâ Ebed", "tr": "Ey varlığının sonu olmayan Ebed!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 85, "title": "Seksen Beşinci Bâb", "e": [{"ar": "يَا مَعْرُوفَ مَنْ عَرَفَهُ", "ok": "Yâ ma’rûfe men arefeh", "tr": "Ey ehl-i irfan olan âriflerin çok iyi bilip tanıdığı Mârûf!"}, {"ar": "يَا مَعْبُودَ مَنْ عَبَدَهُ", "ok": "Yâ ma’bûde men abedeh", "tr": "Ey kullarının en büyük payeyi Kendisine ibadet ü taatte buldukları biricik Mâbud!"}, {"ar": "يَا مَشْكُورَ مَنْ شَكَرَهُ", "ok": "Yâ meşkûre men şekereh", "tr": "Ey şükredenlerin şükürleri sadece Kendisine raci olan Meşkûr!"}, {"ar": "يَا مَذْكُورَ مَنْ ذَكَرَهُ", "ok": "Yâ mezkûre men zekereh", "tr": "Ey bütün varlık Yüce Zâtını zikreden ve zikri ruhlara itminan veren gönüller sultanı Mezkûr!"}, {"ar": "يَا مَحْمُودَ مَنْ حَمِدَهُ", "ok": "Yâ mahmûde men hamideh", "tr": "Ey herkesin hamd ü senasının biricik mercii Mahmûd!"}, {"ar": "يَا مَوْجُودَ مَنْ طَلَبَهُ", "ok": "Yâ mevcûde men talebeh", "tr": "Ey yalnız Kendisini talep eden hak yolcularının kalblerine varlığını her zaman duyuran Mevcûd!"}, {"ar": "يَا مَوْصُوفَ مَنْ وَحَّدَهُ", "ok": "Yâ mevsûfe men vahhadeh", "tr": "Ey Kendisinin biricik tasarruf sahibi olduğunu kavlî, fiilî ve hâlî ikrarlarıyla dile getiren ehl-i tevhidin, vasıflarıyla pek iyi bilip tanıdığı Mevsûf!"}, {"ar": "يَا مَحْبُوبَ مَنْ اَحَبَّهُ", "ok": "Yâ mahbûbe men ehabbeh", "tr": "Ey bütün benlikleriyle Kendisine yönelip başka arzulardan sıyrılabilmiş muhabbet erlerinin kalblerindeki yegâne Mahbûb!"}, {"ar": "يَا مَرْغُوبَ مَنْ اَرَادَهُ", "ok": "Yâ merğûbe men erâdeh", "tr": "Ey iradelerini Hakk’ın muradına bağlamayı başarabilmiş bahtiyar kulların tek istekleri olan Merğûb!"}, {"ar": "يَا مَقْصُودَ مَنْ اَنَابَ اِلَيْهِ", "ok": "Yâ maksûde men enâbe ileyh", "tr": "Ey kendilerini Rabbilerine teslim etmiş yüce kâmetlerin iştiyak ve hırsla Yüce Zâtına teveccüh ettikleri biricik Maksûd!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 86, "title": "Seksen Altıncı Bâb", "e": [{"ar": "يَا مَنْ لَا مُلْكَ اِلَّا مُلْكُهُ", "ok": "Yâ men lâ mülke illâ mülküh", "tr": "Ey varlık bütünüyle Kendine ait olan, mülkünden başka bir mülk bulunmayan!"}, {"ar": "يَا مَنْ لَا يُحْصِي الْعِبَادُ ثَنَٓائَهُ", "ok": "Yâ men lâ yuhsi’l-ibâdu senâeh", "tr": "Ey kulları, Yüce Zâtını hakkıyla sena etmekten âciz olup güç yetiremeyen!"}, {"ar": "يَا مَنْ لَا تَصِفُ الْخَلَٓائِقُ جَلَالَهُ", "ok": "Yâ men lâ tasıfu’l-halâiku celâleh", "tr": "Ey mahlûkatının takati, celâl ve azametini vasfetmeye yetmeyen!"}, {"ar": "يَا مَنْ لَا يُدْرِكُ الْاَبْصَارُ كَمَالَهُ", "ok": "Yâ men lâ yüdriku’l-ebsâru kemâleh", "tr": "Ey gözler, güzellik ve kemâlini idrake muktedir olamayan!"}, {"ar": "يَا مَنْ لَا يَبْلُغُ الْاَفْهَامُ صِفَاتِهِ", "ok": "Yâ men lâ yebluğu’l-efhâmu sıfâtih", "tr": "Ey akıl ve anlayışlar, ulvi sıfatlarına ulaşamayan, onları hakkıyla tarif edemeyen!"}, {"ar": "يَا مَنْ لَا يَنَالُ الْاَفْكَارُ كِبْرِيَٓائَهُ", "ok": "Yâ men lâ yenâlu’l-efkâru kibriyâeh", "tr": "Ey fikirler, nihayetsiz kibriyâ ve büyüklüğünü bihakkın kavrayamayan!"}, {"ar": "يَا مَنْ لَا يُحْسِنُ اْلاِنْسَانُ نُعُوتَهُ", "ok": "Yâ men lâ yuhsinu’l-insânu nu’ûteh", "tr": "Ey insanlar, birbirinden güzel isim ve sıfatlarının güzelliğini tastamam idrak ve tarif edemeyen!"}, {"ar": "يَا مَنْ لَا يَرُدُّ الْعِبَادُ قَضَٓائَهُ", "ok": "Yâ men lâ yeruddu’l-ibâdu kadâeh", "tr": "Ey hiçbir güç ve kuvvet, hükmünü geri çeviremeyen ve değiştiremeyen!"}, {"ar": "يَا مَنْ ظَهَرَ فِي كُلِّ شَيْءٍ اٰيَاتُهُ", "ok": "Yâ men zahere fî külli şey’in âyâtüh", "tr": "Ey her bir şeyde varlık ve birliğinin apaçık delilleri görünen!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, neccinâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}
