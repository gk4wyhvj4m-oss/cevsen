:root {
  --bg: #f5f4f0;
  --paper: #fbfaf7;
  --ink: #1d211f;
  --ink-soft: #4b524e;
  --muted: #8c928d;
  --line: rgba(29, 33, 31, .1);
  --accent: #8c6d46;
  --bar: rgba(245, 244, 240, .86);
  --arabic: "Amiri", "Geeza Pro", "Times New Roman", serif;
  --serif: "EB Garamond", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121413;
    --paper: #1b1e1c;
    --ink: #e8ebe7;
    --ink-soft: #c2c8c3;
    --muted: #7f8781;
    --line: rgba(232, 235, 231, .1);
    --accent: #b39667;
    --bar: rgba(18, 20, 19, .84);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
@supports (overflow: clip) { html, body { overflow-x: clip; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  min-height: 100vh;
  overflow-x: hidden;
}

/* feine Fortschrittslinie oben */
.top {
  position: fixed; inset: 0 0 auto 0; z-index: 5;
  height: calc(env(safe-area-inset-top) + 2px);
  background: var(--bar);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.top i {
  position: absolute; left: 0; bottom: 0; height: 2px;
  background: var(--accent); opacity: .55;
  transition: width .35s ease;
}

main {
  touch-action: pan-y;
  padding: calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 112px);
  max-width: 600px; margin: 0 auto;
  will-change: transform;
}

.head { text-align: center; margin: 8px 0 14px; }
.num {
  font-family: var(--arabic);
  font-size: 44px; line-height: 1;
  color: var(--accent);
  display: block;
}
.num svg { width: 38px; height: 38px; display: inline-block; vertical-align: middle; }
.title {
  margin-top: 12px;
  font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--muted);
}

.e { text-align: center; padding: 26px 0; }
.e + .e::before { content: ""; display: block; width: 56px; height: 1px; background: var(--line); margin: -26px auto 26px; }
.e .ar {
  font-family: var(--arabic);
  direction: rtl;
  font-size: 28px; line-height: 1.95;
  margin: 0; color: var(--ink);
}
.e .ok {
  font-style: italic; font-size: 18.5px; line-height: 1.5;
  color: var(--accent); margin: 10px 0 0;
}
.e .tr {
  font-size: 18px; line-height: 1.5;
  color: var(--ink-soft); margin: 6px 0 0;
}
.e.close { padding-top: 6px; }
.orn + .e.close::before { display: none; }
.e.close .ar { font-size: 25px; color: var(--ink-soft); }

.orn {
  display: flex; align-items: center; gap: 14px;
  margin: 18px 0 8px; color: var(--accent);
}
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.orn svg { width: 14px; height: 14px; opacity: .8; }

.end {
  text-align: center; margin-top: 46px; color: var(--accent); opacity: .7;
}
.end svg { width: 18px; height: 18px; }

/* Navigation unten */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 10px 18px calc(env(safe-area-inset-bottom) + 10px);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bar);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
nav button {
  appearance: none; border: 0; background: none; color: var(--ink);
  width: 48px; height: 44px; border-radius: 22px;
  display: grid; place-items: center; cursor: pointer;
  transition: opacity .2s, background .2s;
}
nav button:active { background: var(--line); }
nav button[disabled] { opacity: .18; pointer-events: none; }
nav button svg { width: 22px; height: 22px; }
nav .pos {
  width: auto; padding: 0 18px;
  font-family: var(--serif); font-size: 14px; letter-spacing: .12em; color: var(--muted);
  font-variant-numeric: lining-nums tabular-nums;
}

/* Sprungauswahl */
.veil {
  position: fixed; inset: 0; z-index: 9;
  background: rgba(14, 16, 15, .22);
  opacity: 0; pointer-events: none; transition: opacity .28s ease;
}
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  max-width: 600px; margin: 0 auto;
  background: var(--paper);
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -12px 40px rgba(0, 0, 0, .08);
  padding: 12px 18px calc(env(safe-area-inset-bottom) + 20px);
  transform: translateY(104%);
  transition: transform .34s cubic-bezier(.2,.8,.2,1);
}
.jump-open .veil { opacity: 1; pointer-events: auto; }
.jump-open .sheet { transform: none; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
.sheet .label {
  font-size: 11.5px; letter-spacing: .24em; text-transform: uppercase;
  color: var(--muted); text-align: center; margin: 0 0 14px;
}
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.grid button, .sheet .dua {
  appearance: none; border: 0; background: none; cursor: pointer;
  font-family: var(--serif); color: var(--ink-soft);
  font-variant-numeric: lining-nums tabular-nums;
}
.grid button {
  font-size: 15px; height: 34px; border-radius: 17px;
  transition: background .15s;
}
.grid button:active, .sheet .dua:active { background: var(--line); }
.grid button.cur, .sheet .dua.cur { color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.grid .sep { grid-column: 1 / -1; height: 6px; }
.sheet .dua {
  display: block; margin: 14px auto 0; padding: 8px 20px; border-radius: 18px;
  font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
}

.anim { transition: transform .22s cubic-bezier(.2,.7,.2,1), opacity .22s ease; }

@media (min-width: 700px) {
  main { padding-top: 72px; }
  .ar { font-size: 30px; }
}
</style>
</head>
<body>
<div class="top"><i id="bar"></i></div>
<main id="page"></main>
<nav>
  <button id="prev" aria-label="Önceki bâb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="pos" id="pos" aria-label="Bâb seç"></button>
  <button id="next" aria-label="Sonraki bâb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Bâblar">
  <div class="grab"></div>
  <div class="label">Bâblar</div>
  <div class="grid" id="grid"></div>
  <button class="dua" id="duaBtn">Cevşen Duası</button>

sadece Kendisinden dilediği Müsteân!"}, {"ar": "يَا ذَا الْمَنِّ وَالْبَيَانِ", "ok": "Yâ ze’l-menni ve’l-beyân", "tr": "Ey yarattıklarına sonsuz nimetler lutfeden, beyanı en güzel olan ve insana beyanı öğreten Zü’l-menni ve’l-beyan!"}, {"ar": "يَا ذَا الْاَمَانِ", "ok": "Yâ ze’l-emân", "tr": "Ey değişik endişe ve kaygılarla Kendisine iltica edenlerin içine emniyet ve güven hisleri salan Emân!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 6, "title": "Altıncı Bâb", "e": [{"ar": "يَا مَنْ تَوَاضَعَ كُلُّ شَيْءٍ لِعَظَمَتِهِ", "ok": "Yâ men tevâda’a küllü şey’in li’azametih", "tr": "Ey azameti karşısında her kimse ve her nesne iki büklüm olup boyun eğen!"}, {"ar": "يَا مَنِ اسْتَسْلَمَ كُلُّ شَيْءٍ لِقُدْرَتِهِ", "ok": "Yâ meni’stesleme küllü şey’in likudretih", "tr": "Ey kudretine her şey teslim olan!"}, {"ar": "يَا مَنْ ذَلَّ كُلُّ شَيْءٍ لِعِزَّتِهِ", "ok": "Yâ men zelle küllü şey’in li’izzetih", "tr": "Ey izzetine karşı her şey tezellülde bulunup itaat eden!"}, {"ar": "يَا مَنْ خَضَعَ كُلُّ شَيْءٍ لِهَيْبَتِهِ", "ok": "Yâ men hada’a küllü şey’in liheybetih", "tr": "Ey heybeti karşısında her şey hudû ile boyun eğen!"}, {"ar": "يَا مَنِ انْقَادَ كُلُّ شَيْءٍ لِمُلْكَتِهِ", "ok": "Yâ meni’nkâde küllü şey’in limülketih", "tr": "Ey mülk ve saltanatı karşısında her şey inkıyat edip hükmüne râm olan!"}, {"ar": "يَا مَنْ دَانَ كُلُّ شَيْءٍ مِنْ مَخَافَتِهِ", "ok": "Yâ men dâne küllü şey’in min mahâfetih", "tr": "Ey mehafet ve korkusuyla her şey kendisine kullukta bulunan!"}, {"ar": "يَا مَنِ انْشَقَّتِ الْجِبَالُ مِنْ خَشْيَتِهِ", "ok": "Yâ meni’nşakkati’l-cibâlu min haşyetih", "tr": "Ey haşyetinden dağlar paramparça hâle gelen!"}, {"ar": "يَا مَنْ قَامَتِ السَّمٰوَاتُ بِاَمْرِهِ", "ok": "Yâ men kâmeti’s-semâvâtu bi-emrih", "tr": "Ey gökler, emriyle ayakta duran!"}, {"ar": "يَا مَنِ اسْتَقَرَّتِ الْاَرْضُ بِاِذْنِهِ", "ok": "Yâ meni’stakarreti’l-erdu bi-iznih", "tr": "Ey arz, izniyle istikrar bulan!"}, {"ar": "يَا مَنْ لَا يَعْتَدِي عَلىٰٓ اَهْلِ مَمْلَكَتِهِ", "ok": "Yâ men lâ ya’tedî alâ ehli memleketih", "tr": "Ey kâinat memleketinde hiçbir kuluna zerre kadar bile zulmetmeyen!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 7, "title": "Yedinci Bâb", "e": [{"ar": "يَا غَافِرَ الْخَطَايَا", "ok": "Yâ ğâfire’l-hatâyâ", "tr": "Ey hata, kusur ve günahları bağışlayan!"}, {"ar": "يَا كَاشِفَ الْبَلَايَا", "ok": "Yâ kâşife’l-belâyâ", "tr": "Ey belâ ve musibetleri kaldıran!"}, {"ar": "يَا مُنْتَهَى الرَّجَايَا", "ok": "Yâ müntehe’r-recâyâ", "tr": "Ey bütün istek ve dilekler Kendisine ulaşan!"}, {"ar": "يَا مُجْزِلَ الْعَطَايَا", "ok": "Yâ müczile’l-atâyâ", "tr": "Ey ihsan ve atıyyeleri bol olan!"}, {"ar": "يَا وَاسِعَ الْهَدَايَا", "ok": "Yâ vâsi’a’l-hedâyâ", "tr": "Ey hediyeleri çok geniş olan!"}, {"ar": "يَا رَازِقَ الْبَرَايَا", "ok": "Yâ râzika’l-berâyâ", "tr": "Ey her varlığın rızkını ulaştıran!"}, {"ar": "يَا قَاضِيَ الْمَنَايَا", "ok": "Yâ kâdıye’l-menâyâ", "tr": "Ey vakti geldiğinde verdiği hayatı geri alan!"}, {"ar": "يَا سَامِعَ الشَّكَايَا", "ok": "Yâ sâmi’a’ş-şekâyâ", "tr": "Ey her şekva ve arz-ı hâli duyan!"}, {"ar": "يَا بَاعِثَ السَّرَايَا", "ok": "Yâ bâ’ise’s-serâyâ", "tr": "Ey her yana değişik mahlûkatından ordular yollayan!"}, {"ar": "يَا مُطْلِقَ اْلاُسَارٰى", "ok": "Yâ mutlika’l-üsârâ", "tr": "Ey esaretleri sona erdiren ve esirleri salıverip hürriyetine kavuşturan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 8, "title": "Sekizinci Bâb", "e": [{"ar": "يَا ذَا الْحَمْدِ وَالثَّنَٓاءِ", "ok": "Yâ ze’l-hamdi ve’s-senâ", "tr": "Ey ezelden ebede bütün hamd ü senalar Kendisine ait olan!"}, {"ar": "يَا ذَا الْمَجْدِ وَالسَّنَٓاءِ", "ok": "Yâ ze’l-mecdi ve’s-senâ", "tr": "Ey mutlak fazl, şeref ve ululuk sahibi!"}, {"ar": "يَا ذَا الْفَخْرِ وَالْبَهَٓاءِ", "ok": "Yâ ze’l-fahri ve’l-behâ", "tr": "Ey sonsuz övgüye layık olan ve her güzelliğin sahibi bulunan!"}, {"ar": "يَا ذَا الْعَهْدِ وَالْوَفَٓاءِ", "ok": "Yâ ze’l-ahdi ve’l-vefâ", "tr": "Ey vaad ettiklerini en güzel şekilde yerine getirmeye kâdir olan!"}, {"ar": "يَا ذَا الْعَفْوِ وَالرِّضَٓاءِ", "ok": "Yâ ze’l-afvi ve’r-ridâ", "tr": "Ey af ve hoşnutluk talebinde bulunanları bağışlayan ve onlardan razı olan!"}, {"ar": "يَا ذَا الْمَنِّ وَالْعَطَٓاءِ", "ok": "Yâ ze’l-menni ve’l-atâ", "tr": "Ey nimet ve atıyyeleri sayısız olan!"}, {"ar": "يَا ذَا الْفَصْلِ وَالْقَضَٓاءِ", "ok": "Yâ ze’l-fasli ve’l-kadâ", "tr": "Ey hükümleriyle her meseleyi hall ü fasl eyleyip en güzel neticeye ulaştıran!"}, {"ar": "يَا ذَا الْعِزَّةِ وَالْبَقَٓاءِ", "ok": "Yâ ze’l-izzeti ve’l-bakâ", "tr": "Ey izzetiyle beraber sonsuz olan!"}, {"ar": "يَا ذَا الْجُودِ وَالنَّعْمَٓاءِ", "ok": "Yâ ze’l-cûdi ve’n-na’mâ", "tr": "Ey bitip tükenme bilmeyen nimetlerini kullarına cömertçe bağışlayan!"}, {"ar": "يَا ذَا الْفَضْلِ وَالْاٰلَٓاءِ", "ok": "Yâ ze’l-fadli ve’l-âlâ", "tr": "Ey mahlûkatına türlü türlü fazl u ihsanlarda bulunan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 9, "title": "Dokuzuncu Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerinin hakkı için de diliyor ve dileniyorum:"}, {"ar": "يَا مَانِعُ", "ok": "Yâ Mâni’", "tr": "Ey kullarının yegâne sığınağı ve onlara gelecek zararları men eden Mâni’!"}, {"ar": "يَا دَافِعُ", "ok": "Yâ Dâfi’", "tr": "Ey belâ, musibet ve şerleri defeden Dâfi’!"}, {"ar": "يَا نَافِعُ", "ok": "Yâ Nâfi’", "tr": "Ey kulları için fayda ve hayırlar yaratan Nâfi’!"}, {"ar": "يَا سَامِعُ", "ok": "Yâ Sâmi’", "tr": "Ey gizli açık her şeyi duyan ve itibara alan Sâmi’!"}, {"ar": "يَا رَافِعُ", "ok": "Yâ Râfi’", "tr": "Ey şerleri ref’ eden ve kullarından dilediğinin mertebesini yükselten Yüceler Yücesi Râfi’!"}, {"ar": "يَا صَانِعُ", "ok": "Yâ Sâni’", "tr": "Ey eserlerini birer sanat harikası şeklinde yaratan Sâni’!"}, {"ar": "يَا شَافِعُ", "ok": "Yâ Şâfi’", "tr": "Ey dilediğine rahmetiyle bizzat şefaat eden ve dilediği makbul kullarına şefaat etme izni veren Şâfi’!"}, {"ar": "يَا جَامِعُ", "ok": "Yâ Câmi’", "tr": "Ey bütün kemâl sıfatlarını Zâtında cem’ eden, dağınık kalbleri bir araya getiren ve mahşer günü bütün mahlûkatı huzurunda toplayan Câmi’!"}, {"ar": "يَا وَاسِعُ", "ok": "Yâ Vâsi’", "tr": "Ey ilim, rahmet ve kudretiyle varlığı topyekûn kuşatan Vâsi’!"}, {"ar": "يَا مُوسِعُ", "ok": "Yâ Mûsi’", "tr": "Ey itaatkâr kulları için rahmet dairesini genişlettiği gibi dilediği şeyleri dilediği kadar genişleten Mûsi’!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 10, "title": "Onuncu Bâb", "e": [{"ar": "يَا صَانِعَ كُلِّ مَصْنُوعٍ", "ok": "Yâ sâni’a külli masnû’", "tr": "Ey her biri birer sanat mucizesi olan varlıkların sanatkârı!"}, {"ar": "يَا خَالِقَ كُلِّ مَخْلُوقٍ", "ok": "Yâ hâlika külli mahlûk", "tr": "Ey yaratılmış olan her şeyin yegâne yaratıcısı!"}, {"ar": "يَا رَازِقَ كُلِّ مَرْزُوقٍ", "ok": "Yâ râzika külli merzûk", "tr": "Ey rızka muhtaç olan bütün varlığın rızkını veren!"}, {"ar": "يَا مَالِكَ كُلِّ مَمْلُوكٍ", "ok": "Yâ mâlike külli memlûk", "tr": "Ey zerrelerden seyyârelere kadar topyekûn mevcudatın gerçek sahibi!"}, {"ar": "يَا كَاشِفَ كُلِّ مَكْرُوبٍ", "ok": "Yâ kâşife külli mekrûb", "tr": "Ey dertli kullarının sıkıntılarını gideren!"}, {"ar": "يَا فَارِجَ كُلِّ مَغْمُومٍ", "ok": "Yâ fârice külli mağmûm", "tr": "Ey gamlı ve mahzun kullarının hüznünü feraha çeviren!"}, {"ar": "يَا رَاحِمَ كُلِّ مَرْحُومٍ", "ok": "Yâ râhime külli merhûm", "tr": "Ey şefkate muhtaç kullarını re’fet ve rahmetiyle sevindiren!"}, {"ar": "يَا نَاصِرَ كُلِّ مَخْذُولٍ", "ok": "Yâ nâsıre külli mahzûl", "tr": "Ey yardımsız kalanların imdadına yetişen!"}, {"ar": "يَا سَاتِرَ كُلِّ مَعْيُوبٍ", "ok": "Yâ sâtire külli ma’yûb", "tr": "Ey Kendisine karşı ayıp ve kusur işleyenlerin günahlarını örten!"}, {"ar": "يَا مَلْجَأَ كُلِّ مَظْلوُمٍ", "ok": "Yâ melce’e külli mazlûm", "tr": "Ey haksızlık ve zulme maruz kalanların biricik sığınağı olan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 11, "title": "On Birinci Bâb", "e": [{"ar": "يَا عُدَّتِي عِنْدَ شِدَّتِي", "ok": "Yâ uddetî inde şiddetî", "tr": "Ey bir sıkıntıya düştüğümde tek dayanağım!"}, {"ar": "يَا رَجَٓائِي عِنْدَ مُصِيبَتِي", "ok": "Yâ recâî inde musîbetî", "tr": "Ey bir musibetle karşılaştığımda biricik recâ ve ümit kaynağım!"}, {"ar": "يَا مُونِسِي عِنْدَ وَحْشَتِي", "ok": "Yâ mûnisî inde vahşetî", "tr": "Ey yalnızlık derdine müptela olduğum anlarda yegâne enîsim!"}, {"ar": "يَا صَاحِبِي عِنْدَ غُرْبَتِي", "ok": "Yâ sâhibî inde ğurbetî", "tr": "Ey garip ve yalnız hâllerimde sahibim, yüce dostum!"}, {"ar": "يَا وَلِيِّي عِنْدَ نِعْمَتِي", "ok": "Yâ veliyyî inde ni’metî", "tr": "Ey ihsanlarını sağanak sağanak yağdıran veliy-yi nimetim!"}, {"ar": "يَا كَاشِفِي عِنْدَ كُرْبَتِي", "ok": "Yâ kâşifî inde kürbetî", "tr": "Ey tasalarımı giderenim!"}, {"ar": "يَا غِيَاثِي عِنْدَ افْتِقَارِي", "ok": "Yâ ğıyâsî inde’ftikârî", "tr": "Ey fakir ve muhtaç hâle düştüğümde yardım edenim!"}, {"ar": "يَا مَلْجَئِي عِنْدَ اضْطِرَارِي", "ok": "Yâ melce’î inde’dtırârî", "tr": "Ey ızdırar hâllerimde biricik melceim!"}, {"ar": "يَا مُعِينِي عِنْدَ فَزَعِي", "ok": "Yâ mu’înî inde feze’î", "tr": "Ey korkuya kapıldığımda inayetiyle imdadıma yetişenim!"}, {"ar": "يَا دَلِيلِي عِنْدَ حَيْرَتِي", "ok": "Yâ delîlî inde hayretî", "tr": "Ey hayret ve şaşkınlık yaşadığımda yol gösterenim!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 12, "title": "On İkinci Bâb", "e": [{"ar": "يَا عَلَّامَ الْغُيُوبِ", "ok": "Yâ allâme’l-ğuyûb", "tr": "Ey gayb âlemlerini yegâne bilen!"}, {"ar": "يَا غَفَّارَ الذُّنُوبِ", "ok": "Yâ ğaffâre’z-zünûb", "tr": "Ey günahları mağfiret eden!"}, {"ar": "يَا سَتَّارَ الْعُيُوبِ", "ok": "Yâ settâre’l-uyûb", "tr": "Ey ayıpları örten!"}, {"ar": "يَا كَشَّافَ الْكُرُوبِ", "ok": "Yâ keşşâfe’l-kürûb", "tr": "Ey tasaları gideren!"}, {"ar": "يَا مُقَلِّبَ الْقُلُوبِ", "ok": "Yâ mukallibe’l-kulûb", "tr": "Ey kalbleri hâlden hâle evirip çeviren!"}, {"ar": "يَا مُزَيِّنَ الْقُلُوبِ", "ok": "Yâ müzeyyine’l-kulûb", "tr": "Ey kalbleri güzelliklerle bezeyen!"}, {"ar": "يَا مُنَوِّرَ الْقُلُوبِ", "ok": "Yâ münevvire’l-kulûb", "tr": "Ey kalbleri nuruyla zinetlendiren!"}, {"ar": "يَا طَبِيبَ الْقُلُوبِ", "ok": "Yâ tabîbe’l-kulûb", "tr": "Ey kalbleri tedavi eden!"}, {"ar": "يَا حَبِيبَ الْقُلُوبِ", "ok": "Yâ habîbe’l-kulûb", "tr": "Ey kalbleri muhabbetiyle şereflendiren!"}, {"ar": "يَٓا اَنِيسَ الْقُلُوبِ", "ok": "Yâ enîse’l-kulûb", "tr": "Ey kalblere ünsiyet bahşeden!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 13, "title": "On Üçüncü Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Ey en güzel isimlerin sahibi olan Allahım! Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا جَلِيلُ", "ok": "Yâ Celîl", "tr": "Ey nefislerde ürperti ve haşyet hâsıl eden Celîl!"}, {"ar": "يَا جَمِيلُ", "ok": "Yâ Cemîl", "tr": "Ey güzeller güzeli ve her güzelliğin kaynağı olan Cemîl!"}, {"ar": "يَا وَكِيلُ", "ok": "Yâ Vekîl", "tr": "Ey güvenilip dayanılan ve Kendisine itimat edilen Vekîl!"}, {"ar": "يَا كَفِيلُ", "ok": "Yâ Kefîl", "tr": "Ey bütün varlıkların Yüce Zâtına güvenip dayandıkları, onların ihtiyaçlarını tastamam ve vakti vaktine yetiştiren Kefîl!"}, {"ar": "يَا دَلِيلُ", "ok": "Yâ Delîl", "tr": "Ey varlık ve birliğine kâinatın bağrında sayısız işaret ve işaretçiler yerleştiren ve kullarını dosdoğru yola eriştiren Delîl!"}, {"ar": "يَا مُقِيلُ", "ok": "Yâ Mukîl", "tr": "Ey kullarının hata ve günahlarını görmezden gelip onları bağışlayan Mukîl!"}, {"ar": "يَا خَبِيرُ", "ok": "Yâ Habîr", "tr": "Ey herkesten ve her şeyden haberdar olan Habîr!"}, {"ar": "يَا لَطِيفُ", "ok": "Yâ Latîf", "tr": "Ey en ince noktalara kadar ihtiyaçları görüp gözeten Latîf!"}, {"ar": "يَا عَزِيزُ", "ok": "Yâ Azîz", "tr": "Ey eşi, benzeri olmayan yegâne galip ve Azîz!"}, {"ar": "يَا مَلِيكُ", "ok": "Yâ Melîk", "tr": "Ey her şey ve herkesin üzerinde mutlak tasarruf sahibi Melîk!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 14, "title": "On Dördüncü Bâb", "e": [{"ar": "يَا دَلِيلَ الْمُتَحَيِّرِينَ", "ok": "Yâ delîle’l-mütehayyirîn", "tr": "Ey mütehayyir ve şaşkın kullarına çıkış yolları gösteren!"}, {"ar": "يَا غِيَاثَ الْمُسْتَغِيثِينَ", "ok": "Yâ ğıyâse’l-müstağîsîn", "tr": "Ey yardım dileyenlerin imdadına koşan!"}, {"ar": "يَا صَرِيخَ الْمُسْتَصْرِخِينَ", "ok": "Yâ sarîha’l-müstasrihîn", "tr": "Ey muzdarip kullarının çığlıklarına icabet eden!"}, {"ar": "يَا جَارَ الْمُسْتَجِيرِينَ", "ok": "Yâ câre’l-müstecîrîn", "tr": "Ey hıfz u sıyanet talebinde bulunanları koruyup kollayan!"}, {"ar": "يَا مَلْجَأَ الْعَاصِينَ", "ok": "Yâ melce’e’l-âsîn", "tr": "Ey sürçüp günaha düşenleri dergâhına kabul buyuran!"}, {"ar": "يَا غَافِرَ الْمُذْنِبِينَ", "ok": "Yâ ğâfire’l-müznibîn", "tr": "Ey nedametle kapısının tokmağına dokunan mücrimleri bağışlayan!"}, {"ar": "يَٓا اَمَانَ الْخَٓائِفِينَ", "ok": "Yâ emâne’l-hâifîn", "tr": "Ey korkan kullarının sinelerine emn ü eman salan!"}, {"ar": "يَا رَاحِمَ الْمَسَاكِينَ", "ok": "Yâ râhime’l-mesâkîn", "tr": "Ey merhametiyle miskin ve düşkünlerin elinden tutan!"}, {"ar": "يَٓا اَنِيسَ الْمُسْتَوْحِشِينَ", "ok": "Yâ enîse’l-müstevhişîn", "tr": "Ey vahşete kapılıp yalnızlık yaşayanlara enîs ve yüce dost olan!"}, {"ar": "يَا مُجِيبَ دَعْوَةِ الْمُضْطَرِّينَ", "ok": "Yâ mücîbe da’veti’l-mudtarrîn", "tr": "Ey ızdırar içinde kıvranan kullarının yakarışlarına cevap veren!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 15, "title": "On Beşinci Bâb", "e": [{"ar": "يَا ذَا الْجُودِ وَاْلاِحْسَانِ", "ok": "Yâ ze’l-cûdi ve’l-ihsân", "tr": "Ey sonsuz cömertlik ve ihsanda bulunan!"}, {"ar": "يَا ذَا الْفَضْلِ وَالْاِمْتِنَانِ", "ok": "Yâ ze’l-fadli ve’l-imtinân", "tr": "Ey kullarına fazlından sayısız nimetler yağdıran!"}, {"ar": "يَا ذَا الْاَمْنِ وَالْاَمَانِ", "ok": "Yâ ze’l-emni ve’l-emân", "tr": "Ey mü’min kullarının gönüllerini emn ü emanla dolduran!"}, {"ar": "يَا ذَا الْقُدْسِ وَالسُّبْحَانِ", "ok": "Yâ ze’l-kudsi ve’s-sübhân", "tr": "Ey Kendisi her türlü eksiklikten münezzeh ve mukaddes bulunan; bütün kâinattaki nezafet ve temizliğin de kaynağı olan!"}, {"ar": "يَا ذَا الْحِكْمَةِ وَالْبَيَانِ", "ok": "Yâ ze’l-hikmeti ve’l-beyân", "tr": "Ey her şeyi yerli yerinde, hikmetle yerleştiren ve varlığın mimarisini beyanıyla resmeden!"}, {"ar": "يَا ذَا الرَّحْمَةِ وَالرِّضْوَانِ", "ok": "Yâ ze’r-rahmeti ve’r-rıdvân", "tr": "Ey rahmeti sonsuz ve emrince kulluk eden kullarından razı ve hoşnut olan!"}, {"ar": "يَا ذَا الْحُجَّةِ وَالْبُرْهَانِ", "ok": "Yâ ze’l-hucceti ve’l-bürhân", "tr": "Ey varlık ve birliğinin apaçık delillerini kâinatın bağrına serpiştirip nazarlara sunan!"}, {"ar": "يَا ذَا الْعَظَمَةِ وَالسُّلْطَانِ", "ok": "Yâ ze’l-azameti ve’s-sültân", "tr": "Ey azamet tahtının yegâne sahibi, mülk ve melekût âlemlerinin tek Sultanı!"}, {"ar": "يَا ذَا الْعَفْوِ وَالْغُفْرَانِ", "ok": "Yâ ze’l-afvi ve’l-ğufrân", "tr": "Ey her türlü hata ve günahları affedip yarlığayan!"}, {"ar": "يَا ذَا الرَّأْفَةِ وَالْمُسْتَعَانِ", "ok": "Yâ ze’r-re’feti ve’l-müste’ân", "tr": "Ey her bir kulunu re’fet ve şefkatiyle sarıp sarmalayan ve yardım sadece Kendi kapısında aranan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 16, "title": "On Altıncı Bâb", "e": [{"ar": "يَا مَنْ هُوَ رَبُّ كُلِّ شَيْءٍ", "ok": "Yâ men hüve rabbu külli şey’", "tr": "Ey her şeyin yegâne Rabbi!"}, {"ar": "يَا مَنْ هُوَ اِلٰهُ كُلِّ شَيْءٍ", "ok": "Yâ men hüve ilâhu külli şey’", "tr": "Ey her şeyin yegâne İlâhı!"}, {"ar": "يَا مَنْ هُوَ خَالِقُ كُلِّ شَيْءٍ", "ok": "Yâ men hüve hâliku külli şey’", "tr": "Ey her şeyin yegâne Hâlıkı!"}, {"ar": "يَا مَنْ هُوَ فَوْقَ كُلِّ شَيْءٍ", "ok": "Yâ men hüve fevka külli şey’", "tr": "Ey her şeyin üstünde ve her şeyden yüce!"}, {"ar": "يَا مَنْ هُوَ قَبْلَ كُلِّ شَيْءٍ", "ok": "Yâ men hüve kable külli şey’", "tr": "Ey varlığı her şeyden evvel!"}, {"ar": "يَا مَنْ هُوَ بَعْدَ كُلِّ شَيْءٍ", "ok": "Yâ men hüve ba’de külli şey’", "tr": "Ey varlığı her şeyden sonra!"}, {"ar": "يَا مَنْ هُوَ عَالِمُ كُلِّ شَيْءٍ", "ok": "Yâ men hüve âlimu külli şey’", "tr": "Ey olmuş-olacak, cüz’î-küllî her şeyi bilen!"}, {"ar": "يَا مَنْ هُوَ قَادِرُ كُلِّ شَيْءٍ", "ok": "Yâ men hüve kâdiru külli şey’", "tr": "Ey dilediği her şeyi gerçekleştirmeye kâdir olan!"}, {"ar": "يَا مَنْ هُوَ صَانِعُ كُلِّ شَيْءٍ", "ok": "Yâ men hüve sâni’u külli şey’", "tr": "Ey her şeyi fevkalâde bir sanatla yaratan!"}, {"ar": "يَا مَنْ هُوَ يَبْقٰى وَيَفْنٰى كُلُّ شَيْءٍ", "ok": "Yâ men hüve yebkâ ve yefnâ küllü şey’", "tr": "Ey yarattığı her şey fani olan fakat Kendisi için fena söz konusu olmayan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 17, "title": "On Yedinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allah’ım! Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا مُؤْمِنُ", "ok": "Yâ Mü’min", "tr": "Ey Kendi rubûbiyetinin şahidi olan ve herkese güven vaat eden Mü’min!"}, {"ar": "يَا مُهَيْمِنُ", "ok": "Yâ Müheymin", "tr": "Ey herkesi ve her şeyi her an görüp gözeten Müheymin!"}, {"ar": "يَا مُكَوِّنُ", "ok": "Yâ Mükevvin", "tr": "Ey topyekûn mükevvenat ve mevcudatı yoktan var eden Mükevvin!"}, {"ar": "يَا مُلَقِّنُ", "ok": "Yâ Mülakkın", "tr": "Ey yarattıklarına kendileri için lüzumlu bilgileri talim ve telkin buyuran Mülakkin!"}, {"ar": "يَا مُبَيِّنُ", "ok": "Yâ Mübeyyin", "tr": "Ey şuur sahibi kullarına her şeyin doğrusunu en doğru şekilde açıklayıp beyan eden Mübeyyin!"}, {"ar": "يَا مُهَوِّنُ", "ok": "Yâ Mühevvin", "tr": "Ey zorlukları kolay, belâları hafif hâle getiren Mühevvin!"}, {"ar": "يَا مُزَيِّنُ", "ok": "Yâ Müzeyyin", "tr": "Ey varlık âlemini en güzel şekilde zinetlendirdiği gibi sevdiği kullarının gönül dünyalarını da zinetlendiren Müzeyyin!"}, {"ar": "يَا مُعَظِّمُ", "ok": "Yâ Mu’azzım", "tr": "Ey Zâtının yüceliğini beyan ve icraat-ı sübhaniyesiyle ilan eden ve dilediğini dilediği kadar yücelten Muazzım!"}, {"ar": "يَا مُعَوِّنُ", "ok": "Yâ Mu’avvin", "tr": "Ey inayetiyle mahlûkatının yardımına koşan Muavvin!"}, {"ar": "يَا مُلَوِّنُ", "ok": "Yâ Mülevvin", "tr": "Ey varlığı çeşit çeşit, renk renk, desen desen yaratan ve basiretli nazarlara arz eden Mülevvin!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 18, "title": "On Sekizinci Bâb", "e": [{"ar": "يَا مَنْ هُوَ فِي مُلْكِهِ مُقِيمٌ", "ok": "Yâ men hüve fî mülkihi mukîm", "tr": "Ey mülkü olan bütün kâinattaki tasarruf ve idaresi her an kesintisiz devam eden Mukîm!"}, {"ar": "يَا مَنْ هُوَ فِي جَلَالِهِ عَظِيمٌ", "ok": "Yâ men hüve fî celâlihi azîm", "tr": "Ey nefislerde ürperti ve haşyet hâsıl eden, celâlinde en büyük ve ulu olan Azîm!"}, {"ar": "يَا مَنْ هُوَ فِي سُلْطَانِهِ قَدِيمٌ", "ok": "Yâ men hüve fî sültânihi kadîm", "tr": "Ey saltanatında ezelî olan Kadîm!"}, {"ar": "يَا مَنْ هُوَ عَلٰى عَبْدِهِ رَحِيمٌ", "ok": "Yâ men hüve alâ abdihi rahîm", "tr": "Ey donanım, konum ve liyakatine göre kullarına bol bol merhamet eden Rahîm!"}, {"ar": "يَا مَنْ هُوَ بِكُلِّ شَيْءٍ عَلِيمٌ", "ok": "Yâ men hüve bikülli şey’in alîm", "tr": "Ey olmuş-olacak, cüz’î-küllî her şeyi bilen Alîm!"}, {"ar": "يَا مَنْ هُوَ لِمَنْ جَفَاهُ حَلِيمٌ", "ok": "Yâ men hüve limen cefâhu halîm", "tr": "Ey günah işleyenleri hemen cezalandırmayan ve onlara dönüp tevbe etme fırsatları veren Halîm!"}, {"ar": "يَا مَنْ هُوَ لِمَنْ تَرَجَّاهُ كَرِيمٌ", "ok": "Yâ men hüve limen tereccâhu kerîm", "tr": "Ey recâ hisleriyle kapısına gelenlere çokça iyilik ve ihsanlarda bulunan Kerîm!"}, {"ar": "يَا مَنْ هُوَ فِي مَقَادِيرِهِ حَكِيمٌ", "ok": "Yâ men hüve fî makâdîrihi hakîm", "tr": "Ey ezelî ilmiyle çizdiği kaderde her şeyi yerli yerinde, hikmetle vaz’ eden Hakîm!"}, {"ar": "يَا مَنْ هُوَ فِي حُكْمِهِ لَطِيفٌ", "ok": "Yâ men hüve fî hukmihi latîf", "tr": "Ey hükümlerinde lütuf ve keremini izhar eden, en ince noktalara kadar ihtiyaçları gören, gözeten Latîf!"}, {"ar": "يَا مَنْ هُوَ فِي لُطْفِهِ قَدِيرٌ", "ok": "Yâ men hüve fî lutfihi kadîr", "tr": "Ey her şeye gücü yettiği gibi dilediği lütfunu dilediğine ulaştırmaya da gücü yeten Kadîr!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 19, "title": "On Dokuzuncu Bâb", "e": [{"ar": "يَا مَنْ لَا يُرْجىٰٓ اِلَّا فَضْلُهُ", "ok": "Yâ men lâ yürcâ illâ fadlüh", "tr": "Ey lütuf ve ihsan sadece Yüce Zâtından umulup beklenilen!"}, {"ar": "يَا مَنْ لَا يُخَافُ اِلَّا عَدْلُهُ", "ok": "Yâ men lâ yuhâfu illâ adlüh", "tr": "Ey yalnız Kendi adaletinden (rahmetiyle muamele etmemesinden) korkulan!"}, {"ar": "يَا مَنْ لَا يُنْتَظَرُ اِلَّا بِرُّهُ", "ok": "Yâ men lâ yüntazaru illâ birruh", "tr": "Ey iyilik ve güzellikler ancak Kendisinden beklenen!"}, {"ar": "يَا مَنْ لَا يُسْئَلُ اِلَّا عَفْوُهُ", "ok": "Yâ men lâ yüs’elu illâ afvüh", "tr": "Ey afv u mağfiret sadece Kendisinden talep edilen!"}, {"ar": "يَا مَنْ لَا يَدُومُ اِلَّا مُلْكُهُ", "ok": "Yâ men lâ yedûmu illâ mülküh", "tr": "Ey sadece Kendi mülk ve hâkimiyeti devamlı olan!"}, {"ar": "يَا مَنْ لَا سُلْطَانَ اِلَّا سُلْطَانُهُ", "ok": "Yâ men lâ sültâne illâ sültânüh", "tr": "Ey saltanatından başka hiçbir hakiki saltanat bulunmayan!"}, {"ar": "يَا مَنْ لَا بُرْهَانَ اِلَّا بُرْهَانُهُ", "ok": "Yâ men lâ bürhâne illâ bürhânüh", "tr": "Ey bütün deliller Ulu Zâtının vücud ve vahdetine delâlet eden!"}, {"ar": "يَا مَنْ وَسِعَتْ كُلَّ شَيْءٍ رَحْمَتُهُ", "ok": "Yâ men vesi’at külle şey’in rahmetüh", "tr": "Ey rahmetiyle her şeyi kuşatan!"}, {"ar": "يَا مَنْ سَبَقَتْ رَحْمَتُهُ عَلٰى غَضَبِهِ", "ok": "Yâ men sebakat rahmetühü alâ ğadabih", "tr": "Ey rahmeti gazabını geçen!"}, {"ar": "يَا مَنْ اَحَاطَ بِكُلِّ شَيْءٍ عِلْمُهُ", "ok": "Yâ men ehâta bikülli şey’in ilmüh", "tr": "Ey ilmiyle her şeyi ihata eden!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 20, "title": "Yirminci Bâb", "e": [{"ar": "يَا فَارِجَ الْهَمِّ", "ok": "Yâ fârice’l-hemm", "tr": "Ey endişe ve kaygıları gideren!"}, {"ar": "يَا كَاشِفَ الْغَمِّ", "ok": "Yâ kâşife’l-ğamm", "tr": "Ey tasa ve hüzünleri kaldıran!"}, {"ar": "يَا غَافِرَ الذَّنْبِ", "ok": "Yâ ğâfire’z-zenb", "tr": "Ey günahları bağışlayan!"}, {"ar": "يَا قَابِلَ التَّوْبِ", "ok": "Yâ kâbile’t-tevb", "tr": "Ey tevbeleri kabul buyuran!"}, {"ar": "يَاخَالِقَ الْخَلْقِ", "ok": "Yâ hâlika’l-halk", "tr": "Ey bütün varlıkları yaratan!"}, {"ar": "يَا صَادِقَ الْوَعْدِ", "ok": "Yâ sâdika’l-va’d", "tr": "Ey her vaadini mutlaka gerçekleştiren!"}, {"ar": "يَا رَازِقَ الطِّفْلِ", "ok": "Yâ râzika’t-tıfl", "tr": "Ey âciz yavruları en iyi şekilde rızıklandıran!"}, {"ar": "يَا مُوفِيَ الْعَهْدِ", "ok": "Yâ mûfiye’l-ahd", "tr": "Ey her ahdini mutlaka yerine getiren!"}, {"ar": "يَا عَالِمَ السِّرِّ", "ok": "Yâ âlime’s-sirr", "tr": "Ey bütün sırları bilen!"}, {"ar": "يَا فَالِقَ الْحَبِّ", "ok": "Yâ fâlika’l-habb", "tr": "Ey tohum ve taneleri çatlatıp yaran, onları gelişme yoluna koyan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 21, "title": "Yirmi Birinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allah’ım! Senden yine şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا عَلِىُّ", "ok": "Yâ Alî", "tr": "Ey kadri yüce, şanı yüksek ve müteâl Aliyy!"}, {"ar": "يَا وَفِيُّ", "ok": "Yâ Vefî", "tr": "Ey her vaadini başları döndürecek bir vefa derinliği ile yerine getiren ve bütün vefaların kaynağı olan Vefiyy!"}, {"ar": "يَا وَلِيُّ", "ok": "Yâ Velî", "tr": "Ey dost ve yardımcı Veliyy!"}, {"ar": "يَا غَنِيُّ", "ok": "Yâ Ğanî", "tr": "Ey kimseye muhtaç olmayan Ğaniyy!"}, {"ar": "يَا مَلِيُّ", "ok": "Yâ Melî", "tr": "Ey sonsuz hazineleri her zaman dolu olan ve o hazinelerden kullarına sayısız lütuflarda bulunan ezel ve ebed sultanı Meliyy!"}, {"ar": "يَا زَكِيُّ", "ok": "Yâ Zekî", "tr": "Ey Yüce Zâtı bütün noksanlardan müberra olan ve nefisler ancak tezkiyesiyle arınan Zekiyy!"}, {"ar": "يَا رَضِيُّ", "ok": "Yâ Radî", "tr": "Ey kullarına rıza yollarını gösteren ve itaatkâr kullarından razı olan Radıyy!"}, {"ar": "يَا بَدِيُّ", "ok": "Yâ Bedî", "tr": "Ey âyât ve âsârıyla apaçık Bediyy!"}, {"ar": "يَا حَفِيُّ", "ok": "Yâ Hafî", "tr": "Ey fazl u ihsanlarda bulunan ve her şeyi bütün incelikleriyle bilen Hafiyy!"}, {"ar": "يَا قَوِيُّ", "ok": "Yâ Kavî", "tr": "Ey dilediğini dilediği gibi icra eden kuvvet sahibi Kaviyy!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 22, "title": "Yirmi İkinci Bâb", "e": [{"ar": "يَا مَنْ اَظْهَرَ الْجَمِيلَ", "ok": "Yâ men azhere’l-cemîl", "tr": "Ey Kendi güzelliğinin akisleri olarak güzellikler izhar eden!"}, {"ar": "يَا مَنْ سَتَرَ عَلَى الْقَبِيحِ", "ok": "Yâ men setere ale’l-kabîh", "tr": "Ey çirkinlikleri örten!"}, {"ar": "يَا مَنْ لَا يُؤَاخِذُ بِالْجَرِيمَةِ", "ok": "Yâ men lâ yü’âhızu bi’l-cerîmeh", "tr": "Ey cürm işleyen kullarını hemen cezalandırmayıp onlara tevbe yollarını gösteren!"}, {"ar": "يَا مَنْ لَا يَهْتِكُ السِّتْرَ", "ok": "Yâ men lâ yehtiku’s-sitr", "tr": "Ey perdeyi yırtmayan!"}, {"ar": "يَا عَظِيمَ الْعَفْوِ", "ok": "Yâ azîme’l-afv", "tr": "Ey affı çok büyük olan!"}, {"ar": "يَا حَسَنَ التَّجَاوُزِ", "ok": "Yâ hasene’t-tecâvüz", "tr": "Ey kullarının günahlarını en güzel şekilde affeden!"}, {"ar": "يَا وَاسِعَ الْمَغْفِرَةِ", "ok": "Yâ vâsi’a’l-mağfireh", "tr": "Ey mağfireti çok geniş olan!"}, {"ar": "يَا بَاسِطَ الْيَدَيْنِ بِالرَّحْمَةِ", "ok": "Yâ bâsita’l-yedeyni bi’r-rahmeh", "tr": "Ey rahmetini değişik tecelli dalga boylarında sergileyen!"}, {"ar": "يَا صَاحِبَ كُلِّ نَجْوٰى", "ok": "Yâ sâhibe külli necvâ", "tr": "Ey her fısıltıyı işitip bilen!"}, {"ar": "يَا مُنْتَهٰى كُلِّ شَكْوٰى", "ok": "Yâ müntehâ külli şekvâ", "tr": "Ey bütün şekva ve arz-ı hâller en nihai merci olarak Kendisine ulaşan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 23, "title": "Yirmi Üçüncü Bâb", "e": [{"ar": "يَا ذَا النِّعْمَةِ السَّابِغَةِ", "ok": "Yâ ze’n-ni’meti’s-sâbiğah", "tr": "Ey sınırsız nimetlerin sahibi!"}, {"ar": "يَا ذَا الرَّحْمَةِ الْوَاسِعَةِ", "ok": "Yâ ze’r-rahmeti’l-vâsi’ah", "tr": "Ey pek geniş bir rahmetin sahibi!"}, {"ar": "يَا ذَا الْحِكْمَةِ الْبَالِغَةِ", "ok": "Yâ ze’l-hikmeti’l-bâliğah", "tr": "Ey apaçık ve tastamam bir hikmetin sahibi!"}, {"ar": "يَا ذَا الْقُدْرَةِ الْكَامِلَةِ", "ok": "Yâ ze’l-kudreti’l-kâmileh", "tr": "Ey kudret-i kâmilenin, sonsuz kudretin sahibi!"}, {"ar": "يَا ذَا الْحُجَّةِ الْقَاطِعَةِ", "ok": "Yâ ze’l-hucceti’l-kâtı’ah", "tr": "Ey en kesin ve mükemmel delilin sahibi!"}, {"ar": "يَا ذَا الْكَرَامَةِ الظَّاهِرَةِ", "ok": "Yâ ze’l-kerâmeti’z-zâhireh", "tr": "Ey her yerde apaçık müşahede edilen ikramların sahibi!"}, {"ar": "يَا ذَا الصِّفَةِ الْعَالِيَةِ", "ok": "Yâ ze’s-sıfeti’l-âliyeh", "tr": "Ey en ulvi, en yüce sıfatların sahibi!"}, {"ar": "يَا ذَا الْعِزَّةِ الدَّٓائِمَةِ", "ok": "Yâ ze’l-izzeti’d-dâimeh", "tr": "Ey eşi benzeri olmayan ebedî izzet ve hâkimiyetin sahibi!"}, {"ar": "يَا ذَا الْقُوَّةِ الْمَتِينَةِ", "ok": "Yâ ze’l-kuvveti’l-metîneh", "tr": "Ey dilediğini dilediği gibi icra eden aşılamaz kuvvetin sahibi!"}, {"ar": "يَا ذَا الْمِنَّةِ السَّابِقَةِ", "ok": "Yâ ze’l-minneti’s-sâbikah", "tr": "Ey kullarının şevkini peşin ücret ve avanslarla şahlandıran nimetler sahibi!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 24, "title": "Yirmi Dördüncü Bâb", "e": [{"ar": "يَٓا اَحْكَمَ الْحَاكِمِينَ", "ok": "Yâ ahkeme’l-hâkimîn", "tr": "Ey hükmü bütün hükümlerin üstünde bulunan!"}, {"ar": "يَٓا اَعْدَلَ الْعَادِلِينَ", "ok": "Yâ a’dele’l-âdilîn", "tr": "Ey adaleti bütün adaletleri aşkın olan!"}, {"ar": "يَٓا اَصْدَقَ الصَّادِقِينَ", "ok": "Yâ asdaka’s-sâdikîn", "tr": "Ey söz ve icraatında en doğru olan!"}, {"ar": "يَٓا اَظْهَرَ الظَّاهِرِينَ", "ok": "Yâ azhere’z-zâhirîn", "tr": "Ey varlığı en kesin ve en zâhir olan!"}, {"ar": "يَٓا اَطْهَرَ الطَّاهِرِينَ", "ok": "Yâ athere’t-tâhirîn", "tr": "Ey her türlü eksik ve kusurdan münezzeh ve temiz bulunan!"}, {"ar": "يَٓا اَحْسَنَ الْخَالِقِينَ", "ok": "Yâ ahsene’l-hâlikîn", "tr": "Ey yegâne yaratıcı olan ve yarattıklarını yaratma mertebelerinin en güzeliyle yaratan!"}, {"ar": "يَٓا اَسْرَعَ الْحَاسِبِينَ", "ok": "Yâ esra’a’l-hâsibîn", "tr": "Ey hesapları en süratli bir şekilde neticeye ulaştıran!"}, {"ar": "يَٓا اَسْمَعَ السَّامِعِينَ", "ok": "Yâ esme’a’s-sâmi’în", "tr": "Ey her şeyi tastamam işiten, işitmesi bütün işitmelerin üstünde olan!"}, {"ar": "يَٓا اَكْرَمَ الْاَكْرَمِينَ", "ok": "Yâ ekreme’l-ekremîn", "tr": "Ey kerem ve ihsanları çok aşkın olan!"}, {"ar": "يَٓا اَرْحَمَ الرَّاحِمِينَ", "ok": "Yâ erhame’r-râhimîn", "tr": "Ey merhameti bütün merhametlerin üstünde ve onlardan farklı olan!"}, {"ar": "يَٓا اَشْفَعَ الشَّافِعِينَ", "ok": "Yâ eşfe’a’ş-şâfi’în", "tr": "Ey şefaati bütün şefaat edenlerin şefaatlerinden kıyas edilemeyecek kadar büyük olan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 25, "title": "Yirmi Beşinci Bâb", "e": [{"ar": "يَا بَدِيعَ السَّمٰوَاتِ", "ok": "Yâ bedî’a’s-semâvât", "tr": "Ey semavatı yoktan ve benzersiz bir şekilde yaratan!"}, {"ar": "يَا جَاعِلَ الظُّلُمَاتِ", "ok": "Yâ câ’ile’z-zulümât", "tr": "Ey kudret ve hikmetinin bir tecellisi olarak karanlıkları var eden!"}, {"ar": "يَا عَالِمَ الْخَفِيَّاتِ", "ok": "Yâ âlime’l-hafiyyât", "tr": "Ey bütün gizli şeyleri ve sırları bilen!"}, {"ar": "يَا رَاحِمَ الْعَبَرَاتِ", "ok": "Yâ râhime’l-aberât", "tr": "Ey sesi soluğu gözyaşına dönüşen kullarına rahmetiyle teveccüh eden!"}, {"ar": "يَا سَاتِرَ الْعَوَرَاتِ", "ok": "Yâ sâtire’l-averât", "tr": "Ey ayıp ve kusurları örtüp gizleyen!"}, {"ar": "يَا كَاشِفَ الْبَلِيَّاتِ", "ok": "Yâ kâşife’l-beliyyât", "tr": "Ey belâ ve musibetleri gideren!"}, {"ar": "يَا مُحْيِيَ الْاَمْوَاتِ", "ok": "Yâ muhyiye’l-emvât", "tr": "Ey ölüden diri çıkaran, ölü ruhlara diriliş nefheden ve haşirde bütün ölüleri tekrar dirilten!"}, {"ar": "يَا ضَاعِفَ الْحَسَنَاتِ", "ok": "Yâ dâ’ife’l-hasenât", "tr": "Ey kullarının iyiliklerini kat kat fazlasıyla mükâfatlandıran!"}, {"ar": "يَا مُنْزِلَ الْبَرَكَاتِ", "ok": "Yâ münzile’l-berekât", "tr": "Ey bahşettiği rızıkları bereketlendirerek artıran!"}, {"ar": "يَا شَدِيدَ النَّقَمَاتِ", "ok": "Yâ şedîde’n-nakamât", "tr": "Ey müstahak olanları cezalandırması pek çetin olan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 26, "title": "Yirmi Altıncı Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا مُصَوِّرُ", "ok": "Yâ Musavvir", "tr": "Ey her bir yarattığına en layık sureti veren Musavvir!"}, {"ar": "يَا مُقَدِّرُ", "ok": "Yâ Mukaddir", "tr": "Ey her şeyin kaderini ezelî ilmiyle belirleyen ve onu en hassas ölçülerle varlık sahasına çıkaran Mukaddir!"}, {"ar": "يَا مُطَهِّرُ", "ok": "Yâ Mutahhir", "tr": "Ey maddî ve mânevî kirleri temizleyip arındıran Mutahhir!"}, {"ar": "يَا مُنَوِّرُ", "ok": "Yâ Münevvir", "tr": "Ey sonsuz nuruyla bütün mevcudatı ve kullarının kalblerini nurlandıran Münevvir!"}, {"ar": "يَا مُقَدِّمُ", "ok": "Yâ Mukaddim", "tr": "Ey istediğini öne çıkaran Mukaddim!"}, {"ar": "يَا مُؤَخِّرُ", "ok": "Yâ Mü’ahhır", "tr": "Ey istediğini geriye bırakan Muahhir!"}, {"ar": "يَا مُيَسِّرُ", "ok": "Yâ Müyessir", "tr": "Ey herkese yürümek istediği yolun önünü açan ve zorlukları kolay hâle getiren Müyessir!"}, {"ar": "يَا مُنْذِرُ", "ok": "Yâ Münzir", "tr": "Ey kullarını isyandan sakındırmak için azabıyla korkutan Münzir!"}, {"ar": "يَا مُبَشِّرُ", "ok": "Yâ Mübeşşir", "tr": "Ey itaatkâr kullarını ebedî saadet ve hoşnutluğu ile müjdeleyen Mübeşşir!"}, {"ar": "يَا مُدَبِّرُ", "ok": "Yâ Müdebbir", "tr": "Ey bütün varlık âlemini tastamam bir âhenk içinde tedbir u idare eden Müdebbir!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 27, "title": "Yirmi Yedinci Bâb", "e": [{"ar": "يَا رَبَّ الْبَيْتِ الْحَرَامِ", "ok": "Yâ rabbe’l-beyti’l-harâm", "tr": "Ey Beyt-i Haram’ın, Kâbe-i Muazzama’nın Rabbi!"}, {"ar": "يَا رَبَّ الشَّهْرِ الْحَرَامِ", "ok": "Yâ rabbe’ş-şehri’l-harâm", "tr": "Ey saygı duyulmasını emrettiği haram ayların Rabbi!"}, {"ar": "يَا رَبَّ الْمَسْجِدِ الْحَرَامِ", "ok": "Yâ rabbe’l-mescidi’l-harâm", "tr": "Ey Mescid-i Haram’ın Rabbi!"}, {"ar": "يَا رَبَّ الْبَلَدِ الْحَرَامِ", "ok": "Yâ rabbe’l-beledi’l-harâm", "tr": "Ey mukaddes belde Mekke-i Mükerreme’nin Rabbi!"}, {"ar": "يَا رَبَّ الرُّكْنِ وَالْمَقَامِ", "ok": "Yâ rabbe’r-rukni ve’l-makâm", "tr": "Ey Hacerü’l-Esved, Rükn-ü Yemânî ve Makam-ı İbrahim’in Rabbi!"}, {"ar": "يَا رَبَّ الْمَشْعَرِ الْحَرَامِ", "ok": "Yâ rabbe’l-meş’ari’l-harâm", "tr": "Ey Müzdelife’de bulunan mübarek Meş’ar-i Haram’ın Rabbi!"}, {"ar": "يَا رَبَّ الْحِلِّ وَالْحَرَمِ", "ok": "Yâ rabbe’l-hilli ve’l-harem", "tr": "Ey mukaddes topraklardaki Hill ve Harem bölgelerinin Rabbi!"}, {"ar": "يَا رَبَّ النُّورِ وَالظَّلَامِ", "ok": "Yâ rabbe’n-nûri ve’z-zalâm", "tr": "Ey hem aydınlıkların hem de karanlıkların, nur ile zulmetin Rabbi!"}, {"ar": "يَا رَبَّ التَّحِيَّةِ وَالسَّلَامِ", "ok": "Yâ rabbe’t-tehiyyeti ve’s-selâm", "tr": "Ey bütün medh ü senalar Kendisine raci olan, bütün tahiyyât ve selâmların Rabbi!"}, {"ar": "يَا رَبَّ الْجَلَالِ وَاْلاِكْرَامِ", "ok": "Yâ rabbe’l-celâli ve’l-ikrâm", "tr": "Ey sonsuz celâlle birlikte sonsuz ikram ve cemâlin Rabbi!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 28, "title": "Yirmi Sekizinci Bâb", "e": [{"ar": "يَا عِمَادَ مَنْ لَا عِمَادَ لَهُ", "ok": "Yâ imâde men lâ imâde leh", "tr": "Ey desteksiz kalanların yegâne desteği!"}, {"ar": "يَا سَنَدَ مَنْ لَا سَنَدَ لَهُ", "ok": "Yâ senede men lâ senede leh", "tr": "Ey dayanacak bir nokta bulamayanların biricik dayanağı!"}, {"ar": "يَا ذُخْرَ مَنْ لَا ذُخْرَ لَهُ", "ok": "Yâ zuhre men lâ zuhre leh", "tr": "Ey zâd ü zahîresiz kalanların azık kaynağı!"}, {"ar": "يَا غِيَاثَ مَنْ لَا غِيَاثَ لَهُ", "ok": "Yâ ğıyâse men lâ ğıyâse leh", "tr": "Ey yardıma muhtaç olanların yegâne yardımcısı!"}, {"ar": "يَا حِرْزَ مَنْ لَا حِرْزَ لَهُ", "ok": "Yâ hirze men lâ hirze leh", "tr": "Ey sığınacak bir yer arayanların biricik sığınağı!"}, {"ar": "يَا فَخْرَ مَنْ لَا فَخْرَ لَهُ", "ok": "Yâ fahre men lâ fahre leh", "tr": "Ey inanan kullarının yegâne iftihar kaynağı!"}, {"ar": "يَا عِزَّ مَنْ لَا عِزَّ لَهُ", "ok": "Yâ izze men lâ izze leh", "tr": "Ey kullarının sadece Kendisine iman ve itaatle zilletten kurtulup izzete erdikleri izzet menbaı!"}, {"ar": "يَا مُعِينَ مَنْ لَا مُعِينَ لَهُ", "ok": "Yâ mu’îne men lâ mu’îne leh", "tr": "Ey yardımcısı olmayanların tek yardımcısı!"}, {"ar": "يَٓا اَنِيسَ مَنْ لَٓا اَنِيسَ لَهُ", "ok": "Yâ enîse men lâ enîse leh", "tr": "Ey kimsesiz kalmışların biricik enîsi!"}, {"ar": "يَا غُنْيَةَ مَنْ لَا غُنْيَةَ لَهُ", "ok": "Yâ ğunyete men lâ ğunyete leh", "tr": "Ey Kendisini bilip tanıyanların zenginlik kaynağı!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 29, "title": "Yirmi Dokuzuncu Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden yine şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا قَٓائِمُ", "ok": "Yâ Kâim", "tr": "Ey varlığı zaruri ve Kendinden olan ve bütün mevcudat, ayakta tutmasıyla ayakta duran Kâim!"}, {"ar": "يَا دَٓائِمُ", "ok": "Yâ Dâim", "tr": "Ey varlığı ezelî ve ebedî olan, her bir varlığın devamı Kendisinin devam ettirmesiyle mümkün olan Dâim!"}, {"ar": "يَا رَاحِمُ", "ok": "Yâ Râhim", "tr": "Ey donanım, konum ve liyakate göre bol bol merhamet eden Râhim!"}, {"ar": "يَا حَاكِمُ", "ok": "Yâ Hâkim", "tr": "Ey hükmü dünyada ve âhirette geçerli olan Hâkim!"}, {"ar": "يَا عَالِمُ", "ok": "Yâ Âlim", "tr": "Ey olmuş-olacak, cüz’î-küllî her şeyi bilen Âlim!"}, {"ar": "يَا عَاصِمُ", "ok": "Yâ Âsım", "tr": "Ey kullarını dünyada zararlardan, ötede de azaptan koruyan Âsım!"}, {"ar": "يَا قَاسِمُ", "ok": "Yâ Kâsim", "tr": "Ey nimetlerini her varlığın ihtiyacına göre sonsuz adalet ve hikmetle taksim buyuran Kâsim!"}, {"ar": "يَا سَالِمُ", "ok": "Yâ Sâlim", "tr": "Ey her türlü noksan ve kusurlardan münezzeh, müberra ve muallâ olan Sâlim!"}, {"ar": "يَا قَابِضُ", "ok": "Yâ Kâbid", "tr": "Ey can alan, ruhları sıkan ve erzakı kısan Kâbıd(z)!"}, {"ar": "يَا بَاسِطُ", "ok": "Yâ Bâsit", "tr": "Ey genişletilecekleri genişleten, ruhlara inşirah veren ve her şeyi bereketlendiren Bâsıt!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 30, "title": "Otuzuncu Bâb", "e": [{"ar": "يَا عَاصِمَ مَنِ اسْتَعْصَمَهُ", "ok": "Yâ âsıme meni’sta’sameh", "tr": "Ey günah ve zararlardan korunmak için sıyanetine iltica edenleri koruyup gözeten Âsım!"}, {"ar": "يَا رَاحِمَ مَنِ اسْتَرْحَمَهُ", "ok": "Yâ râhime meni’sterhameh", "tr": "Ey Kendisinden merhamet dilenenlere rahmetiyle muamele eden Râhim!"}, {"ar": "يَا نَاصِرَ مَنِ اسْتَنْصَرَهُ", "ok": "Yâ nâsıre meni’stensareh", "tr": "Ey nusret isteyenleri inayetine mazhar eyleyen Nâsır!"}, {"ar": "يَا حَافِظَ مَنِ اسْتَحْفَظَهُ", "ok": "Yâ hâfiza meni’stahfazah", "tr": "Ey hıfz u riayetine dehâlet edenleri koruyup kollayan Hâfız!"}, {"ar": "يَا مُكْرِمَ مَنِ اسْتَكْرَمَهُ", "ok": "Yâ mükrime meni’stekremeh", "tr": "Ey keremini dileyenlere sınırsız ihsanlarda bulunan Mükrim!"}, {"ar": "يَا مُرْشِدَ مَنِ اسْتَرْشَدَهُ", "ok": "Yâ mürşide meni’sterşedeh", "tr": "Ey doğruyu arayanları en doğru noktaya ulaştıran Mürşid!"}, {"ar": "يَا مُعِينَ مَنِ اسْتَعَانَهُ", "ok": "Yâ mu’îne meni’ste’âneh", "tr": "Ey Kendisinden yardım dileyenleri yardımıyla sevindiren Muîn!"}, {"ar": "يَا مُغِيثَ مَنِ اسْتَغَاثَهُ", "ok": "Yâ muğîse meni’stağâseh", "tr": "Ey destek talep edenleri hiçbir zaman desteksiz bırakmayan Muğîs!"}, {"ar": "يَا صَرِيخَ مَنِ اسْتَصْرَخَهُ", "ok": "Yâ sarîha meni’stasrahah", "tr": "Ey feryad ü figan içerisinde el açanların feryadına cevap veren Sarîh!"}, {"ar": "يَا غَافِرَ مَنِ اسْتَغْفَرَهُ", "ok": "Yâ ğâfire meni’stağfereh", "tr": "Ey mağfiret dileyenleri affedip yarlığayan Ğâfir!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, hallisnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 31, "title": "Otuz Birinci Bâb", "e": [{"ar": "يَا كَرِيمَ الصَّفْحِ", "ok": "Yâ kerîme’s-safh", "tr": "Ey afv u müsamahası bol olan!"}, {"ar": "يَا عَظِيمَ الْمَنِّ", "ok": "Yâ azîme’l-menn", "tr": "Ey lütufları karşılıksız ve büyük olan!"}, {"ar": "يَا كَثِيرَ الْخَيْرِ", "ok": "Yâ kesîre’l-hayr", "tr": "Ey iyilikleri pek çok olan!"}, {"ar": "يَا قَدِيمَ الْفَضْلِ", "ok": "Yâ kadîme’l-fadl", "tr": "Ey fazlı ezelî ve nihayetsiz olan!"}, {"ar": "يَا لَطِيفَ الصُّنْعِ", "ok": "Yâ latîfe’s-sun’", "tr": "Ey sanatı en latîf inceliklerle bezeli olan!"}, {"ar": "يَا دَٓائِمَ اللُّطْفِ", "ok": "Yâ dâime’l-lutf", "tr": "Ey lütufları devamlı olan!"}, {"ar": "يَا نَافِسَ الْكَرْبِ", "ok": "Yâ nâfise’l-kerb", "tr": "Ey tasalarını gidermek suretiyle gamlı gönülleri ferahlatan!"}, {"ar": "يَا كَاشِفَ الضُّرِّ", "ok": "Yâ kâşife’d-durr", "tr": "Ey zararları kaldıran!"}, {"ar": "يَا مَالِكَ الْمُلْكِ", "ok": "Yâ mâlike’l-mülk", "tr": "Ey mülkün yegâne maliki olan!"}, {"ar": "يَا قَاضِيًا بِالْحَقِّ", "ok": "Yâ kâdıyen bi’l-hakk", "tr": "Ey her hükmünü hikmet ve adaletle ortaya koyan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 32, "title": "Otuz İkinci Bâb", "e": [{"ar": "يَا عَزِيزًا لَا يُضَامُ", "ok": "Yâ azîzen lâ yudâm", "tr": "Ey izzetine hiçbir elin ulaşıp zarar veremediği ve karşı koyamadığı Azîz!"}, {"ar": "يَا لَطِيفًا لَا يُرَامُ", "ok": "Yâ latîfen lâ yürâm", "tr": "Ey en ince noktalarına kadar her şeyi görüp bildiği hâlde Kendisi bir Mevcûd-u Meçhûl olan, verâların verâsında bulunan Latîf!"}, {"ar": "يَا رَقِيبًا لَا يَنَامُ", "ok": "Yâ rakîben lâ yenâm", "tr": "Ey zâhir-bâtın her şeyi her an görüp kontrol eden ve Kendisi için uyku gibi avârız asla söz konusu olmayan Rakîb!"}, {"ar": "يَا قَٓائِمًا لَا يَفُوتُ", "ok": "Yâ kâimen lâ yefût", "tr": "Ey her an ayrı bir şe’nde bulunan, kâinattaki tasarrufunda bir fasıla olmayan Kâim!"}, {"ar": "يَا حَيًّا لَا يَمُوتُ", "ok": "Yâ hayyen lâ yemût", "tr": "Ey ölüm Kendisine asla uğramayan ve uğramayacak olan, hayatı Kendinden, ebedî hayy olan Hayy!"}, {"ar": "يَا مَلِكًا لَا يَزُولُ", "ok": "Yâ meliken lâ yezûl", "tr": "Ey mülkü olan her şey ve herkes üzerindeki tasarrufu zeval bulmadan ebede kadar sürecek Melik!"}, {"ar": "يَا بَاقِيًا لَا يَفْنٰى", "ok": "Yâ bâkıyen lâ yefnâ", "tr": "Ey Kendisi için fena söz konusu olmayan Bâkî!"}, {"ar": "يَا عَالِمًا لَا يَجْهَلُ", "ok": "Yâ âlimen lâ yechel", "tr": "Ey olmuş-olacak, cüz’î-küllî her şeyi eksiksiz, tastamam bilen Alîm!"}, {"ar": "يَا صَمَدًا لَا يُطْعَمُ", "ok": "Yâ sameden lâ yut’am", "tr": "Ey herkes ve her nesne Kendisine her zaman muhtaç olduğu hâlde Kendisi hiçbir zaman hiçbir şeye ihtiyaç duymayan müstağni Samed!"}, {"ar": "يَا قَوِيًّا لَا يُضْعَفُ", "ok": "Yâ kaviyyen lâ yud’af", "tr": "Ey hiçbir acze düşmeden dilediğini dilediği gibi icra eden kuvvet sahibi Kaviyy!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 33, "title": "Otuz Üçüncü Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا وَاحِدُ", "ok": "Yâ Vâhid", "tr": "Ey nazîri, veziri, dengi, benzeri olmayan bir yektâ Vâhid!"}, {"ar": "يَا وَاجِدُ", "ok": "Yâ Vâcid", "tr": "Ey aczi söz konusu olmayan kâdir u kâhir Vâcid!"}, {"ar": "يَا شَاهِدُ", "ok": "Yâ Şâhid", "tr": "Ey her şeyi ra’ye’l-ayn bilen Şâhid!"}, {"ar": "يَا مَاجِدُ", "ok": "Yâ Mâcid", "tr": "Ey mutlak fazl ve şeref sahibi Mâcid!"}, {"ar": "يَا رَاشِدُ", "ok": "Yâ Râşid", "tr": "Ey en doğru noktaya ulaştıran Râşid!"}, {"ar": "يَا بَاعِثُ", "ok": "Yâ Bâ’is", "tr": "Ey diriliş erleri gönderen ve ölümden sonra dirilten Bâis!"}, {"ar": "يَا وَارِثُ", "ok": "Yâ Vâris", "tr": "Ey dilediğine dilediğini temlik eden gerçek sahip, Vâris!"}, {"ar": "يَا ضَٓارُّ", "ok": "Yâ Dârr", "tr": "Ey sebebiyet verenlere göre zararları yaratan Dârr!"}, {"ar": "يَا نَافِعُ", "ok": "Yâ Nâfi’", "tr": "Ey faydalı şeyler veren Nâfi’!"}, {"ar": "يَا هَادِي", "ok": "Yâ Hâdî", "tr": "Ey hidayete erdiren ve gönülleri hidayete açan Hâdî!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 34, "title": "Otuz Dördüncü Bâb", "e": [{"ar": "يَٓا اَعْظَمُ مِنْ كُلِّ عَظِيمٍ", "ok": "Yâ a’zamu min külli azîm", "tr": "Ey azamet ve ululuğu izafi büyüklüklerle mukayese edilemeyecek kadar büyük ve ulu olan Azîm!"}, {"ar": "يَٓا اَكْرَمُ مِنْ كُلِّ كَرِيمٍ", "ok": "Yâ ekremu min külli kerîm", "tr": "Ey keremi bütün keremlerin üstünde olan iyilik ve ihsanı bol keremkâni Kerîm!"}, {"ar": "يَٓا اَرْحَمُ مِنْ كُلِّ رَحِيمٍ", "ok": "Yâ erhamu min külli rahîm", "tr": "Ey sonsuz merhameti başka bütün merhametlerden üstün ve onların kaynağı olan Rahîm!"}, {"ar": "يَٓا اَحْكَمُ مِنْ كُلِّ حَكِيمٍ", "ok": "Yâ ahkemu min külli hakîm", "tr": "Ey hikmeti bütün hikmetleri aşkın olan, her şeyi yerli yerinde vaz’ eden Hakîm!"}, {"ar": "يَٓا اَعْلَمُ مِنْ كُلِّ عَلِيمٍ", "ok": "Yâ a’lemu min külli alîm", "tr": "Ey sınırsız ilmiyle bütün bilgileri, bilenleri ve bilinenleri kuşatan, olmuş-olacak, cüz’î-küllî her şeyi bilen Alîm!"}, {"ar": "يَٓا اَقْدَمُ مِنْ كُلِّ قَدِيمٍ", "ok": "Yâ akdemu min külli kadîm", "tr": "Ey hiçbir şey mevcut değil iken Kendisi var olan, varlığı ezelî olan Kadîm!"}, {"ar": "يَٓا اَكْبَرُ مِنْ كُلِّ كَبِيرٍ", "ok": "Yâ ekberu min külli kebîr", "tr": "Ey kibriyâ ve büyüklük sadece Yüce Zâtına mahsus olan Ekber!"}, {"ar": "يَٓا اَجَلُّ مِنْ كُلِّ جَلِيلٍ", "ok": "Yâ ecellu min külli celîl", "tr": "Ey celâl ve azametiyle bütün nefislerde ürperti ve haşyet hâsıl eden Celîl!"}, {"ar": "يَٓا اَعَزُّ مِنْ كُلِّ عَزِيزٍ", "ok": "Yâ e’azzu min külli azîz", "tr": "Ey eşi, benzeri olmayan yegâne galip ve Azîz!"}, {"ar": "يَٓا اَلْطَفُ مِنْ كُلِّ لَطِيفٍ", "ok": "Yâ altafu min külli latîf", "tr": "Ey sadece Kendisi en ince noktalara kadar ihtiyaçları görüp gözeten Latîf!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 35, "title": "Otuz Beşinci Bâb", "e": [{"ar": "يَا مَنْ هُوَ فِي عَهْدِهِ وَفِيٌّ", "ok": "Yâ men hüve fî ahdihi vefî", "tr": "Ey her vaadini mutlaka yerine getiren Vefiyy!"}, {"ar": "يَا مَنْ هُوَ فِي وَفَٓائِهِ قَوِيٌّ", "ok": "Yâ men hüve fî vefâihi kavî", "tr": "Ey her sözünü her zaman gerçekleştirmeye muktedir olan Kaviyy!"}, {"ar": "يَا مَنْ هُوَ فِي قُوَّتِهِ عَلِيٌّ", "ok": "Yâ men hüve fî kuvvetihi alî", "tr": "Ey sonsuz kuvvetin sahibi, kadri yüce, şanı yüksek, müteâl Aliyy!"}, {"ar": "يَا مَنْ هُوَ فِي عُلُوِّهِ قَرِيبٌ", "ok": "Yâ men hüve fî ulüvvihi karîb", "tr": "Ey yüceliğiyle beraber yakınlardan yakın Karîb!"}, {"ar": "يَا مَنْ هُوَ فِي قُرْبِهِ لَطِيفٌ", "ok": "Yâ men hüve fî kurbihi latîf", "tr": "Ey yakınlığıyla beraber görülüp ihata edilemeyen Latîf!"}, {"ar": "يَا مَنْ هُوَ فِي لُطْفِهِ شَرِيفٌ", "ok": "Yâ men hüve fî lutfihi şerîf", "tr": "Ey azamet ve ululuğuyla beraber âciz ve muhtaç kullarına lütuflarda bulunan Şerîf!"}, {"ar": "يَا مَنْ هُوَ فِي شَرَفِهِ عَزِيزٌ", "ok": "Yâ men hüve fî şerefihi azîz", "tr": "Ey şan ve şerefinde eşi, benzeri olmayan yegâne galip ve Azîz!"}, {"ar": "يَا مَنْ هُوَ فِي عِزَّتِهِ عَظِيمٌ", "ok": "Yâ men hüve fî izzetihi azîm", "tr": "Ey büyüklük ve ululuğunu izzetinde gösteren Azîm!"}, {"ar": "يَا مَنْ هُوَ فِي عَظَمَتِهِ مَجِيدٌ", "ok": "Yâ men hüve fî azametihi mecîd", "tr": "Ey azametinde zatî şan ve şeref sahibi Mecîd!"}, {"ar": "يَا مَنْ هُوَ فِي مَجْدِهِ حَمِيدٌ", "ok": "Yâ men hüve fî mecdihi hamîd", "tr": "Ey şan ve şerefiyle herkesin hamd ü senasının biricik mercii olan Hamîd!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 36, "title": "Otuz Altıncı Bâb", "e": [{"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ خَاضِعٌ لَهُ", "ok": "Yâ men hüve küllü şey’in hâdı’un leh", "tr": "Ey her şey Yüce Zâtına karşı kemerbeste-i ubûdiyet içinde boyun eğen!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ كَٓائِنٌ لَهُ", "ok": "Yâ men hüve küllü şey’in kâinun leh", "tr": "Ey her şey Kendisine ait ve Kendisi için olan!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ مَوْجُودٌ لَهُ", "ok": "Yâ men hüve küllü şey’in mevcûdun leh", "tr": "Ey kâinattaki her şey Kendisini gösteren bir ayna ve O’nu söyleyen talâkatlı bir dil olan!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ مُنِيبٌ لَهُ", "ok": "Yâ men hüve küllü şey’in münîbun leh", "tr": "Ey her şey tam bir teslimiyet içerisinde Kendisine teveccüh eden!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ خَٓائِفٌ مِنْهُ", "ok": "Yâ men hüve küllü şey’in hâifun minh", "tr": "Ey her şey gönlünün derinliklerinde haşyet edalı bir havf duygusu ile, her an üzerlerinde nigehbân bulunan Yüce Zâtından korkan!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ مُسَبِّحٌ لَهُ", "ok": "Yâ men hüve küllü şey’in müsebbihun leh", "tr": "Ey her şey, bütün noksanlardan müberra, münezzeh, muallâ ve mukaddes olan Zât-ı Pâkini tesbih eden!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ قَٓائِمٌ بِهِ", "ok": "Yâ men hüve küllü şey’in kâimun bih", "tr": "Ey her kimse ve her nesne sadece Kendisinin ayakta tutmasıyla kâim olan, ayakta duran!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ خَاشِعٌ لَهُ", "ok": "Yâ men hüve küllü şey’in hâşi’un leh", "tr": "Ey her varlık huşû içerisinde Kendisine kullukta bulunan!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ صَٓائِرٌ اِلَيْهِ", "ok": "Yâ men hüve küllü şey’in sâirun ileyh", "tr": "Ey her şey sonunda yalnız Kendisine dönen!"}, {"ar": "يَا مَنْ هُوَ كُلُّ شَيْءٍ هَالِكٌ اِلَّا وَجْهَهُ", "ok": "Yâ men hüve küllü şey’in hâlikun illâ vecheh", "tr": "Ey her şey mutlaka ölümü tadıp helak olan fakat Yüce Zâtı hep Bâkî kalan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 37, "title": "Otuz Yedinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا كَافِي", "ok": "Yâ Kâfî", "tr": "Ey rahmet ve kudreti, kullarının ihtiyaçlarını karşılamada ve sıkıntılarını gidermede yeterli olan Kâfî!"}, {"ar": "يَا شَافِي", "ok": "Yâ Şâfî", "tr": "Ey görünür ve görünmez hastalıklara şifalar bahşeden Şâfî!"}, {"ar": "يَا وَافِي", "ok": "Yâ Vâfî", "tr": "Ey vaatlerini mutlaka gerçekleştiren ve nimetlerini tamama erdiren Vâfî!"}, {"ar": "يَا مُعَافِي", "ok": "Yâ Mu’âfî", "tr": "Ey kullarına, nimetlerin en büyüklerinden olan sıhhat ve afiyet lutfeden Muâfî!"}, {"ar": "يَا عَالِي", "ok": "Yâ Âlî", "tr": "Ey kadri yüce, şanı yüksek, müteâl Âlî!"}, {"ar": "يَا دَاعِي", "ok": "Yâ Dâ’î", "tr": "Ey kullarını değişik işaret ve yollarla hak ve hakikate çağıran Dâî!"}, {"ar": "يَا رَاضِي", "ok": "Yâ Râdî", "tr": "Ey sevdiği kullarını, bütün lütuflarından daha büyük olan rıza ve rıdvanına mazhar kılan Râdî!"}, {"ar": "يَا قَاضِي", "ok": "Yâ Kâdî", "tr": "Ey yarattıklarının ihtiyaçlarını gideren ve hükmünü adalet ve hikmetine muvafık olarak her zaman kullarının maslahatları istikametinde vaz’ eden Kâdî!"}, {"ar": "يَا بَاقِي", "ok": "Yâ Bâkî", "tr": "Ey Kendisi için fena söz konusu olmayan, varlığı ebedî olan Bâkî!"}, {"ar": "يَا هَادِي", "ok": "Yâ Hâdî", "tr": "Ey hidayete erdiren ve gönülleri hidayete açan Hâdî!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 38, "title": "Otuz Sekizinci Bâb", "e": [{"ar": "يَا مَنْ لَا مَفَرَّ اِلَّٓا اِلَيْهِ", "ok": "Yâ men lâ meferre illâ ileyh", "tr": "Ey Kendisinden başka, varlığın dağdağasından, masiyetlerin çirkinliğinden ve Cehennem azabından kaçıp sığınılabilecek bir himaye sahibi olmayan!"}, {"ar": "يَا مَنْ لَا مَفْزَعَ اِلَّٓا اِلَيْهِ", "ok": "Yâ men lâ mefze’a illâ ileyh", "tr": "Ey Kendi sıyanetinden başka, değişik endişe ve korkular karşısında girilebilecek bir korunak bulunmayan!"}, {"ar": "يَا مَنْ لَا مَلْجَأَ اِلَّٓا اِلَيْهِ", "ok": "Yâ men lâ melce’e illâ ileyh", "tr": "Ey Kendi rahmet ve inayetinden başka iltica edilebilecek bir melce bulunmayan!"}, {"ar": "يَا مَنْ لَا يُتَوَكَّلُ اِلَّا عَلَيْهِ", "ok": "Yâ men lâ yütevekkelu illâ aleyh", "tr": "Ey sadece Yüce Zâtına tevekkül edilen, başka bir tevekkül mercii olmayan!"}, {"ar": "يَا مَنْ لَا مَقْصَدَ اِلَّٓا اِلَيْهِ", "ok": "Yâ men lâ maksade illâ ileyh", "tr": "Ey Maksûd-u Bilistihkak olan Yüce Zâtından başka teveccühte bulunmaya değer hakikî bir maksut bulunmayan!"}, {"ar": "يَا مَنْ لَا مَنْجَى اِلَّٓا اِلَيْهِ", "ok": "Yâ men lâ mencâ illâ ileyh", "tr": "Ey Kendi kapısından başka kapılarda necat ve felâha ermek mümkün olmayan!"}, {"ar": "يَا مَنْ لَا يُرْغَبُ اِلَّٓا اِلَيْهِ", "ok": "Yâ men lâ yürğabu illâ ileyh", "tr": "Ey Kendisinden başka bizzat talep edilmeye layık bir matlup bulunmayan!"}, {"ar": "يَا مَنْ لَا يُعْبَدُ اِلَّٓا اِيَّاهُ", "ok": "Yâ men lâ yu’bedu illâ iyyâh", "tr": "Ey Mâbud-u Bilhak olan ve Kendisinden başka ibadet edilmeye layık hiçbir şey bulunmayan!"}, {"ar": "يَا مَنْ لَا يُسْتَعَانُ اِلَّا مِنْهُ", "ok": "Yâ men lâ yüste’ânu illâ minh", "tr": "Ey yardım ve inayet yalnız Kendisinden talep edilen, başka gerçek bir yardım mercii bulunmayan!"}, {"ar": "يَا مَنْ لَا حَوْلَ وَلَا قُوَّةَ اِلَّا بِهِ", "ok": "Yâ men lâ havle ve lâ kuvvete illâ bih", "tr": "Ey Kendisinden başka hakikî bir güç ve kuvvet sahibi olmayan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 39, "title": "Otuz Dokuzuncu Bâb", "e": [{"ar": "يَا خَيْرَ الْمَرْهُوبِينَ", "ok": "Yâ hayre’l-merhûbîn", "tr": "Ey rehbet ve korku hisleriyle sadece Kendisine firar edilen!"}, {"ar": "يَا خَيْرَ الْمَطْلُوبِينَ", "ok": "Yâ hayre’l-matlûbîn", "tr": "Ey Kendisinin talep edilmesi, talepler içerisinde en yüksek kıymeti ifade eden!"}, {"ar": "يَا خَيْرَ الْمَرْغُوبِينَ", "ok": "Yâ hayre’l-merğûbîn", "tr": "Ey sadece yüce nezdindekiler rağbet gösterilmeye layık olan!"}, {"ar": "يَا خَيْرَ الْمَسْئُولِينَ", "ok": "Yâ hayre’l-mes’ûlîn", "tr": "Ey bizzat Kendisi istenilmeye ve yalnız Kendisinden istenilmeye layık bulunan!"}, {"ar": "يَا خَيْرَ الْمَقْصُودِينَ", "ok": "Yâ hayre’l-maksûdîn", "tr": "Ey sadece Kendi teveccühü değerler üstü değer ifade eden!"}, {"ar": "يَا خَيْرَ الْمَذْكُورِينَ", "ok": "Yâ hayre’l-mezkûrîn", "tr": "Ey bir tek Yüce Zâtının zikri kalblere itminan veren!"}, {"ar": "يَا خَيْرَ الْمَشْكُورِينَ", "ok": "Yâ hayre’l-meşkûrîn", "tr": "Ey şükür ve şükranla anılmaya en layık olan!"}, {"ar": "يَا خَيْرَ الْمَحْبُوبِينَ", "ok": "Yâ hayre’l-mahbûbîn", "tr": "Ey sevgisi her şeyin başı ve bütün sevgilerin de en saf, en duru kaynağı olan!"}, {"ar": "يَا خَيْرَ الْمُنْزِلِينَ", "ok": "Yâ hayre’l-münzilîn", "tr": "Ey kullarının maslahatı için katından hep güzel ve faydalı şeyler indiren!"}, {"ar": "يَا خَيْرَ الْمُسْتَاْنِسِينَ", "ok": "Yâ hayre’l-müste’nisîn", "tr": "Ey hayatlarını üns billah atmosferinde sürdürenlere asla yalnızlık yaşatmayan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 40, "title": "Kırkıncı Bâb", "e": [{"ar": "يَا مَنْ هُوَ خَلَقَ فَسَوّٰى", "ok": "Yâ men hüve halaka fesevvâ", "tr": "Ey yaratan ve en mükemmel şekli veren!"}, {"ar": "يَا مَنْ هُوَ قَدَّرَ فَهَدٰى", "ok": "Yâ men hüve kaddere fehedâ", "tr": "Ey her canlıya bir ölçüye göre vücut urbası giydiren ve ona yaratılış gayesine giden yolları gösteren!"}, {"ar": "يَا مَنْ هُوَ يَكْشِفُ الْبَلْوٰى", "ok": "Yâ men hüve yekşifu’l-belvâ", "tr": "Ey belâları def’ ü ref’ eden!"}, {"ar": "يَا مَنْ هُوَ يَسْمَعُ النَّجْوٰى", "ok": "Yâ men hüve yesme’u’n-necvâ", "tr": "Ey en gizli fısıltıları bile duyup işiten!"}, {"ar": "يَا مَنْ هُوَ يُنْقِذُ الْغَرْقٰى", "ok": "Yâ men hüve yünkızu’l-ğarkâ", "tr": "Ey maddî mânevî musibetlere maruz kalıp da boğulmak üzere olanları kurtaran!"}, {"ar": "يَا مَنْ هُوَ يُنْجِي الْهَلْكٰى", "ok": "Yâ men hüve yünci’l-helkâ", "tr": "Ey helâke sürüklenenleri necata kavuşturan!"}, {"ar": "يَا مَنْ هُوَ يَشْفِي الْمَرْضٰى", "ok": "Yâ men hüve yeşfi’l-merdâ", "tr": "Ey hasta kullarına şifa bahşeden!"}, {"ar": "يَا مَنْ هُوَ اَمَاتَ وَأَحْيَا", "ok": "Yâ men hüve emâte ve ahyâ", "tr": "Ey maddî-mânevî hayat veren ve verdiği hayatı alıp öldüren!"}, {"ar": "يَا مَنْ هُوَ اَضْحَكَ وَاَبْكٰى", "ok": "Yâ men hüve adhake ve ebkâ", "tr": "Ey güldüren ve ağlatan!"}, {"ar": "يَا مَنْ هُوَ اَضَلَّ وَاَهْدٰى", "ok": "Yâ men hüve adalle ve ehdâ", "tr": "Ey isyanda ısrar ederek kalblerindeki inanma istidadını köreltenleri dalâletleriyle baş başa bırakan ve dilediği kullarını hidayete erdiren, gönüllerini hidayete açan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 41, "title": "Kırk Birinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "tr": "Allahım! Senden şu birbirinden güzel isimlerinin hakkı için diliyor ve dileniyorum:"}, {"ar": "يَا غَافِرُ", "ok": "Yâ Ğâfir", "tr": "Ey her türlü günah ve hataları yarlığayan Ğâfir!"}, {"ar": "يَا سَاتِرُ", "ok": "Yâ Sâtir", "tr": "Ey ayıp ve kusurları örtüp gizleyen Sâtir!"}, {"ar": "يَا قَاهِرُ", "ok": "Yâ Kâhir", "tr": "Ey her şeyi Kendi iradesine râm eden Kâhir!"}, {"ar": "يَا قَادِرُ", "ok": "Yâ Kâdir", "tr": "Ey her şeye gücü yeten Kâdir!"}, {"ar": "يَا نَاظِرُ", "ok": "Yâ Nâzır", "tr": "Ey açık gizli her şeyi görüp kontrol eden Nâzır!"}, {"ar": "يَا فَاطِرُ", "ok": "Yâ Fâtır", "tr": "Ey mevcudatı yoktan ve emsalsiz şekilde yaratan Fâtır!"}, {"ar": "يَا شَاكِرُ", "ok": "Yâ Şâkir", "tr": "Ey şükredeni karşılıksız bırakmayan ihsan sahibi Şâkir!"}, {"ar": "يَا ذَاكِرُ", "ok": "Yâ Zâkir", "tr": "Ey Kendisini zikr u fikr u ibadetle yâd eden kullarını teşrif ve tekrimle anan Zâkir!"}, {"ar": "يَا نَاصِرُ", "ok": "Yâ Nâsır", "tr": "Ey inanan kullarını salih amellerinde ve zor anlarında yardımsız bırakmayan Nâsır!"}, {"ar": "يَا جَابِرُ", "ok": "Yâ Câbir", "tr": "Ey dilediğine cebr ile iş yaptıran ve kullarının kırık döküklerini sarıp sarmalayan, işlerini düzeltip eksiklerini gideren Câbir!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 42, "title": "Kırk İkinci Bâb", "e": [{"ar": "يَا مَنْ هُوَ فِي الْبَرِّ وَالْبَحْرِ سَبِيلُهُ", "ok": "Yâ men hüve fi’l-berri ve’l-bahri sebîlüh", "tr": "Ey karaları ve denizleri kullarına musahhar eden ve onlarda türlü türlü yollar var eden!"}, {"ar": "يَا مَنْ هُوَ فِي اْلاٰفَاقِ اٰيَاتُهُ", "ok": "Yâ men hüve fi’l-âfâkı âyâtüh", "tr": "Ey kendi nefislerinde yarattığı gibi, dış dünyada da insanlar için Hakk’ın varlık ve birliğine deliller yaratan!"}, {"ar": "يَا مَنْ هُوَ فِي اْلاٰيَاتِ بُرْهَانُهُ", "ok": "Yâ men hüve fi’l-âyâti bürhânüh", "tr": "Ey her bir âyet Kendi varlık, rahmet ve kudretine apaçık bir burhan olan!"}, {"ar": "يَا مَنْ هُوَ فِي الْمَمَاتِ قُدْرَتُهُ", "ok": "Yâ men hüve fi’l-memâti kudretüh", "tr": "Ey ölümlerde kudretinin tecellilerini sergileyen!"}, {"ar": "يَا مَنْ هُوَ فِي الْقُبُورِ عِزَّتُهُ", "ok": "Yâ men hüve fi’l-kubûri izzetüh", "tr": "Ey kabir âleminde izzet ve azameti daha açık ve net görünen!"}, {"ar": "يَا مَنْ هُوَ فِي الْقِيَامَةِ مِلْكَتُهُ", "ok": "Yâ men hüve fi’l-kıyâmeti milketüh", "tr": "Ey yevm-i kıyamette, esbap perdesi ortadan kalktığında, her şeyin malik ve hâkimi olduğu, herkes tarafından hakka’l-yakîn anlaşılacak olan!"}, {"ar": "يَا مَنْ هُوَ فِي الْحِسَابِ هَيْبَتُهُ", "ok": "Yâ men hüve fi’l-hisâbi heybetüh", "tr": "Ey hesap gününde heybet ve mehâbeti en âşikâr şekilde görülecek olan!"}, {"ar": "يَا مَنْ هُوَ فِي الْمِيزَانِ قَضَٓائُهُ", "ok": "Yâ men hüve fi’l-mîzâni kadâüh", "tr": "Ey mizanda bütün amellerin karşılığını eksiksiz, tastamam veren!"}, {"ar": "يَا مَنْ هُوَ فِي الْجَنَّةِ رَحْمَتُهُ", "ok": "Yâ men hüve fi’l-cenneti rahmetüh", "tr": "Ey Cennet’te mü’min kullarına rahmetinin bütün eserlerini sergileyen!"}, {"ar": "يَا مَنْ هُوَ فِي النَّارِ عَذَابُهُ", "ok": "Yâ men hüve fi’n-nâri azâbüh", "tr": "Ey inkârcı ve isyankârlara karşı Cehennem’de azabıyla tecelli eden!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 43, "title": "Kırk Üçüncü Bâb", "e": [{"ar": "يَا مَنْ هُوَ اِلَيْهِ يَهْرَبُ الْخَٓائِفُونَ", "ok": "Yâ men hüve ileyhi yehrebu’l-hâifûn", "tr": "Ey havf ve haşyet yaşayanlar sadece Kendisine yönelen!"}, {"ar": "يَا مَنْ هُوَ اِلَيْهِ يَفْزَعُ الْمُذْنِبُونَ", "ok": "Yâ men hüve ileyhi yefze’u’l-müznibûn", "tr": "Ey günaha düşenler rahmetine sığınan!"}, {"ar": "يَا مَنْ هُوَ اِلَيْهِ يَقْصِدُ الْمُنِيبُونَ", "ok": "Yâ men hüve ileyhi yaksıdu’l-münîbûn", "tr": "Ey tevbe ve inabede bulunanlar yüce dergâhına teveccüh eden!"}, {"ar": "يَا مَنْ هُوَ اِلَيْهِ يَلْجَأُ الْعَاصُونَ", "ok": "Yâ men hüve ileyhi yelce’u’l-âsûn", "tr": "Ey isyankâr duruma düşenler afv u safhına iltica eden!"}, {"ar": "يَا مَنْ هُوَ اِلَيْهِ يَرْغَبُ الزَّاهِدُونَ", "ok": "Yâ men hüve ileyhi yerğabu’z-zâhidûn", "tr": "Ey dünyanın faniyât u zâilâtını terk eden zâhitler yüce nezdindeki bâkiyât u salihâta göz diken!"}, {"ar": "يَا مَنْ هُوَ فِيهِ يَطْمَعُ الْخَاطِؤُنَ", "ok": "Yâ men hüve fîhi yatme’u’l-hâtı’ûn", "tr": "Ey hata ve günahla tökezleyenler sadece sonsuz rahmetinden af bekleyen!"}, {"ar": "يَا مَنْ هُوَ يَسْتَاْنِسُ بِهِ الْمُرِيدُونَ", "ok": "Yâ men hüve yeste’nisu bihi’l-mürîdûn", "tr": "Ey Hakk’ın rıza ve hoşnutluğunu kendi istek ve dileklerine tercih edenler yalnız Kendisiyle ünse eren!"}, {"ar": "يَا مَنْ هُوَ يَفْتَخِرُ بِهِ الْمُحْسِنُونَ", "ok": "Yâ men hüve yeftahıru bihi’l-muhsinûn", "tr": "Ey ihsana kilitlenmiş muhsinler amellerini sadece Yüce Zâtına arz etmeye niyet eden ve bununla iftihar eden!"}, {"ar": "يَا مَنْ هُوَ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ", "ok": "Yâ men hüve aleyhi yetevekkelu’l-mütevekkilûn", "tr": "Ey bir istinat noktası arayanlar yalnız Kendisine tevekkül eden!"}, {"ar": "يَا مَنْ هُوَ يَسْكُنُ بِهِ الْمُوقِنُونَ", "ok": "Yâ men hüve yeskünü bihi’l-mûkınûn", "tr": "Ey yakîn ufuklarında dolaşanlar bir tek Kendisiyle sükûn ve huzur bulan!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 44, "title": "Kırk Dördüncü Bâb", "e": [{"ar": "يَٓا اَقْرَبُ مِنْ كُلِّ قَرِيبٍ", "ok": "Yâ akrebu min külli karîb", "tr": "Ey her şeye her şeyden daha yakın Karîb!"}, {"ar": "يَٓا اَحَبُّ مِنْ كُلِّ حَبِيبٍ", "ok": "Yâ ehabbu min külli habîb", "tr": "Ey sevgisi dinimiz, imanımız, cesetlerde canımız Sevgililer Sevgilisi Habîb!"}, {"ar": "يَٓا اَعْظَمُ مِنْ كُلِّ عَظِيمٍ", "ok": "Yâ a’zamu min külli azîm", "tr": "Ey en büyük ve ulu olan Azîm!"}, {"ar": "يَٓا اَعَزُّ مِنْ كُلِّ عَزِيزٍ", "ok": "Yâ e’azzu min külli azîz", "tr": "Ey eşi, benzeri olmayan yegâne galip ve Azîz!"}, {"ar": "يَٓا اَقْوٰى مِنْ كُلِّ قَوِىٍّ", "ok": "Yâ akvâ min külli kavî", "tr": "Ey dilediğini dilediği gibi icra eden, gerçek güç ve kuvvetin yegâne sahibi Kaviyy!"}, {"ar": "يَٓا اَغْنٰى مِنْ كُلِّ غَنِىٍّ", "ok": "Yâ ağnâ min külli ğanî", "tr": "Ey kimseye muhtaç olmayan fakat başka her şey Kendisine muhtaç olan Ğaniyy!"}, {"ar": "يَٓا اَجْوَدُ مِنْ كُلِّ جَوَادٍ", "ok": "Yâ ecvedu min külli cevâd", "tr": "Ey Cömertler Cömerdi Cevâd!"}, {"ar": "يَٓا اَرْأَفُ مِنْ كُلِّ رَؤُوفٍ", "ok": "Yâ er’efu min külli re’ûf", "tr": "Ey re’fet ve şefkati bütün şefkatlerin kaynağı olanı Raûf!"}, {"ar": "يَٓا اَرْحَمُ مِنْ كُلِّ رَحِيمٍ", "ok": "Yâ erhamu min külli rahîm", "tr": "Ey Merhametliler Merhametlisi Rahîm!"}, {"ar": "يَٓا اَجَلُّ مِنْ كُلِّ جَلِيلٍ", "ok": "Yâ ecellu min külli celîl", "tr": "Ey celâl ve azametiyle bütün nefislerde ürperti ve haşyet hâsıl eden Celîl!"}], "c": {"ar": "سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّٓا اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ", "ok": "Sübhâneke yâ lâ ilâhe illâ ente’l-emâne’l-emân, ecirnâ mine’n-nâr", "tr": "Sübhansın Allahım, bütün noksanlardan münezzehsin, yücesin. Senden başka ilâh yoktur. Eman diliyoruz Senden, muhafaza buyur bizi Cehennem’den."}}, {"n": 45, "title": "Kırk Beşinci Bâb", "e": [{"ar": "وَاَسْأَلُكَ بِاَسْمَٓائِكَ", "ok": "Ve es’elüke bi-esmâike", "
